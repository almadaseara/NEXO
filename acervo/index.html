<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Acervo Digital Pessoal — NEXO Revisão</title>
  <meta name="description" content="Acervo Digital Pessoal do NEXO Revisão: cadernos para escrever à mão, anotar PDFs e revisar." />
  <meta name="theme-color" content="#142b30" />
  <!-- O Acervo só roda dentro do NEXO (index.html), que dá o menu, o cabeçalho e o login. -->
  <script>
    document.documentElement.classList.add('auth-pending');
    if (window.top === window) location.replace('../#acervo' + (location.hash ? '/' + location.hash.slice(1) : ''));
  </script>
  <script src="../auth-config.js"></script>
  <!-- Guarda de login: exige a sessão do Supabase do NEXO e um perfil de aluno ativo
       (profiles.active === true e can_student), o mesmo que o index.html valida no login.
       O perfil vem do próprio NEXO (window.parent.nexoAcervoPerfil, em ui/nexo-acervo.js):
       um segundo cliente do Supabase aqui disputaria a renovação do token com a página principal. -->
  <script>
    (function () {
      if (window.top === window) return;
      function sair() { try { window.top.location.replace('../'); } catch (e) { location.replace('../'); } }
      function sessao() {
        try {
          var ref = new URL(NEXO_AUTH.supabaseUrl).hostname.split('.')[0];
          var s = JSON.parse(localStorage.getItem('sb-' + ref + '-auth-token') || 'null');
          return s && s.user && s.user.id ? s : null;
        } catch (e) { return null; }
      }
      function perfil() { try { return window.parent.nexoAcervoPerfil(); } catch (e) { return null; } }
      var tentativas = 0;
      (function checar() {
        var s = sessao(), p = perfil();
        if (s && p && p.id === s.user.id) return document.documentElement.classList.remove('auth-pending');
        if (s && tentativas++ < 40) return setTimeout(checar, 250); // o NEXO ainda carregando o perfil
        sair();
      })();
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ BIBLIOTECA ============ -->
  <!-- A navegação principal é a do NEXO; aqui ficam só as seções internas. -->
  <div id="library" class="view">
    <main class="lib-main">
      <header class="nx-head">
        <div>
          <h1 id="lib-title">Todos os cadernos</h1>
          <p>Acervo Digital Pessoal: escreva à mão, anote PDFs e revise. Tudo fica guardado neste aparelho.</p>
        </div>
        <span class="lib-count" id="lib-count"></span>
      </header>
      <nav class="nx-seg lib-seg" aria-label="Seções do acervo">
        <button type="button" data-nav="all"><svg viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Todos os cadernos</button>
        <button type="button" data-nav="favorites"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.6-4.2 3.8 1.2 5.5L12 16l-5 2.9 1.2-5.5L4 9.6 9.6 9z"/></svg>Favoritos</button>
        <button type="button" data-nav="study"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>Estudar<span class="badge" id="study-due" hidden></span></button>
        <button type="button" data-nav="bookmarks"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg>Páginas marcadas</button>
      </nav>
      <section class="nx-panel lib-panel">
        <div class="lib-controls">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            <input id="search" type="search" placeholder="Buscar em cadernos, PDFs e textos…" autocomplete="off" aria-label="Buscar no acervo" />
          </label>
          <div class="header-actions">
            <button class="btn" id="btn-folder-menu" hidden><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Pasta</span></button>
            <select id="sort" class="select" aria-label="Ordenar">
              <option value="updated">Recentes</option>
              <option value="title">Nome</option>
              <option value="created">Criação</option>
            </select>
            <button class="btn" id="btn-import-pdf"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/></svg><span>Importar PDF</span></button>
            <button class="btn primary" id="btn-new-notebook"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Novo</span></button>
            <button class="icon-btn" id="btn-lib-more" title="Assistente de IA e backup" aria-label="Mais opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
          </div>
        </div>
        <section id="lib-content" class="lib-content"></section>
      </section>
    </main>
  </div>

  <!-- ============ EDITOR ============ -->
  <div id="editor" class="view" hidden>
    <header class="toolbar">
      <div class="tb-group">
        <button class="icon-btn" id="ed-back" title="Voltar ao acervo" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="icon-btn" id="ed-pages" title="Miniaturas das páginas" aria-label="Páginas"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
        <input id="ed-title" class="title-input" aria-label="Título do caderno" />
      </div>

      <div class="tb-group tools" id="tools">
        <button class="tool" data-tool="pen" title="Caneta (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4"/></svg></button>
        <button class="tool" data-tool="highlighter" title="Marca-texto (H)"><svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h3l3-3M9 14l7-10 4 4-10 6z M4 21h16"/></svg></button>
        <button class="tool" data-tool="eraser" title="Borracha (E)"><svg viewBox="0 0 24 24"><path d="M8 20h12M5 15l9-10 6 6-8 9H9z M9 11l6 6"/></svg></button>
        <button class="tool" data-tool="lasso" title="Laço — selecionar (L)"><svg viewBox="0 0 24 24"><path d="M12 4c5 0 8 2.5 8 5.5S16.5 15 12 15s-8-2.5-8-5.5S7 4 12 4z" stroke-dasharray="3 2.4"/><path d="M7 14c-1 2 0 4 2 5"/></svg></button>
        <button class="tool" data-tool="text" title="Texto (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
        <button class="tool" data-tool="tape" title="Fita — esconde respostas (F)"><svg viewBox="0 0 24 24"><path d="M3 9l15-5 3 8-15 5z"/><path d="M7 7.6l2.6 7.8M12 6l2.6 7.8" stroke-dasharray="2 2"/></svg></button>
        <button class="tool" data-tool="laser" title="Laser (K)"><svg viewBox="0 0 24 24"><circle cx="17" cy="7" r="3"/><path d="M14.5 9.5L4 20"/><path d="M17 1.5V3M22.5 7H21M20.9 3.1l-1 1"/></svg></button>
        <button class="tool" data-tool="stickers" title="Figurinhas"><svg viewBox="0 0 24 24"><path d="M14 3H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h7l7-7V7a4 4 0 0 0-4-4z"/><path d="M14 21v-4a3 3 0 0 1 3-3h4"/><circle cx="9" cy="9.5" r="1"/><circle cx="14" cy="9.5" r="1"/><path d="M8.5 13.5c1.5 1.5 4 1.5 5.5 0"/></svg></button>
        <button class="tool" data-tool="image" title="Inserir imagem"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></button>
        <button class="tool" data-tool="hand" title="Mover a tela (espaço)"><svg viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5V4.5a1.5 1.5 0 0 1 3 0V11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L3 14a1.5 1.5 0 0 1 2.3-1.9z"/></svg></button>
      </div>

      <div class="tb-group" id="tool-options"></div>

      <div class="tb-group right">
        <button class="icon-btn" id="ed-undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
        <button class="icon-btn" id="ed-redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h2"/></svg></button>
        <button class="icon-btn" id="ed-record" title="Gravar áudio sincronizado com a escrita" aria-label="Gravar áudio"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="rec-time" id="rec-time"></span></button>
        <button class="icon-btn" id="ed-ai" title="Assistente de IA" aria-label="Assistente de IA"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
        <button class="icon-btn" id="ed-search" title="Buscar no caderno (Ctrl+F)" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></button>
        <button class="icon-btn" id="ed-bookmark" title="Marcar página atual" aria-label="Marcar página"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
        <button class="icon-btn" id="ed-add-page" title="Adicionar página" aria-label="Adicionar página"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM13 11v6M10 14h6"/></svg></button>
        <button class="icon-btn" id="ed-more" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      </div>
    </header>

    <div class="ed-body">
      <aside class="thumbs" id="thumbs" hidden></aside>
      <div class="canvas-scroll" id="scroller">
        <div class="pages" id="pages"></div>
      </div>
      <div class="find-bar" id="find-bar" hidden>
        <input id="find-input" type="search" placeholder="Buscar neste caderno…" />
        <span id="find-count"></span>
        <button class="icon-btn small" id="find-prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon-btn small" id="find-next" aria-label="Próximo"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="icon-btn small" id="find-close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="zoom-ctl">
        <button class="icon-btn small" id="zoom-out" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="zoom-label" id="zoom-label" title="Ajustar à largura">100%</button>
        <button class="icon-btn small" id="zoom-in" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
      <div class="page-indicator" id="page-indicator"></div>
      <div class="player" id="player" hidden></div>
      <div class="present-bar" id="present-bar" hidden>
        <button class="icon-btn" id="pr-prev" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span id="pr-count"></span>
        <button class="icon-btn" id="pr-next" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <span class="opt-sep"></span>
        <button class="icon-btn" id="pr-laser" title="Laser" aria-label="Laser"><svg viewBox="0 0 24 24"><circle cx="17" cy="7" r="3"/><path d="M14.5 9.5L4 20"/></svg></button>
        <button class="icon-btn" id="pr-pen" title="Caneta" aria-label="Caneta"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/></svg></button>
        <button class="icon-btn" id="pr-exit" title="Sair da apresentação (Esc)" aria-label="Sair"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </div>

  <input type="file" id="file-pdf" accept="application/pdf" hidden />
  <input type="file" id="file-image" accept="image/*" hidden />
  <input type="file" id="file-template" accept="image/*,application/pdf" hidden />
  <input type="file" id="file-backup" accept="application/json,.json" hidden />
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
