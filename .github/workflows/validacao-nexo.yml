name: Validacao continua NEXO

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/temas/**'
      - 'temas/**'
      - 'ui/**'
      - 'tools/validar-temas.js'
      - 'tools/testar-site.py'
      - '.github/workflows/validacao-nexo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-nexo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar temas e navegacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar temas
        run: node tools/validar-temas.js
      - name: Instalar Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar site
        run: python3 tools/testar-site.py
