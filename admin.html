<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO Admin</title>
<style>
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f7faf8;color:#16312a;display:grid;place-items:center;min-height:100vh}
.card{width:min(560px,92vw);background:#fff;border:1px solid #d9e5df;border-radius:18px;padding:28px;box-shadow:0 18px 55px rgba(28,70,56,.08)}
h1{margin:0 0 10px}.muted{color:#6f817a;line-height:1.55}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:10px;background:#1f7a60;color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf5f0;color:#246a55;font-size:12px;font-weight:800}
#adminContent{display:none}.error{color:#a94442}
</style>
</head>
<body>
<div class="card">
<span class="badge">ÁREA ADMINISTRATIVA</span>
<h1>NEXO Admin</h1>
<p id="status" class="muted">Validando sua sessão administrativa...</p>
<div id="adminContent">
  <p class="muted">Acesso administrativo confirmado. O controle operacional do Robô de Questões continua protegido também pelas permissões do GitHub.</p>
  <a class="btn" href="https://github.com/almadaseara/NEXO/actions/workflows/question-robot.yml">Abrir painel do Robô de Questões</a>
  <button class="btn" style="margin-left:8px;background:#fff;color:#315c4e;border:1px solid #d7e3de" onclick="logout()">Sair</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script>
const nexoSupabase=window.supabase.createClient(NEXO_AUTH.supabaseUrl,NEXO_AUTH.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
async function logout(){await nexoSupabase.auth.signOut();sessionStorage.clear();location.href='./'}
(async()=>{
  const status=document.getElementById('status');
  const {data:{session}}=await nexoSupabase.auth.getSession();
  if(!session){location.replace('./');return}
  const {data:profile,error}=await nexoSupabase.from('profiles').select('role,active').eq('id',session.user.id).single();
  if(error || !profile || profile.active===false || profile.role!=='admin'){
    status.className='error';
    status.textContent='Acesso administrativo não autorizado.';
    setTimeout(()=>location.replace('./'),1200);
    return;
  }
  status.textContent='Administrador autenticado.';
  document.getElementById('adminContent').style.display='block';
})();
</script>
</body>
</html>
