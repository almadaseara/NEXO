">Abrir decisão sobre ADI 4.650 ↗</a>"],["Autonomia partidária — limite constitucional","<b>Tese de revisão:</b> a autonomia dos partidos não é absoluta; ela convive com os valores constitucionais do regime democrático, pluripartidarismo, soberania nacional e direitos fundamentais. Em prova objetiva, o art. 17 continua sendo a referência principal."]],"questions":[],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"organizacao_estado","title":"Organização Político-Administrativa","priority":"MUITO ALTA","focus":"Arts. 18 a 36: Federação, entes federados, competências, bens públicos e intervenção.","summary":["Tema de <mark>altíssima incidência</mark>. A AOCP cobra com frequência a estrutura da Federação, a autonomia dos entes e a repartição de competências.","É fundamental diferenciar: <u>competências exclusivas/privativas da União</u>, <u>competências comuns</u>, <u>competências concorrentes</u> e a competência remanescente dos Estados.","Outro bloco importante é o da <mark>intervenção federal e estadual</mark>, com atenção às hipóteses e ao caráter excepcional do instituto."],"highlights":["Art. 18: entes da Federação.","Art. 19: vedações federativas.","Arts. 21 a 24: repartição de competências.","Art. 25: competência remanescente dos Estados.","Art. 30: competências dos Municípios.","Arts. 34 e 35: intervenção."],"pegadinhas":["DF não pode ser dividido em Municípios.","Competência privativa não é o mesmo que competência exclusiva.","Estados possuem competência remanescente/residual."],"law_items":[["Art. 18","A organização político-administrativa da República compreende <mark>União</mark>, <mark>Estados</mark>, <mark>DF</mark> e <mark>Municípios</mark>, todos autônomos."],["Art. 19","Estabelece as <mark>vedações constitucionais</mark> aos entes federativos."],["Arts. 21 a 24","Bloco central sobre competências administrativas e legislativas."],["Art. 25","Organização dos Estados e competência remanescente."],["Art. 30","Competências dos Municípios."],["Arts. 34 e 35","Hipóteses de <mark>intervenção federal</mark> e <mark>intervenção estadual</mark>."]],"juris":[["ADI 6.341 — competências federativas concorrentes","<b>Decisão:</b> ao examinar medidas de enfrentamento da Covid-19, o STF reafirmou que a atuação federal não elimina competências de Estados, DF e Municípios em matérias constitucionalmente compartilhadas.<br><br><b>Para prova:</b> competência federativa deve ser lida de modo cooperativo e conforme a repartição constitucional dos arts. 21 a 24 e 30.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=441447\" target=\"_blank\">Abrir notícia oficial da ADI 6.341 ↗</a>"],["Federalismo cooperativo","<b>Tese de revisão:</b> o STF utiliza a ideia de federalismo cooperativo para solucionar conflitos de competência, sem anular a autonomia constitucional dos entes. A análise deve considerar matéria, predominância do interesse e dispositivo constitucional específico."]],"questions":[{"num":"Q61","source":"AOCP - Analista","topic":"Autonomia dos Entes - Art. 18","text":"A organização político-administrativa da República Federativa do Brasil compreende a União, os Estados, o Distrito Federal e os Municípios, todos autônomos. É correto afirmar que:","options":["os Municípios possuem direito de secessionismo mediante plebiscito.","Brasília é a Capital Federal e pode ser dividida em Municípios autônomos.","a criação de Municípios far-se-á por lei estadual, dentro do período determinado por Lei Complementar Federal.","os Territórios Federais integram os Estados onde estão localizados geograficamente.","os Estados podem incorporar-se entre si mediante decreto do Governador."],"answer":"C","comment":"Fundamentação indicada no caderno: Art. 18, § 4º, CF."},{"num":"Q62","source":"AOCP - MPE","topic":"Competência Privativa da União - Art. 22","text":"Compete privativamente à União legislar sobre:","options":["direito tributário, financeiro, penitenciário e urbanístico.","direito civil, comercial, penal, processual, eleitoral, marítimo e do trabalho.","proteção do patrimônio histórico e cultural.","previdência social, proteção e defesa da saúde.","junta comercial e custas dos serviços forenses."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 22, I, CF."},{"num":"Q63","source":"AOCP - Pref","topic":"Competência Concorrente - Art. 24","text":"No âmbito da legislação concorrente (Art. 24), a competência da União limitar-se-á a estabelecer normas gerais. A inexistência de lei federal sobre normas gerais:","options":["impede os Estados de legislarem sobre a matéria.","confere aos Estados a competência legislativa plena, para atender a suas peculiaridades.","transfere a competência legislativa automaticamente para os Municípios.","torna a matéria de competência do Poder Judiciário por meio de resolução.","anula qualquer legislação municipal anterior sobre a matéria."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 24, § 3º, CF."},{"num":"Q7","source":"Instituto AOCP (2024) - IF-PA - Gestão Pública","topic":"Competências Federativas","text":"Compete privativamente à União legislar sobre qual das seguintes matérias, segundo a Constituição Federal?","options":["Direito tributário, financeiro, penitenciário, econômico e urbanístico.","Proteção e integração social das pessoas portadoras de deficiência.","Direito civil, comercial, penal, processual, eleitoral, do trabalho, marítimo e aeronáutico.","Proteção do meio ambiente e controle da poluição.","Previdência social, proteção e defesa da saúde."],"answer":"C","comment":"Gabarito indicado no caderno: C. Art. 22, I, CF.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[{"num":"Q01","source":"INSTITUTO AOCP / Polícia Civil / 2023","text":"A Organização político-administrativa da República Federativa do Brasil compreende a União, os Estados, o Distrito Federal e os Municípios, todos autônomos, nos termos desta Constituição. Assinale a alternativa correta acerca dessa repartição de competências e organização.","options":["Compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho, sendo vedada a delegação aos Estados.","Os Estados podem incorporar-se entre si, subdividir-se ou desmembrar-se para se anexarem a outros, ou formarem novos Estados ou Territórios Federais, mediante aprovação da população diretamente interessada através de plebiscito e por lei complementar federal.","A criação, a incorporação, a fusão e o desmembramento de Municípios far-se-ão por lei federal, dentro do período estabelecido por Lei Complementar Federal.","É competência comum da União, dos Estados, do Distrito Federal e dos Municípios legislar concorrentemente sobre proteção ao patrimônio histórico e cultural.","Os Territórios Federais integram a União, e sua criação, transformação em Estado ou reintegração ao Estado de origem serão reguladas em lei ordinária."],"answer":"B","comment":"Conforme o art. 18, § 3º, da CF/88, os Estados podem sofrer alterações territoriais mediante plebiscito e lei complementar federal. A competência para legislar concorrentemente é da União, Estados e DF (art. 24).","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q02","source":"INSTITUTO AOCP / PC-ES / 2019","text":"No que diz respeito à repartição de competências entre os entes federativos prevista na Constituição Federal de 1988, assinale a assertiva correta.","options":["Compete exclusivamente à União explorar os serviços e instalações nucleares de qualquer natureza.","Compete aos Municípios legislar sobre águas, energia, informática, telecomunicações e radiodifusão.","A competência legislativa da União sobre normas gerais exclui a competência suplementar dos Estados.","Inexistindo lei federal sobre normas gerais, os Estados exercerão a competência legislativa plena para atender às suas peculiaridades.","A superveniência de lei federal sobre normas gerais suspende a eficácia de lei estadual, no que lhe for contrário, de forma definitiva e automática sem revogação."],"answer":"D","comment":"Art. 24, § 3º, da CF/88: Inexistindo lei federal sobre normas gerais, os Estados exercerão a competência legislativa plena, para atender a suas peculiaridades.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q03","source":"INSTITUTO AOCP / PM-DF / 2023","text":"A respeito da repartição constitucional de competências materiais (administrativas) e legislativas, assinale a alternativa correta.","options":["É competência privativa da União cuidar da saúde e assistência pública, da proteção e garantia das pessoas portadoras de deficiência.","É competência comum da União, dos Estados, do Distrito Federal e dos Municípios proporcionar os meios de acesso à cultura, à educação, à ciência, à tecnologia, à pesquisa e à inovação.","Os Municípios possuem competência privativa para legislar sobre trânsito e transporte.","Compete exclusivamente aos Estados legislar sobre desapropriação.","A criação de Municípios independe de lei complementar estadual e de consulta prévia às populações locais."],"answer":"B","comment":"Conforme o art. 23, V, da CF/88, é competência comum proporcionar os meios de acesso à cultura, educação, ciência, etc.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q04","source":"INSTITUTO AOCP / TJ-AM / 2023","text":"Sobre a intervenção federal nos Estados e no Distrito Federal, prevista na Constituição Federal, assinale a alternativa correta.","options":["A União não intervirá nos Estados nem no Distrito Federal, salvo para garantir o livre exercício de qualquer dos Poderes nas unidades da Federação.","O decreto de intervenção, que especificará a amplitude, o prazo e as condições de execução, será submetido à apreciação do Congresso Nacional no prazo de vinte e quatro horas.","A decretação da intervenção dependerá sempre de solicitação do Poder Legislativo coato ou impedido.","Nos casos de provimento de ordem ou decisão judicial, a intervenção dependerá de requisição do Supremo Tribunal Federal, do Superior Tribunal de Justiça ou do Tribunal Superior Eleitoral.","Cessados os motivos da intervenção, as autoridades afastadas de seus cargos não retornarão a eles em hipótese alguma."],"answer":"D","comment":"Art. 36, II, da CF/88: o provimento de ordem ou decisão judicial depende de requisição do STF, STJ ou TSE. O prazo para apreciação do Congresso é de 24 horas (art. 36, § 3º).","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q05","source":"INSTITUTO AOCP / MPE-RS / 2025","text":"No que tange aos Municípios e sua autonomia político-administrativa, assinale a alternativa correta segundo a Constituição Federal de 1988.","options":["O Município reger-se-á por lei federal, aprovada pelo Congresso Nacional, independentemente de Lei Orgânica própria.","A eleição do Prefeito, do Vice-Prefeito e dos Vereadores dar-se-á mediante pleito direto e simultâneo realizado em todo o País, nos termos da lei.","Os Municípios não possuem competência para instituir e arrecadar tributos de sua competência, dependendo de autorização do Estado.","O número de Vereadores da Câmara Municipal será fixado com base no número de habitantes do Município, sem limites máximos ou mínimos constitucionais.","É vedada a criação de Guardas Municipais destinadas à proteção de seus bens, serviços e instalações."],"answer":"B","comment":"Art. 29, I, da CF/88: eleição de Prefeito, Vice-Prefeito e Vereadores mediante pleito direto e simultâneo.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q06","source":"INSTITUTO AOCP / Perito Criminal / 2021","text":"Acerca da repartição de competências legislativas e exclusivas da União, assinale a opção correta.","options":["Compete privativamente à União emitir moeda e administrar as reservas cambiais do país.","Compete exclusivamente aos Estados legislar sobre direito penal, processual e civil.","A competência da União para legislar sobre águas e energia elétrica exclui a cooperação dos Municípios.","Os Municípios possuem competência para legislar sobre normas gerais de direito financeiro.","É vedada a delegação de atribuições legislativas da União aos Estados por meio de lei complementar."],"answer":"A","comment":"Conforme o art. 21, VII, e art. 22, VI, emitir moeda é competência da União.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q07","source":"INSTITUTO AOCP / PC-GO / 2022","text":"Analise as proposições seguintes sobre a organização federativa do Estado brasileiro e assinale a alternativa correta.","options":["O Distrito Federal pode ser dividido em Municípios, conforme lei orgânica distrital.","O federalismo brasileiro caracteriza-se pelo movimento de agregação, onde Estados antes soberanos unem-se para formar um pacto central.","A soberania pertence aos entes federados (União, Estados, DF e Municípios) de forma igualitária.","A República Federativa do Brasil indissolúvel é formada pela união indissolúvel dos Estados, Municípios e do Distrito Federal, e dos Territórios Federais.","Os Municípios são regidos por Lei Orgânica votada em dois turnos, com interstício mínimo de dez dias e aprovação de dois terços dos membros da Câmara Municipal."],"answer":"E","comment":"Art. 29, caput: o Município reger-se-á por lei orgânica, votada em dois turnos, com o interstício mínimo de dez dias, e aprovada por dois terços dos membros da Câmara Municipal.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q08","source":"INSTITUTO AOCP / Pref. de Curitiba / 2023","text":"Em relação à competência dos entes da federação para legislar concorrentemente, assinale a assertiva correta.","options":["A competência concorrente cabe exclusivamente à União e aos Municípios.","No âmbito da competência concorrente, a competência da União limitar-se-á a estabelecer normas gerais.","A superveniência de lei federal sobre normas gerais revoga integralmente a lei estadual anterior que tratava do mesmo tema.","Os Estados não podem suplementar as normas gerais federais.","Os Municípios possuem competência legislativa concorrente plena em matéria tributária."],"answer":"B","comment":"Art. 24, § 1º, da CF/88: No âmbito da competência legislativa concorrente, a competência da União limitar- se-á a estabelecer normas gerais.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q09","source":"INSTITUTO AOCP / IBGE / 2021","text":"No que concerne aos princípios sensíveis cuja inobservância pode ensejar a decretação de intervenção federal em Estado membro, assinale a alternativa correta.","options":["Forma republicana, sistema representativo e regime democrático.","Autonomia municipal, defesa da pátria e pluralismo político.","Irretroatividade da lei penal mais gravosa e direito adquirido.","Estrito cumprimento do orçamento participativo municipal.","Manutenção de monopólio postal exclusivamente federal."],"answer":"A","comment":"Art. 34, VII, da CF/88: Princípios sensíveis incluem a forma republicana, o sistema representativo, o regime democrático, os direitos da pessoa humana, etc.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q10","source":"INSTITUTO AOCP / PC-PA / 2020","text":"Sobre a fiscalização contábil, financeira e orçamentária e a competência dos Tribunais de Contas na organização do Estado, assinale a correta.","options":["O controle externo da Câmara Municipal será exercido com o auxílio dos Tribunais de Contas dos Estados ou do Município ou dos Conselhos ou Tribunais de Contas dos Municípios, onde houver.","Os Municípios poderão criar novos Tribunais de Contas municipais a qualquer tempo.","As decisões do Tribunal de Contas de que resulte imputação de multa ou débito não possuem eficácia de título executivo.","O parecer prévio, emitido pelo órgão competente sobre as contas que o Prefeito deve prestar anualmente, deixa de ser apreciado pela Câmara Municipal se houver maioria simples.","Os Ministros do Tribunal de Contas da União serão nomeados pelo Presidente da República após aprovação exclusiva da Câmara dos Deputados."],"answer":"A","comment":"Literalidade do art. 31, § 1º, da CF/88.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q11","source":"INSTITUTO AOCP / SEAP-MG / 2021","text":"No que tange à organização político-administrativa do Estado brasileiro, é correto afirmar que","options":["o Distrito Federal acumula as competências legislativas reservadas aos Estados e aos Municípios, sendo vedada a divisão em regiões administrativas.","os Territórios Federais possuem autonomia financeira, legislativa e jurisdicional própria idêntica à dos Estados.","a criação de novos Estados depende de lei complementar federal e consulta prévia, mediante plebiscito, às populações dos Municípios diretamente interessados.","os bens dos Estados e Municípios são imprescritíveis, mas passíveis de penhora em execuções fiscais comuns.","a União possui soberania, enquanto os Estados-membros, o Distrito Federal e os Municípios possuem autonomia."],"answer":"E","comment":"Apenas a República Federativa do Brasil possui soberania internacionalmente; os entes federados possuem autonomia político-administrativa.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q12","source":"INSTITUTO AOCP / TRF 2ª Região / 2024","text":"Assinale a alternativa que apresenta uma competência material exclusiva (ou privativa) da União, segundo o artigo 21 da Constituição Federal.","options":["Manter relacoes com Estados estrangeiros e participar de organizacoes internacionais.","Legislar sobre direito civil, comercial e penal.","Cuidar da saúde e assistência pública e proteção à infância.","Proteger o patrimônio histórico, cultural e paisagístico.","Fomentar a produção agropecuária e organizar o abastecimento alimentar."],"answer":"A","comment":"Art. 21, I da CF/88: manter relações com Estados estrangeiros e participar de organizações internacionais é competência administrativa exclusiva da União.","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q13","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"É competência privativa da União autorizar e fiscalizar a produção e o comércio de material bélico.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 21, VI","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q14","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Os Estados-membros podem instituir impostos sobre templos de qualquer culto.","options":["CERTO","ERRADO"],"answer":"B","comment":"Gabarito do caderno: ERRADO. Há imunidade tributária recíproca e específica vedando a instituição de impostos sobre templos","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q15","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A criação de regiões metropolitanas, aglomerações urbanas e microrregiões é feita por lei complementar federal.","options":["CERTO","ERRADO"],"answer":"B","comment":"Gabarito do caderno: ERRADO. Feita por lei complementar estadual, conforme art. 25, § 3º","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q16","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Cabe privativamente à União legislar sobre águas, energia, informática, telecomunicações e radiodifusão.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 22, IV","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q17","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A decretação de intervenção federal depende de controle político posterior pelo Congresso Nacional.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 36, § 3º","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q18","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Os Municípios podem fixar os subsídios do Prefeito, do Vice-Prefeito e dos Vereadores em cada legislatura para a subsequente.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 29, V","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q19","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"É vedada a acumulação de cargos públicos, exceto quando houver compatibilidade de horários, para dois cargos de professor.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Regra aplicável aos servidores públicos da administração direta e indireta","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q20","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A fiscalização do Município será exercida pelo Poder Legislativo Municipal, mediante controle externo.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 31","collection":"Caderno Oficial AOCP - Organização do Estado (20 Questões).pdf"},{"num":"Q21","source":"INSTITUTO AOCP / Polícia Científica / 2023","text":"A respeito da organização territorial e federal do Brasil, assinale a alternativa correta sobre as competências exclusivas e privativas dos entes federativos.","options":["Compete privativamente à União autorizar o funcionamento e a fiscalização de estabelecimentos de crédito, seguros e capitalização.","Os Estados membros detêm competência legislativa privativa para dispor sobre trânsito, transporte e tráfego urbano municipal.","A competência para legislar sobre juntas comerciais e câmaras de comércio é exclusiva dos Municípios.","É competência comum da União, Estados, DF e Municípios legislar privativamente sobre direito processual civil.","Os Municípios possuem competência para estabelecer diretrizes de planejamento urbano que afastem as normas gerais federais."],"answer":"A","comment":"Art. 21, VIII / Art. 22, VII da CF/88: autorizar e fiscalizar estabelecimentos de crédito, seguros e capitalização é competência exclusiva (material) da União.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"},{"num":"Q22","source":"INSTITUTO AOCP / Guarda Municipal / 2022","text":"Acerca dos limites, vedações e prerrogativas constitucionais aplicadas aos Municípios, assinale a opção correta.","options":["É permitida a criação de impostos municipais sobre o patrimônio, a renda ou os serviços de partidos políticos, inclusive suas fundações.","O total da despesa da Câmara Municipal, inclusive os subsídios dos Vereadores, não poderá exceder a percentagens específicas da receita efetivamente realizada do Município.","As leis orgânicas municipais podem ser alteradas por maioria absoluta da Câmara, independentemente de votação em dois turnos.","Os Municípios podem manter forças policiais militares próprias e armadas ostensivamente para patrulhamento urbano geral.","A fiscalização municipal é exercida pelo Tribunal de Contas da União diretamente, sem auxílio de câmaras locais."],"answer":"B","comment":"Art. 29-A da CF/88 estabelece os limites máximos das despesas das Câmaras Municipais com base na receita realizada.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"},{"num":"Q23","source":"INSTITUTO AOCP / PC-ES / 2019","text":"Sobre as regras constitucionais aplicadas à intervenção do Estado nos Municípios, assinale a alternativa correta.","options":["Os Estados nunca poderão intervir nos Municípios, sendo tal prerrogativa exclusiva da União sobre os Estados.","O Estado intervirá em Município quando deixar de ser paga, sem motivo justo, por dois anos consecutivos, a dívida contratual.","A decretação de intervenção estadual em Município dependerá de provimento, pelo Tribunal de Justiça, de representação para assegurar a observância de princípios indicados na Constituição Estadual.","O decreto de intervenção municipal independe de apreciação pela Assembleia Legislativa do Estado.","Nos casos de intervenção em Município, o prazo máximo permitido será de 30 dias improrrogáveis."],"answer":"C","comment":"Art. 36, III, da CF/88: o provimento de representação pelo Tribunal de Justiça assegura a observância de princípios ou normas da Constituição Estadual ou o provimento de ordem judicial.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"},{"num":"Q24","source":"INSTITUTO AOCP / TJ-AM / 2023","text":"No que tange aos Territórios Federais, assinale a assertiva correta segundo o ordenamento constitucional brasileiro vigente.","options":["Os Territórios Federais integram o Distrito Federal e possuem autonomia financeira idêntica à dos Municípios.","As contas dos Territórios Federais serão submetidas ao Congresso Nacional, com parecer prévio do Tribunal de Contas da União.","Os Territórios Federais podem ser divididos em Municípios, possuindo representação própria no Senado Federal com três senadores.","A criação, a transformação em Estado ou a reintegração de Território Federal dependem de lei complementar e aprovação em plebiscito direto.","Os Territórios Federais possuem natureza jurídica de entes federativos dotados de soberania própria."],"answer":"D","comment":"Art. 18, § 2º, da CF/88: Os Territórios Federais integram a União, e sua criação, transformação em Estado ou reintegração ao Estado de origem serão reguladas em lei complementar.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"},{"num":"Q25","source":"INSTITUTO AOCP / SEJUSP-MG / 2022","text":"Assinale a alternativa correta no que diz respeito à repartição vertical de competências legislativas e materiais na Federação brasileira.","options":["Competência material exclusiva da União é aquela delegável aos Estados-membros mediante lei ordinária federal.","A competência legislativa concorrente abrange matérias como direito tributário, financeiro, penitenciário, econômico e urbanístico.","Os Municípios possuem competência para legislar sobre direito penal e processual penal em caráter suplementar.","É vedada a cooperação administrativa entre União, Estados e Municípios em matéria de proteção ao meio ambiente.","A competência legislativa privativa da União exclui qualquer possibilidade de autorização por lei complementar aos Estados para legislar sobre questões específicas."],"answer":"B","comment":"Art. 24 da CF/88 elenca expressamente o direito tributário, financeiro, penitenciário, econômico e urbanístico como matérias de competência legislativa concorrente.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"},{"num":"Q26","source":"INSTITUTO AOCP / Prefeitura / 2021","text":"Sobre a autonomia municipal, a organização das leis locais e a competência dos entes, assinale a afirmativa correta.","options":["O prefeito municipal pode decretar intervenção estadual diretamente sobre o próprio município em caso de calamidade pública.","A criação de Municípios far-se-á por lei estadual, dentro do período estabelecido por lei complementar federal, dependendo de consulta prévia, mediante plebiscito, às populações dos Municípios interessados.","Os Municípios não têm competência para instituir impostos sobre a propriedade predial e territorial urbana (IPTU).","A investidura em cargo ou emprego público municipal depende de aprovação prévia em concurso público de provas ou de provas e títulos, sem exceções para cargos em comissão.","O mandato dos Vereadores é de seis anos, coincidentes com os mandatos federais."],"answer":"B","comment":"Art. 18, § 4º, da CF/88: A criação, incorporação, fusão e desmembramento de Municípios far-se-ão por lei estadual, exigindo plebiscito e lei complementar federal. Gabarito Consolidado — Blocos Finais (Questões 21 a 26) • Questão 21: Alternativa A • Questão 22: Alternativa B • Questão 23: Alternativa C • Questão 24: Alternativa D • Questão 25: Alternativa B • Questão 26: Alternativa B Instruções Finais para Revisão de Concurso O estudo da Organização do Estado cobrado pelo Instituto AOCP exige foco extremo na literalidade dos artigos 18 a 41 da Constituição Federal de 1988. Revise periodicamente as diferenças entre competências exclusivas (art. 21), privativas (art. 22), comuns (art. 23) e concorrentes (art. 24). Atenção especial também aos quóruns e prazos de intervenção federal e estadual, além das regras rígidas para criação de municípios e territórios.","collection":"Caderno Oficial AOCP - Organização do Estado (Parte Final).pdf"}],"discipline":"Direito Constitucional"},{"id":"adm_publica","title":"Administração Pública","priority":"ALTA","focus":"Arts. 37 a 43: princípios, cargos e empregos, servidores, militares estaduais, previdência e responsabilidade do Estado.","summary":["O coração do tema é o <mark>art. 37</mark>. Em provas policiais, a AOCP costuma cobrar intensamente o mnemônico <u>LIMPE</u> e a disciplina de concurso público, cargos em comissão, acumulação e teto remuneratório.","Também são muito relevantes estabilidade, regime previdenciário, militares estaduais e responsabilidade civil do Estado.","Trata-se de tema híbrido: mistura <mark>lei seca literal</mark> com compreensão sistemática dos princípios administrativos."],"highlights":["Princípios do art. 37: LIMPE.","Concurso público como regra de investidura.","Funções de confiança e cargos em comissão.","Acumulação de cargos e teto.","Regime previdenciário dos servidores.","Militares dos Estados."],"pegadinhas":["Função de confiança é exercida exclusivamente por servidor ocupante de cargo efetivo; cargo em comissão é de livre nomeação e exoneração, nos termos constitucionais.","Concurso público tem validade de até 2 anos, prorrogável uma vez por igual período.","Publicidade oficial não pode promover pessoalmente autoridades ou servidores públicos."],"law_items":[["Art. 37, caput","A administração pública obedecerá aos princípios da <mark>legalidade</mark>, <mark>impessoalidade</mark>, <mark>moralidade</mark>, <mark>publicidade</mark> e <mark>eficiência</mark>."],["Art. 37, II","A investidura em cargo ou emprego público depende de <mark>aprovação prévia em concurso público</mark>, ressalvadas as nomeações para cargo em comissão."],["Art. 37, V","As funções de confiança são exercidas exclusivamente por servidores ocupantes de cargo efetivo; os cargos em comissão destinam-se apenas às atribuições de direção, chefia e assessoramento."],["Art. 37, III","O prazo de validade do concurso público será de até 2 anos, prorrogável uma vez por igual período."],["Art. 40","Regime próprio de previdência dos servidores públicos."],["Art. 42","Militares dos Estados, DF e Territórios."]],"juris":[["Súmula Vinculante 13 — nepotismo","<b>Enunciado para revisão:</b> é incompatível com a Constituição a nomeação, em cargos de confiança/comissão ou funções gratificadas, de cônjuge, companheiro ou determinados parentes da autoridade nomeante ou de agente em posição de direção/chefia, inclusive mediante nomeações recíprocas.<br><br><b>Fundamento:</b> impessoalidade, moralidade e eficiência do art. 37.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1227\" target=\"_blank\">Abrir SV 13 no STF ↗</a>"],["Súmula Vinculante 43 — investidura sem concurso","<b>Enunciado para revisão:</b> é inconstitucional forma de provimento que permita ao servidor ingressar, sem concurso específico, em cargo de carreira diferente daquela em que já estava investido.<br><br><b>AOCP:</b> ascensão/transposição funcional para carreira diversa sem concurso é inconstitucional.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=2348\" target=\"_blank\">Abrir SV 43 no STF ↗</a>"],["Súmula Vinculante 44 — exame psicotécnico","<b>Enunciado para revisão:</b> somente lei pode autorizar a exigência de exame psicotécnico como requisito para habilitação em cargo público; além disso, a avaliação deve observar critérios minimamente objetivos e publicidade.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=2358\" target=\"_blank\">Abrir SV 44 no STF ↗</a>"],["Súmula Vinculante 37 — aumento de vencimentos por isonomia","<b>Enunciado para revisão:</b> o Judiciário não pode aumentar vencimentos de servidores apenas com fundamento na isonomia, porque não exerce função legislativa.<br><br><b>Atualização:</b> o STF continua aplicando essa orientação em julgados recentes.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1961\" target=\"_blank\">Abrir SV 37 no STF ↗</a>"]],"questions":[{"num":"Q8","source":"Instituto AOCP (2024) - IPE Prev - Analista","topic":"Disposições Gerais da Administração Pública","text":"Analise as assertivas e assinale a alternativa correta em relação às regras da Administração Pública (Art. 37 da CF/88): I. Os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei. II. O prazo de validade do concurso público será de até dois anos, prorrogável duas vezes, por igual período.","options":["Apenas a assertiva I está correta.","Apenas a assertiva II está correta.","Ambas as assertivas estão corretas.","Nenhuma das assertivas está correta."],"answer":"A","comment":"Gabarito indicado no caderno: A. A assertiva I corresponde ao art. 37, I; a II erra porque a prorrogação é uma única vez, por igual período.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"executivo","title":"Poder Executivo","priority":"MÉDIA","focus":"Arts. 76 a 91: Presidente, Vice, Ministros, atribuições, responsabilidade e conselhos.","summary":["No Executivo, o ponto central é o Presidente da República como <mark>Chefe de Estado e de Governo</mark>.","A AOCP costuma cobrar atribuições presidenciais, sucessão/substituição, crimes de responsabilidade e os Conselhos da República e de Defesa Nacional.","O art. 84 é um dos dispositivos que mais merecem leitura literal."],"highlights":["Chefia de Estado e de Governo.","Substituição e sucessão.","Art. 84: atribuições do Presidente.","Arts. 85 e 86: responsabilidade do Presidente.","Conselho da República e Conselho de Defesa Nacional."],"pegadinhas":["Substituição não se confunde com sucessão.","Vacância e impedimento têm consequências diversas.","Nem toda competência presidencial é delegável."],"law_items":[["Arts. 76 a 83","Organização da Presidência, eleição, posse, impedimento, vacância e sucessão."],["Art. 84","Lista as principais <mark>atribuições do Presidente da República</mark>."],["Arts. 85 e 86","Regulam <mark>crimes de responsabilidade</mark> e respectivo processamento."],["Arts. 89 a 91","Conselho da República e Conselho de Defesa Nacional."]],"juris":[["ADPF 378 — rito constitucional do impeachment","<b>Decisão:</b> o STF definiu parâmetros constitucionais do processo de impeachment presidencial, harmonizando a Lei 1.079/1950 com a Constituição de 1988 e delimitando as funções da Câmara e do Senado.<br><br><b>Ponto de prova:</b> a matéria envolve separação de Poderes, devido processo e as competências constitucionais do Congresso.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/processos/detalhe.asp?incidente=4899156\" target=\"_blank\">Abrir ADPF 378 no STF ↗</a>"],["Responsabilidade do Presidente","<b>Tese de revisão:</b> crimes comuns e crimes de responsabilidade seguem regimes constitucionais distintos. Em prova, sempre identifique qual natureza de infração está sendo cobrada e qual órgão possui competência constitucional em cada fase."]],"questions":[{"num":"Q10","source":"Instituto AOCP (2024) - PMDF - Oficial","topic":"Atribuições do Presidente da República","text":"Compete privativamente ao Presidente da República dispor, mediante decreto autônomo (Art. 84, VI da CF), sobre","options":["criação e extinção de Ministérios e órgãos da administração pública.","organização e funcionamento da administração federal, quando não implicar aumento de despesa nem criação ou extinção de órgãos públicos.","fixação e alteração de remuneração dos servidores públicos federais.","concessão de anistia e graça para crimes federais.","declaração de guerra e celebração de paz sem autorização prévia do Congresso."],"answer":"B","comment":"Gabarito indicado no caderno: B. Art. 84, VI, a, CF.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[{"num":"Q01","source":"INSTITUTO AOCP / Polícia Civil / 2023","text":"De acordo com a Constituição Federal de 1988, o Poder Executivo é exercido pelo Presidente da República, auxiliado pelos Ministros de Estado. Assinale a alternativa correta acerca das condições de elegibilidade e regras aplicáveis ao Presidente da República.","options":["A eleição para Presidente e Vice-Presidente da República realizar-se-á, simultaneamente, no primeiro domingo de outubro, em primeiro turno, e no último domingo de outubro, em segundo turno, se houver, do ano anterior ao do término do mandato presidencial vigente.","A idade mínima constitucionalmente exigida para a elegibilidade ao cargo de Presidente da República é de trinta e cinco anos completos no dia da posse.","O Presidente e o Vice-Presidente da República poderão ser reeleitos para um único período subsequente.","Para concorrer a outros cargos, o Presidente da República deve renunciar aos mandatos até seis meses antes da eleição, sendo vedada a candidatura sem desincompatibilização.","São brasileiro natos ou naturalizados os elegíveis aos cargos de Presidente e Vice-Presidente da República."],"answer":"C","comment":"Art. 14, § 5º da CF/88: O Presidente da República, os Governadores de Estado e do Distrito Federal, os Prefeitos e quem os houver sucedido ou substituído no curso dos mandatos poderão ser reeleitos para um único período subsequente. A idade mínima deve ser no momento da posse? Não, a idade constitucional exigida é aferida no momento da posse (35 anos para Presidente), mas a elegibilidade exige a idade na data da posse. Contudo, a alternativa C expressa a regra exata da reeleição. (Nota: para Presidente, exige-se nacionalidade brasileira nata - art. 12, § 3º, VII -, o que torna a E incorreta).","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q02","source":"INSTITUTO AOCP / PC-ES / 2019","text":"No que tange às atribuições privativas do Presidente da República previstas no art. 84 da Constituição Federal de 1988, assinale a assertiva correta.","options":["Compete privativamente ao Presidente da República declarar guerra, em caso de agressão estrangeira, autorizado pelo Congresso Nacional ou referendado por ele, quando ocorrida no intervalo das sessões legislativas.","O Presidente da República pode legislar sobre direito penal por meio de decretos autônomos de urgência em qualquer matéria.","A nomeação dos Ministros do Supremo Tribunal Federal compete privativamente ao Presidente da República, independentemente de sabatina e aprovação do Senado Federal.","Compete privativamente ao Congresso Nacional, e nunca ao Presidente da República, celebrar tratados, convenções e atos internacionais.","O Presidente da República não possui competência para conceder indulto e comutar penas."],"answer":"A","comment":"Art. 84, XIX da CF/88: compete privativamente ao Presidente da República declarar guerra, no caso de agressão estrangeira, autorizado pelo Congresso Nacional ou referendado por ele, quando ocorrida no intervalo das sessões legislativas.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q04","source":"INSTITUTO AOCP / TJ-AM / 2023","text":"Acerca dos Ministros de Estado e de suas atribuições constitucionais e legais, assinale a alternativa correta.","options":["Os Ministros de Estado devem ser brasileiros natos, maiores de vinte e um anos e no exercício dos direitos políticos.","Compete aos Ministros de Estado expedir instruções para a execução das leis, decretos e regulamentos, além de exercer a orientação, coordenação e supervisão dos órgãos da administração direta e indireta na área de sua competência.","Os Ministros de Estado respondem criminalmente perante o Superior Tribunal de Justiça por qualquer crime comum ou de responsabilidade, independentemente de conexão com o Presidente da República.","A criação de Ministérios depende de lei complementar aprovada por maioria absoluta do Congresso Nacional.","Os Ministros de Estado podem acumular o cargo com o exercício de mandatos eletivos federais simultaneamente."],"answer":"B","comment":"Art. 87, parágrafo único, II da CF/88: compete ao Ministro de Estado expedir instruções para a execução das leis, decretos e regulamentos. Para Ministro de Estado, exige-se nacionalidade brasileira (nata ou naturalizada) e idade mínima de 21 anos.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q05","source":"INSTITUTO AOCP / MPE-RS / 2025","text":"No que diz respeito à delegação de atribuições pelo Presidente da República, conforme o art. 84, parágrafo único da Constituição Federal, assinale a opção correta.","options":["O Presidente da República não pode delegar competências em nenhuma hipótese.","O Presidente da República pode delegar as atribuições mencionadas no art. 84, incisos VI, XII e XXV, primeira parte, aos Ministros de Estado, ao Procurador-Geral da República ou ao Advogado-Geral da União, que observarão os limites traçados nas respectivas delegações.","A delegação pode abranger a sanção e o veto de projetos de lei aprovados pelo Congresso Nacional.","A expedição de decretos e regulamentos para a fiel execução de leis pode ser delegada exclusivamente aos governadores estaduais.","O Presidente pode delegar a competência para declarar estado de defesa a qualquer autoridade policial de segurança pública."],"answer":"B","comment":"Literalidade do art. 84, parágrafo único da CF/88. As matérias passíveis de delegação expressa são organização e funcionamento da administração federal (VI, a), concessão de indulto/comutação (XII) e provimento de cargos públicos (XXV, 1ª parte).","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q06","source":"INSTITUTO AOCP / Perito Criminal / 2021","text":"Assinale a alternativa que descreve corretamente uma hipótese de infração penal comum cometida pelo Presidente da República.","options":["Atentar contra a Constituição Federal e, especialmente, contra o livre exercício dos Poderes.","Praticar crimes comuns tipificados na legislação penal ordinária (como corrupção passiva ou homicídio) estranhos ou conexos ao exercício do mandato.","Atentar contra o livre exercício dos direitos políticos, individuais e sociais.","Atentar contra a probidade na administração pública.","Atentar contra a lei orçamentária aprovada pelo Congresso."],"answer":"B","comment":"As alternativas A, C, D e E tratam de crimes de responsabilidade (Lei nº 1.079/1950 e art. 85 da CF/88). Infrações penais comuns são os crimes comuns previstos no Código Penal e leis penais especiais.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q07","source":"INSTITUTO AOCP / PC-GO / 2022","text":"Sobre os subsídios, remuneração e perda de cargo no âmbito do Poder Executivo federal, assinale a assertiva correta.","options":["O Presidente e o Vice-Presidente da República receberão subsídio fixado por lei ordinária federal de iniciativa conjunta do Congresso Nacional.","Perderá o mandato o Presidente da República que assumir outro cargo ou função na administração pública direta ou indireta, ressalvada a posse em concurso público federal.","A vacância dos cargos de Presidente e Vice-Presidente da República nos últimos dois anos do período presidencial implicará nova eleição direta feita pelo povo em trinta dias.","Em caso de impedimento do Presidente e do Vice-Presidente, serão sucessivamente chamados ao exercício da Presidência o Presidente do Senado Federal, o Presidente da Câmara dos Deputados e o Presidente do Supremo Tribunal Federal.","O Presidente da República poderá ausentar-se do País por qualquer período sem licença do Congresso Nacional."],"answer":"A","comment":"Art. 49, VIII c/c art. 37, X e art. 48, XV da CF/88: subsídio fixado por lei de iniciativa do Congresso Nacional. A ordem de substituição (D) começa por Presidente da Câmara, Senado e STF (cuidado com a inversão da banca). Nos últimos dois anos, a eleição é indireta feita pelo Congresso em 30 dias (regra do art. 81, § 1º).","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q08","source":"INSTITUTO AOCP / Pref. de Curitiba / 2023","text":"Analise as afirmativas seguintes referentes aos Decretos e Regulamentos previstos no art. 84, IV da Constituição Federal de 1988.","options":["Compete privativamente ao Presidente da República sancionar, promulgar e fazer publicar as leis, bem como expedir decretos e regulamentos para sua fiel execução.","O Presidente da República pode editar medidas provisórias com força de lei sobre qualquer matéria, inclusive direito penal e processual penal.","Os decretos autônomos expedidos pelo Presidente da República podem dispor sobre a criação de órgãos públicos que acarretem aumento de despesa.","O veto presidencial a projeto de lei pode ser parcial e deve abranger texto integral de artigo, parágrafo, inciso ou alínea.","A sanção presidencial, uma vez concedida, pode ser revogada pelo próprio Presidente antes da publicação oficial."],"answer":"A","comment":"Art. 84, IV da CF/88: compete privativamente sancionar, promulgar e fazer publicar as leis, e expedir decretos e regulamentos para sua fiel execução (regulamentar). Medidas provisórias não podem tratar de direito penal, processual penal e eleitoral.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q09","source":"INSTITUTO AOCP / IBGE / 2021","text":"Em relação ao Conselho da República e ao Conselho de Defesa Nacional, órgãos superiores de consulta do Presidente da República, assinale a alternativa correta.","options":["O Conselho da República é presidido pelo Vice-Presidente da República em todas as suas sessões ordinárias.","Compete ao Conselho da República pronunciar-se sobre intervenção federal, estado de defesa e estado de sítio, bem como sobre questões relevantes para a estabilidade das instituições democráticas.","O Ministro da Defesa não integra o Conselho de Defesa Nacional em hipótese alguma.","Os Conselhos possuem caráter deliberativo vinculante para as decisões do Presidente da República.","A criação de membros do Conselho da República depende de aprovação do Supremo Tribunal Federal."],"answer":"B","comment":"Art. 90, III da CF/88: compete ao Conselho da República pronunciar-se sobre intervenção federal, estado de defesa e estado de sítio e sobre questões relevantes para a estabilidade das instituições democráticas. O Presidente da República preside o Conselho da República.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q10","source":"INSTITUTO AOCP / PC-PA / 2020","text":"No que tange aos crimes de responsabilidade e à tramitação do processo perante o Congresso Nacional, assinale a opção correta.","options":["Admitida a acusação contra o Presidente da República pela Câmara dos Deputados, será ele submetido a julgamento perante o Supremo Tribunal Federal nos crimes de responsabilidade.","O julgamento do Presidente da República nos crimes de responsabilidade é realizado pelo Senado Federal, presidido pelo Presidente do Supremo Tribunal Federal.","A condenação em crime de responsabilidade limita-se à perda do cargo, sem imposição de inabilitação temporária.","O Senado Federal necessita de maioria absoluta de seus membros para condenar o Presidente da República em crime de responsabilidade.","O Presidente da República pode ser julgado pelo Senado sem prévia autorização da Câmara dos Deputados."],"answer":"B","comment":"Art. 86, sintaxe do julgamento: crimes de responsabilidade são julgados pelo Senado Federal (presidido pelo Presidente do STF - art. 52, parágrafo único), exigindo quorum de dois terços dos votos para condenação.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q11","source":"INSTITUTO AOCP / SEAP-MG / 2021","text":"A respeito da Ministérios e da organização da Administração Pública Federal Direta, assinale a alternativa correta.","options":["Os Ministérios são criados por decreto autônomo do Presidente da República, sem intervenção do Poder Legislativo.","A criação, estruturação e extinção de Ministérios e órgãos da administração pública federal dependem de lei de iniciativa privativa do Presidente da República.","Os Ministros de Estado possuem prerrogativa de foro criminal perante os juizados especiais federais.","É vedada a avocação de atribuições de órgãos subordinados pelos Ministros de Estado.","A competência dos Ministros de Estado é delegável integralmente a qualquer servidor público municipal."],"answer":"B","comment":"Art. 48, XI e art. 84, VI, a c/c iniciativa de lei: a criação e extinção de ministérios dependem de lei (iniciativa do Executivo ou aprovação parlamentar conforme estruturação legal).","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q12","source":"INSTITUTO AOCP / TRF 2ª Região / 2024","text":"Assinale a alternativa que apresenta uma competência exclusiva ou privativa do Presidente da República prevista na Constituição Federal.","options":["Conceder indulto e comutar penas, com audiência, se necessário, dos órgãos instituídos em lei.","Julgar anualmente as contas prestadas pelo Congresso Nacional.","Suspender a execução de lei declarada inconstitucional por decisão definitiva do STF.","Aprovar previamente a escolha de magistrados e diplomatas.","Legislar sobre diretrizes e bases da educação nacional."],"answer":"A","comment":"Art. 84, XII da CF/88: compete privativamente ao Presidente da República conceder indulto e comutar penas, com audiência, se necessário, dos órgãos instituídos em lei.","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q13","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O Presidente da República pode celebrar tratados, convenções e atos internacionais, ad referendum do Congresso Nacional.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 84, VIII","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q14","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A decretação do estado de defesa e do estado de sítio é competência privativa do Congresso Nacional, sem participação do Presidente.","options":["CERTO","ERRADO"],"answer":"B","comment":"Gabarito do caderno: ERRADO. Compete ao Presidente da República decretar, ouvidos o Conselho da República e o Conselho de Defesa Nacional","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q15","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O Vice-Presidente da República substituirá o Presidente em caso de impedimento e suceder-lhe-á no caso de vaga.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 79","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q16","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Os Ministros de Estado não podem ser convocados pelas Casas do Congresso Nacional para prestar informações sobre assunto de sua Pasta.","options":["CERTO","ERRADO"],"answer":"B","comment":"Gabarito do caderno: ERRADO. Podem ser convocados e a ausência sem justificação constitui crime de responsabilidade","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q17","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A responsabilidade penal comum do Presidente da República exige prévia autorização de dois terços da Câmara dos Deputados para ser processada perante o STF.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 86, caput","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q18","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O Presidente e o Vice-Presidente da República tomarão posse em sessão do Congresso Nacional, prestando o compromisso de manter, defender e cumprir a Constituição.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 78","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q19","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"É vedada a edição de medidas provisórias sobre matéria relativa a nacionalidade, cidadania e direitos políticos.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 62, § 1º, I, a","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"},{"num":"Q20","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O Presidente da República exerce a direção superior da administração federal com o auxílio dos Ministros de Estado.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 84, II","collection":"Caderno Oficial AOCP - Poder Executivo (20 Questões) (1).pdf"}],"discipline":"Direito Constitucional"},{"id":"legislativo","title":"Poder Legislativo","priority":"ALTA","focus":"Arts. 44 a 75: Congresso Nacional, Câmara, Senado, congressistas, CPIs e TCU.","summary":["O Legislativo é frequentemente cobrado a partir da estrutura do <mark>Congresso Nacional</mark>, das competências privativas da Câmara e do Senado e do estatuto dos parlamentares.","A AOCP também costuma explorar <u>CPIs</u>, imunidades parlamentares e o controle externo com auxílio do TCU.","É importante estudar de forma comparada os arts. 48, 49, 51 e 52."],"highlights":["Bicameralismo.","Competências do Congresso.","Competências privativas da Câmara.","Competências privativas do Senado.","Imunidades parlamentares.","TCU e controle externo."],"pegadinhas":["Competência exclusiva do Congresso (art. 49) não se confunde com competência privativa da Câmara ou do Senado.","Imunidade material e imunidade formal são institutos diferentes.","CPI exige requisitos constitucionais próprios."],"law_items":[["Arts. 44 a 47","Estrutura do Congresso Nacional e regras gerais de deliberação."],["Arts. 48 e 49","Competências do Congresso Nacional."],["Art. 51","Competências privativas da <mark>Câmara dos Deputados</mark>."],["Art. 52","Competências privativas do <mark>Senado Federal</mark>."],["Arts. 53 a 56","Estatuto dos congressistas e <mark>imunidades</mark>."],["Arts. 70 a 75","Controle externo e Tribunal de Contas da União."]],"juris":[["HC 174.326 — investigado convocado por CPI","<b>Decisão:</b> o STF assegurou a potencial investigado em CPI o direito de não comparecer compulsoriamente e, caso compareça, o direito ao silêncio, à assistência de advogado e à não autoincriminação.<br><br><b>Ponto de prova:</b> os poderes investigatórios das CPIs não eliminam direitos e garantias fundamentais.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=419830&tip=UN\" target=\"_blank\">Abrir notícia oficial do HC 174.326 ↗</a>"],["CPIs — poderes investigatórios e limites","<b>Tese de revisão:</b> CPIs possuem poderes de investigação próprios de autoridades judiciais, mas não podem exercer competências constitucionalmente reservadas ao Poder Judiciário nem desrespeitar garantias como o direito ao silêncio."]],"questions":[],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"processo_legislativo","title":"Processo Legislativo","priority":"ALTA","focus":"Arts. 59 a 69: espécies normativas, iniciativa, votação, sanção, veto e emendas constitucionais.","summary":["O processo legislativo é tema clássico de <mark>lei seca</mark>. A banca costuma cobrar as espécies normativas do art. 59 e o poder de reforma do art. 60.","Também aparecem com frequência: iniciativa legislativa, quóruns, sanção, veto, diferenças entre lei ordinária e lei complementar.","É um tema em que a literalidade é decisiva."],"highlights":["Art. 59: espécies normativas.","Art. 60: emenda constitucional.","Art. 61: iniciativa.","Sanção e veto.","Lei complementar x lei ordinária."],"pegadinhas":["Maioria absoluta não se confunde com maioria simples.","Cláusula pétrea não é a mesma coisa que limitação circunstancial.","Medida provisória tem regime constitucional próprio."],"law_items":[["Art. 59","Relaciona as <mark>espécies normativas</mark> do processo legislativo."],["Art. 60","Disciplina as <mark>emendas constitucionais</mark> e suas limitações."],["Art. 61","Trata da <mark>iniciativa</mark> das leis."],["Arts. 62 a 69","Trazem regras sobre medidas provisórias, leis delegadas, sanção, veto, promulgação e outras espécies."]],"juris":[["ADI 5.127 — contrabando legislativo em medida provisória","<b>Decisão:</b> o STF considerou inconstitucional inserir, na conversão de medida provisória em lei, emenda parlamentar sem pertinência temática com o objeto original da MP.<br><br><b>Para prova:</b> a prática viola o princípio democrático e o devido processo legislativo.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=301892&ori=1\" target=\"_blank\">Abrir ADI 5.127 no STF ↗</a>"],["Iniciativa legislativa reservada","<b>Tese consolidada:</b> quando a Constituição reserva a iniciativa de determinada matéria a um órgão ou autoridade, a lei originada de iniciativa inadequada pode sofrer vício formal de inconstitucionalidade. A análise deve ser feita matéria por matéria."]],"questions":[{"num":"Q9","source":"Instituto AOCP (2024) - MPE-RS - Área Jurídica","topic":"Processo Legislativo & Espécies Normativas","text":"A Constituição Federal poderá ser emendada mediante proposta de qual dos seguintes legitimados?","options":["De um quinto, no mínimo, dos membros da Câmara dos Deputados ou do Senado Federal.","Do Presidente da República.","De mais da metade das Assembleias Legislativas das unidades da Federação, manifestando-se, cada uma delas, pela maioria simples de seus membros.","De um terço, no mínimo, dos membros do Supremo Tribunal Federal.","Do Procurador-Geral da República."],"answer":"B","comment":"Gabarito indicado no caderno: B. O art. 60 prevê legitimidade do Presidente da República, além de 1/3 de uma das Casas e mais da metade das Assembleias Legislativas nos termos constitucionais.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"judiciario","title":"Poder Judiciário","priority":"ALTA","focus":"Arts. 92 a 126 e art. 100: estrutura, garantias, CNJ, STF, STJ, justiças especializadas e precatórios.","summary":["O primeiro passo é memorizar os <mark>órgãos do Poder Judiciário</mark> previstos no art. 92.","Na sequência, estudam-se estatuto da magistratura, garantias e vedações dos juízes, CNJ, competências do STF/STJ e organização das justiças especializadas.","Precatórios e reserva de plenário também são pontos de cobrança relevante."],"highlights":["Art. 92: órgãos do Judiciário.","Garantias e vedações da magistratura.","CNJ.","STF e STJ.","Justiças especializadas.","Art. 100: precatórios."],"pegadinhas":["CNJ não exerce função jurisdicional.","Quinto constitucional e reserva de plenário confundem muitos candidatos.","Competências do STF e do STJ precisam ser estudadas comparativamente."],"law_items":[["Art. 92","Enumera os <mark>órgãos do Poder Judiciário</mark>."],["Arts. 93 a 95","Estatuto da magistratura, garantias e vedações dos juízes."],["Art. 103-B","Conselho Nacional de Justiça."],["Arts. 101 a 105","STF e STJ."],["Art. 100","Disciplina os <mark>precatórios</mark>."]],"juris":[["Súmula Vinculante 10 — cláusula de reserva de plenário","<b>Enunciado para revisão:</b> órgão fracionário de tribunal não pode afastar a aplicação de lei por fundamento constitucional como forma indireta de declarar sua inconstitucionalidade sem observar a reserva de plenário do art. 97.<br><br><b>AOCP:</b> a SV 10 alcança a declaração implícita de inconstitucionalidade.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1216\" target=\"_blank\">Abrir SV 10 no STF ↗</a>"],["CNJ — função administrativa e disciplinar","<b>Tese de revisão:</b> o Conselho Nacional de Justiça exerce controle administrativo, financeiro e disciplinar do Judiciário; não funciona como instância jurisdicional revisora de decisões judiciais."]],"questions":[{"num":"Q11","source":"Instituto AOCP (2025) - MPE-RS - Direito","topic":"Órgãos e Garantias do Judiciário","text":"São órgãos do Poder Judiciário, segundo o rol taxativo do art. 92 da Constituição Federal, EXCETO:","options":["O Supremo Tribunal Federal.","O Conselho Nacional de Justiça.","O Superior Tribunal de Justiça.","Os Tribunais e Juízes do Trabalho.","Os Tribunais de Contas da União e dos Estados."],"answer":"E","comment":"Gabarito indicado no caderno: E. Tribunais de Contas auxiliam o Poder Legislativo no controle externo e não integram o art. 92.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"defesa_estado","title":"Defesa do Estado e Instituições Democráticas","priority":"MUITO ALTA","focus":"Arts. 136 a 144: estado de defesa, estado de sítio, Forças Armadas e Segurança Pública.","summary":["Este é um dos blocos mais estratégicos para concursos policiais. A AOCP costuma explorar a <mark>literalidade dos arts. 136 a 144</mark>, sobretudo do art. 144.","É essencial diferenciar <u>estado de defesa</u> e <u>estado de sítio</u>, seus pressupostos, duração, autorização e controle.","Além disso, o <mark>art. 144</mark> deve ser estudado com máxima atenção: órgãos da segurança pública, suas atribuições e distinções aparecem de forma direta nas provas."],"highlights":["Art. 136: estado de defesa.","Arts. 137 a 139: estado de sítio.","Arts. 140 e 141: controle das medidas excepcionais.","Arts. 142 e 143: Forças Armadas e serviço militar.","Art. 144: Segurança Pública."],"pegadinhas":["Estado de defesa não se confunde com estado de sítio.","Órgãos da segurança pública têm competências distintas e específicas.","Forças Armadas e segurança pública possuem fundamentos constitucionais diferentes, embora possam se relacionar em situações excepcionais."],"law_items":[["Art. 136","O Presidente da República pode decretar <mark>estado de defesa</mark>, ouvidos o Conselho da República e o Conselho de Defesa Nacional, para preservar ou prontamente restabelecer a ordem pública ou a paz social em locais restritos e determinados."],["Art. 137","O <mark>estado de sítio</mark> depende de autorização do Congresso Nacional nas hipóteses constitucionais."],["Art. 139","Enumera medidas que podem ser adotadas durante o estado de sítio, dentro dos limites constitucionais."],["Art. 142","As <mark>Forças Armadas</mark> destinam-se à defesa da Pátria, à garantia dos poderes constitucionais e, por iniciativa de qualquer destes, da lei e da ordem."],["Art. 144","A <mark>segurança pública</mark>, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio, pelos órgãos previstos na Constituição."]],"juris":[["ADPF 635 — operações policiais e redução da letalidade","<b>Decisão:</b> o STF estabeleceu parâmetros para operações policiais em comunidades do Rio de Janeiro, exigindo planejamento, justificativas e medidas de controle destinadas à redução de letalidade e à proteção de direitos fundamentais.<br><br><b>Atualização:</b> o processo teve novas deliberações em 2025, tornando-o relevante para concursos policiais.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=515229&ori=1\" target=\"_blank\">Abrir atualização oficial da ADPF 635 ↗</a>"],["ADPF 635 — limites operacionais e controle","<b>Tese de revisão:</b> o STF admitiu atuação policial em situações necessárias, mas reforçou mecanismos de supervisão, proporcionalidade e proteção à vida. A decisão não elimina a atividade policial; estabelece parâmetros constitucionais para sua execução.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=481169&ori=1\" target=\"_blank\">Abrir decisão oficial de 2022 ↗</a>"],["Art. 144 e separação de atribuições","<b>Para prova:</b> ao estudar jurisprudência de segurança pública, diferencie sempre polícia ostensiva, polícia judiciária, polícia penal e guardas municipais. O STF examina essas funções à luz do desenho institucional do art. 144."]],"questions":[{"num":"Q01","source":"AOCP - CBM/PM","topic":"Segurança Pública - Art. 144","text":"A Polícia Federal, órgão permanente estruturado em carreira pela União, destina-se a:","options":["exercer, com exclusividade, as funções de polícia judiciária de todos os Estados da Federação.","apurar infrações penais contra a ordem política e social ou em detrimento de bens, serviços e interesses da União ou de suas entidades autárquicas e empresas públicas.","realizar o policiamento ostensivo e a preservação da ordem pública nos Municípios com mais de 500 mil habitantes.","atuar precipuamente na patrulha ostensiva das rodovias e ferrovias estaduais.","apurar crimes de natureza militar praticados por integrantes do Exército Brasileiro."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 144, I, CF."},{"num":"Q02","source":"AOCP - PC","topic":"Polícia Civil - Art. 144, § 4º","text":"Às polícias civis, dirigidas por delegados de polícia de carreira, incumbe, nos termos da Constituição Federal:","options":["a ressalva da competência da União e a apuração de infrações penais, exceto as militares.","o patrulhamento ostensivo das rodovias federais.","a apuração de infrações de trânsito praticadas em vias urbanas estaduais exclusivamente.","a execução das atividades de segurança privada e controle de armas nos municípios.","o combate a infrações militares praticadas por policiais militares e bombeiros militares."],"answer":"A","comment":"Fundamentação indicada no caderno: Art. 144, § 4º, CF."},{"num":"Q03","source":"AOCP - PM","topic":"Forças Auxiliares - Art. 144, § 6º","text":"As polícias militares e os corpos de bombeiros militares, forças auxiliares e reserva do Exército, subordinam-se, juntamente com as polícias penais estaduais e do DF:","options":["ao Ministro da Justiça e Segurança Pública.","ao Presidente da República diretamente em tempos de paz.","aos Governadores dos Estados, do Distrito Federal e dos Territórios.","aos Tribunais de Justiça Estaduais correspondentes.","ao Chefe do Estado-Maior do Exército."],"answer":"C","comment":"Fundamentação indicada no caderno: Art. 144, § 6º, CF."},{"num":"Q04","source":"AOCP - Guarda Municipal","topic":"Guardas Municipais - Art. 144, § 8º","text":"Os Municípios poderão constituir guardas municipais destinadas à proteção de seus bens, serviços e instalações, conforme dispuser a lei. As guardas municipais:","options":["substituem as Polícias Militares na apuração de crimes comuns.","integram os órgãos de segurança pública com competência de polícia judiciária municipal.","dependem de autorização do Exército para utilização de uniforme próprio.","atuam na proteção dos bens, serviços e instalações municipais conforme lei federal e municipal.","possuem subordinação direta ao Ministério da Defesa em caso de calamidade."],"answer":"D","comment":"Fundamentação indicada no caderno: Art. 144, § 8º, CF."},{"num":"Q05","source":"AOCP - PC","topic":"Estado de Defesa - Art. 136","text":"O Presidente da República pode, ouvidos o Conselho da República e o Conselho de Defesa Nacional, decretar estado de defesa. A duração do estado de defesa não será superior a:","options":["15 dias, prorrogável uma vez por 15 dias.","30 dias, podendo ser prorrogado uma única vez, por igual período, se persistirem as razões.","60 dias ininterruptos, vedada qualquer prorrogação.","90 dias, dependendo de autorização do Senado Federal.","tempo indeterminado enquanto perdurar a grave comoção social."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 136, § 2º, CF."},{"num":"Q06","source":"AOCP - CBM","topic":"Estado de Defesa - Prazos e Prisão","text":"Na vigência do Estado de Defesa, a prisão por crime contra o Estado, determinada pelo executor da medida:","options":["poderá exceder trinta dias mediante autorização do Ministério Público.","não será superior a dez dias, salvo quando autorizada pelo Poder Judiciário.","exige mandado judicial prévio, vedada a prisão por decisão administrativa.","será comunicada imediatamente ao juiz competente, que a relaxará se for ilegal, devendo o preso ficar incomunicável por 5 dias.","fica imune ao controle jurisdicional enquanto durar o decreto presidencial."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 136, § 3º, I, CF."},{"num":"Q07","source":"AOCP - DPE","topic":"Estado de Sítio - Art. 137","text":"O Presidente da República pode solicitar ao Congresso Nacional autorização para decretar o estado de sítio nos casos de:","options":["greve de servidores públicos de âmbito estadual.","comoção grave de repercussão nacional ou ocorrência de fatos que comprovem a ineficácia de medida tomada no estado de defesa.","calamidade pública de pequenas proporções em um único município.","descumprimento de ordem judicial trabalhista por empresa estatal.","denúncia de corrupção praticada por Ministros de Estado."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 137, I, CF."},{"num":"Q08","source":"AOCP - TJ","topic":"Forças Armadas - Art. 142","text":"As Forças Armadas, constituídas pela Marinha, Exército e Aeronáutica, são instituições nacionais permanentes e regulares, organizadas com base na disciplina e na hierarquia, sob a autoridade suprema do:","options":["Ministro da Defesa.","Chefe do Estado-Maior das Forças Armadas.","Presidente do Supremo Tribunal Federal.","Presidente da República.","Presidente do Congresso Nacional."],"answer":"D","comment":"Fundamentação indicada no caderno: Art. 142, caput, CF."},{"num":"Q09","source":"AOCP","topic":"Segurança Viária - Art. 144, § 10","text":"A segurança viária, exercida para a preservação da ordem pública e da incolumidade das pessoas e do seu patrimônio nas vias públicas, engloba:","options":["a fiscalização, a educação e a engenharia de trânsito.","apenas o patrulhamento repressivo de rodovias federais.","competência exclusiva da Polícia Rodoviária Federal.","competência reservada exclusivamente aos Estados-membros.","atribuição conferida apenas aos órgãos privados de trânsito."],"answer":"A","comment":"Fundamentação indicada no caderno: Art. 144, § 10, I, CF."},{"num":"Q10","source":"AOCP","topic":"Polícia Penal - Art. 144, § 5º-A","text":"Aos órgãos da polícia penal, vinculados ao órgão administrador do sistema penal da unidade federativa correspondente, cabe:","options":["a patrulha ambiental e florestal.","a segurança dos estabelecimentos penais.","a apuração de crimes de homicídio doloso.","o licenciamento de veículos automotores.","a fiscalização do cumprimento do código de posturas municipal."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 144, § 5º-A, CF."},{"num":"Q13","source":"Instituto AOCP (2024) - PMDF - Praça / Oficial","topic":"Segurança Pública","text":"Segundo o art. 144 da CF/88, a segurança pública é dever do Estado, direito e responsabilidade de todos. Dentre os órgãos incumbidos do seu exercício, NÃO se inclui expressamente:","options":["Polícia Federal.","Polícia Rodoviária Federal.","Polícias Penais federal, estaduais e distrital.","Guardas Municipais (órgãos de segurança viária/patrimonial).","Polícias Militares e Corpos de Bombeiros Militares."],"answer":"D","comment":"Gabarito indicado no caderno: D. O caderno observa que as guardas municipais estão no §8º, mas não no rol do caput do art. 144.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2024) - PMDF - Praça / Oficial","text":"Segundo o art. 144 da Constituição Federal de 1988, a segurança pública é dever do Estado, direito e responsabilidade de todos, exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio. Dentre os órgãos incumbidos do seu exercício, NÃO se inclui expressamente:","options":["Polícia Federal.","Polícia Rodoviária Federal.","Polícias Penais federal, estaduais e distrital.","Guardas Municipais.","Polícias Militares e Corpos de Bombeiros Militares."],"answer":"D","comment":"As Guardas Municipais exercem a proteção de bens, serviços e instalações municipais (Art. 144, § 8º), mas não integram o rol taxativo dos órgãos de segurança pública do caput do art. 144.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q02","source":"Instituto AOCP (2024) - PC-PA - Escrivão e Investigador","text":"Acerca da Defesa do Estado e das Instituições Democráticas, assinale a alternativa correta conforme o texto constitucional de 1988:","options":["As Polícias Civis, dirigidas por delegados de polícia de carreira, incumbem, ressalvada a competência da União, as funções de polícia judiciária e a apuração de infrações penais, inclusive as militares.","Às Polícias Militares cabem a polícia ostensiva e a preservação da ordem pública; aos Corpos de Bombeiros Militares, além das atribuições definidas em lei, incumbe a execução de defesa civil.","A segurança viária, compreendida a educação, engenharia e fiscalização de trânsito, compete exclusivamente aos órgãos federais.","As Polícias Penais subordinam-se ao Ministério da Justiça no âmbito federal e aos comandos militares nos estados.","A lei municipal poderá atribuir funções de polícia ostensiva geral às guardas municipais."],"answer":"B","comment":"O art. 144, § 5º da CF estabelece expressamente que às Polícias Militares cabem a polícia ostensiva e a preservação da ordem pública, enquanto os Bombeiros executam a defesa civil.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q03","source":"Instituto AOCP (2023) - PM-ES - Oficial","text":"O Estado de Defesa poderá ser decretado pelo Presidente da República, ouvidos o Conselho da República e o Conselho de Defesa Nacional, com o objetivo de preservar ou prontamente restabelecer a ordem pública ou a paz social ameaçadas por grave e iminente instabilidade institucional. O prazo máximo de duração do estado de defesa será de:","options":["10 dias, prorrogável por igual período.","30 dias, prorrogável uma única vez por igual período.","60 dias, prorrogável mediante autorização do Congresso Nacional.","90 dias, improrrogáveis.","120 dias, prorrogável por até igual período."],"answer":"B","comment":"O art. 136, § 2º da CF fixa o prazo máximo do estado de defesa em trinta dias, podendo ser prorrogado uma única vez por igual período.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q04","source":"Instituto AOCP (2023) - PC-GO - Delegado de Polícia (Adaptada/Espelho AOCP)","text":"Sobre o decreto de Estado de Sítio, assinale a alternativa correta quanto à sua exigência de aprovação institucional:","options":["Depende de prévia autorização do Congresso Nacional, por maioria absoluta de seus membros.","Pode ser decretado diretamente pelo Presidente da República, dispensando qualquer controle do Poder Legislativo.","Exige apenas parecer consultivo e não vinculante do Supremo Tribunal Federal.","Depende de aprovação unânime do Conselho da República.","É de competência privativa exclusiva dos Governadores de Estado em caso de calamidade pública."],"answer":"A","comment":"Conforme o art. 38 c/c o art. 137 da CF, o Presidente da República pode solicitar ao Congresso Nacional autorização para decretar o estado de sítio, dependendo de aprovação por maioria absoluta.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q05","source":"Instituto AOCP (2024) - Prefeitura de Vitória - Guarda Municipal","text":"A respeito das Forças Armadas, constituídas pela Marinha, pelo Exército e pela Aeronáutica, assinale a afirmativa correta de acordo com a Constituição Federal de 1988:","options":["São instituições permanentes e regulares, organizadas com base na hierarquia e na disciplina, sob a autoridade suprema do Presidente da República.","Destinam-se à defesa da pátria e à garantia dos poderes constitucionais, sendo vedada a atuação na lei e ordem por iniciativa dos chefes de poderes.","Os membros das Forças Armadas são denominados servidores públicos civis equiparados.","O serviço militar obrigatório é facultativo para todos os brasileiros natos e naturalizados.","É permitida a sindicalização e a greve para os militares em atividade."],"answer":"A","comment":"O art. 142 da CF define as Forças Armadas como permanentes e regulares, sob a autoridade suprema do Presidente da República. Aos militares são vedadas sindicalização e greve (art. 142, § 3º, IV).","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q06","source":"Instituto AOCP (2022) - DEPEN - Agente Federal de Execução Penal","text":"A Emenda Constitucional nº 104/2019 criou formalmente a Polícia Penal no ordenamento jurídico brasileiro. Assinale a alternativa que indica corretamente a subordinação administrativa das Polícias Penais estaduais:","options":["Aos Ministérios Públicos dos respectivos Estados.","Aos Tribunais de Justiça estaduais.","Às Secretarias de Segurança Pública ou de Administração Penitenciária dos Estados e do Distrito Federal.","Exclusivamente ao Ministério da Justiça e Segurança Pública.","Ao Comando do Exército Brasileiro."],"answer":"C","comment":"O art. 144, § 5º-A estabelece que a Polícia Penal estadual e distrital é vinculada ao órgão administrador do sistema penitenciário do respectivo ente federado.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q07","source":"Instituto AOCP (2023) - PM-SC - Soldado","text":"A segurança viária, prevista no art. 144, § 10 da Constituição Federal, compreende a educação, engenharia e fiscalização de trânsito. Ela é exercida para:","options":["garantir o livre comércio de veículos automotores nas rodovias federais.","assegurar o direito do cidadão ao trânsito seguro, nos termos da lei.","arrecadar tributos e taxas de licenciamento de competência exclusiva dos municípios.","coordenar exclusivamente o tráfego aéreo e marítimo nacional.","substituir os órgãos de inteligência da Polícia Federal."],"answer":"B","comment":"O § 10 do art. 144 da CF dispõe que a segurança viária compete aos órgãos executivos de trânsito para assegurar o direito do cidadão ao trânsito seguro.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q08","source":"Instituto AOCP (2024) - SEAP-PA - Policial Penal","text":"Sobre os princípios e vedações aplicáveis aos militares das Forças Armadas e auxiliares, assinale a alternativa incorreta:","options":["O militar em atividade pode arrolar-se em partido político.","O militar da ativa que tomar posse em cargo,
