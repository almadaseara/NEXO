emprego ou função pública civil temporária será transferido para a reserva.","Aplica-se aos militares o princípio da proibição de acumulação remunerada de cargos públicos.","O oficial só perderá o posto e a patente se for julgado indigno do oficialato por tribunal militar.","O militar alistável é elegível, devendo passar para a reserva se tiver mais de 10 anos de serviço."],"answer":"A","comment":"O art. 142, § 3º, V da CF veda expressamente ao militar em atividade o engajamento em filiação partidária (sendo-lhe vedado arrolar-se em partidos).","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q09","source":"Instituto AOCP (2023) - PC-ES - Escrivão","text":"Durante a vigência do estado de defesa, as medidas coercitivas possíveis de serem tomadas contra pessoas incluem a prisão por crime contra o Estado, que não poderá exceder a:","options":["5 dias, devendo o preso ser comunicado imediatamente ao juiz competente.","10 dias, salvo autorização judicial para prorrogação.","30 dias, incomunicável em qualquer hipótese.","15 dias, permitida a incomunicabilidade do preso.","48 horas."],"answer":"B","comment":"O art. 136, § 3º, I da CF prevê que a prisão por crime contra o Estado cometida durante a vigência do estado de defesa não poderá exceder a dez dias, salvo autorização judicial.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q10","source":"Instituto AOCP (2024) - PM-PR - Oficial","text":"Conforme estabelece a Constituição Federal, a decretação do estado de sítio por ineficácia de medida tomada em estado de defesa não poderá ser superior, a cada vez, a:","options":["15 dias.","30 dias.","60 dias.","90 dias.","180 dias."],"answer":"B","comment":"O art. 138, § 1º da CF estipula que o estado de sítio não poderá ser decretado por mais de trinta dias a cada vez, quando motivado pela ineficácia do estado de defesa.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q11","source":"Instituto AOCP (2023) - Guarda Municipal de Vila Velha - ES","text":"As Guardas Municipais poderão ser instituídas pelos Municípios para a proteção de seus bens, serviços e instalações, conforme dispuser a lei. A criação de tais corporações municipais é:","options":["obrigatória para todos os municípios brasileiros com mais de 50 mil habitantes.","facultativa, podendo os municípios constituir guardas municipais destinadas à proteção patrimonial e viária.","privativa das capitais e regiões metropolitanas.","restrita à autorização prévia por decreto do Presidente da República.","vedada pela Constituição Federal."],"answer":"B","comment":"O § 8º do art. 144 faculta aos municípios a instituição de guardas municipais para proteção de bens, serviços e instalações.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q12","source":"Instituto AOCP (2022) - PC-GO - Agente","text":"Às Polícias Civis, dirigidas por delegados de polícia de carreira, incumbem, ressalvada a competência da União, as funções de:","options":["polícia ostensiva e preservação da ordem pública.","polícia judiciária e a apuração de infrações penais, exceto as militares.","guarda prisional e escolta de condenados.","patrulhamento ostensivo das rodovias federais e estaduais.","controle do tráfego urbano e fiscalização de estradas vicinais."],"answer":"B","comment":"O art. 144, § 4º da CF delimita que às polícias civis cabem a polícia judiciária e a apuração de infrações penais, ressalvadas as competências militares e federais.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q13","source":"Instituto AOCP (2024) - PMDF - Praça","text":"A intervenção federal nos Estados e no Distrito Federal é medida excepcional que afasta temporariamente a autonomia do ente federado. Assinale a hipótese em que o Presidente da República decretará a intervenção federal independentemente de representação ou solicitação:","options":["para garantir o livre exercício de qualquer dos Poderes nas unidades da Federação.","para prover a execução de lei federal, ordem ou decisão judicial.","para repelir invasão estrangeira ou de uma unidade da Federação em outra.","para reorganizar as finanças da unidade da Federação que suspender o pagamento da dívida fundada por mais de dois anos consecutivos.","para assegurar o respeito aos direitos da pessoa humana."],"answer":"C","comment":"O art. 34, III da CF prevê a decretação espontânea (sem necessidade de solicitação ou requisição) no caso de repelir invasão estrangeira ou de uma unidade federada em outra.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q14","source":"Instituto AOCP (2023) - SEJUC-RN - Policial Penal","text":"Em relação aos órgãos de segurança pública previstos na Constituição Federal, a Polícia Ferroviária Federal, órgão permanente, organiza-se em carreira e destina-se ao patrulhamento ostensivo das ferrovias federais. Ela é subordinada a qual órgão?","options":["Ministério dos Transportes.","Ministério da Justiça e Segurança Pública.","Gabinete de Segurança Institucional da Presidência da República.","Comando do Exército.","Ministério da Defesa."],"answer":"B","comment":"A Polícia Ferroviária Federal integra a estrutura do Ministério da Justiça e Segurança Pública, conforme organização do Poder Executivo federal e art. 144 da CF.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q15","source":"Instituto AOCP (2024) - PM-ES - Oficial","text":"O decreto que instituir o estado de defesa ou o estado de sítio indicará o tempo de sua duração, especificará as áreas abrangidas e determinará as medidas de coerção a serem vigoradas. O decreto será submetido pelo Presidente da República ao Congresso Nacional, com justificativa, dentro de:","options":["24 horas.","48 horas.","72 horas.","5 dias úteis.","15 dias."],"answer":"A","comment":"O art. 136, § 4º da CF estabelece que o decreto de estado de defesa será submetido pelo Presidente da República ao Congresso Nacional, com justificativa, dentro de vinte e quatro horas.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q16","source":"Instituto AOCP (2023) - PC-PA - Delegado","text":"Durante o estado de sítio decretado com fundamento em grave comoção de âmbito nacional ou ocorrência de fatos que comprovem a ineficácia de medida tomada durante o estado de defesa, poderão ser tomadas contra as pessoas certas restrições. Entre elas, NÃO se inclui:","options":["obrigação de permanência em localidade determinada.","detenção em edifício não destinado a acusados ou condenados comuns.","restrição relativa à inviolabilidade da correspondência e ao sigilo das comunicações.","suspensão da liberdade de imprensa em caráter irrevogável e definitivo.","busca e apreensão em domicílio."],"answer":"D","comment":"O art. 139 elenca as medidas restritivas admissíveis no estado de sítio. Nenhuma medida no direito constitucional brasileiro prevê suspensão irrevogável ou definitiva da liberdade de imprensa.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q17","source":"Instituto AOCP (2024) - Pref. de Manaus - Guarda Municipal","text":"Às Polícias Militares cabem a polícia ostensiva e a preservação da ordem pública. Conforme a organização militar estadual, os Corpos de Bombeiros Militares exercem funções específicas de:","options":["investigações criminais de delitos cometidos por civis.","execução de atividades de polícia judiciária militar.","defesa civil, prevenção e combate a incêndios, busca e salvamento.","policiamento de trânsito rodoviário estadual nas rodovias concessionadas.","guarda e escolta de presos nos estabelecimentos prisionais de segurança máxima."],"answer":"C","comment":"O art. 144, § 5º da CF estabelece que aos Corpos de Bombeiros Militares incumbem a execução de atividades de defesa civil, combate a incêndios e salvamento.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q18","source":"Instituto AOCP (2023) - PM-CE - Soldado","text":"A competência para legislar sobre normas gerais de organização, efetivos, material bélico, garantias, convocação e mobilização das Polícias Militares e Corpos de Bombeiros Militares é:","options":["exclusiva dos Estados e do Distrito Federal.","privativa da União.","concorrente entre União e Estados.","privativa dos Municípios.","comum entre União, Estados e Municípios."],"answer":"B","comment":"Conforme o art. 22, XXI da CF, compete privativamente à União legislar sobre normas gerais de organização, efetivos, material bélico e garantias das polícias militares e corpos de bombeiros militares.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q19","source":"Instituto AOCP (2022) - DEPEN - Especialista Federal","text":"A criação da Polícia Penal pela Emenda Constitucional nº 104/2019 alterou a estrutura do art. 144 da Constituição Federal. Diga qual das alternativas descreve corretamente a atribuição da Polícia Penal:","options":["Patrulhamento ostensivo de fronteiras e controle alfandegário.","Investigação de crimes hediondos praticados fora dos presídios.","Segurança dos estabelecimentos penais.","Execução exclusiva de penas restritivas de direitos em meio aberto.","Julgamento de infrações disciplinares de presos definitivos."],"answer":"C","comment":"O art. 144, § 5º-A preceitua que à Polícia Penal, vinculada ao órgão administrador do sistema penitenciário, incumbe a segurança dos estabelecimentos penais.","collection":"caderno_assunto_1_defesa_do_estado.pdf"},{"num":"Q20","source":"Instituto AOCP (2024) - PC-GO - Escrivão","text":"Assinale a alternativa que apresenta uma regra correta sobre as Forças Armadas e sua atuação subsidiária conforme a ordem constitucional brasileira:","options":["As Forças Armadas podem atuar por iniciativa própria e autônoma em qualquer conflito de competência municipal.","A lei atribuirá aos conscritos, no período do serviço militar obrigatório, encargos relacionados à defesa civil e assistência social comunitária.","O alistamento militar é obrigatório para as mulheres em tempo de paz.","As patentes com prerrogativas, direitos e deveres são conferidas exclusivamente pelo Ministro da Justiça.","A mobilização nacional depende de prévia consulta popular via plebiscito."],"answer":"B","comment":"O art. 143, § 2º da CF determina que às Forças Armadas caberá, na forma da lei, atribuir serviço alternativo aos que, em tempo de paz, houverem alegado impergibilidade de consciência, bem como fixar encargos aos conscritos no serviço militar.","collection":"caderno_assunto_1_defesa_do_estado.pdf"}],"discipline":"Direito Constitucional"},{"id":"principios_fundamentais","title":"Princípios Fundamentais & Teoria Constitucional","priority":"ALTA","focus":"Arts. 1º a 4º, objetivos fundamentais, fundamentos, relações internacionais e classificação constitucional.","summary":["Este módulo foi acrescentado para acomodar as questões do novo caderno dentro do respectivo assunto constitucional.","<mark>Foco de prova:</mark> Arts. 1º a 4º, objetivos fundamentais, fundamentos, relações internacionais e classificação constitucional.","A revisão deve priorizar a literalidade constitucional e as distinções conceituais que aparecem nas alternativas."],"highlights":["Fundamentos da República.","Objetivos fundamentais.","Princípios das relações internacionais.","Constituição promulgada e rígida."],"pegadinhas":["Leia o dispositivo constitucional exato antes de memorizar a resposta.","A AOCP costuma misturar conceitos próximos em alternativas aparentemente corretas.","Dê atenção especial a expressões taxativas, quóruns, competências e exceções."],"law_items":[["Arts. 1º a 4º","Fundamentos, objetivos fundamentais e princípios das relações internacionais."],["Art. 60","Rito especial de reforma constitucional, relevante para a classificação da CF/88 como rígida."]],"juris":[],"questions":[{"num":"Q1","source":"Instituto AOCP (2025) - MPE-RS - Analista","topic":"Princípios Fundamentais","text":"Em relação aos princípios fundamentais da República Federativa do Brasil expressos na Constituição Federal de 1988, assinale a alternativa que apresenta um objetivo fundamental.","options":["A soberania e a cidadania.","A dignidade da pessoa humana e os valores sociais do trabalho.","Erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais.","O pluralismo político e a prevalência dos direitos humanos.","A autodeterminação dos povos e a não intervenção."],"answer":"C","comment":"Gabarito indicado no caderno: C. Art. 3º, III da CF: erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"},{"num":"Q2","source":"Instituto AOCP (2024) - IF-PA - Técnico / Superior","topic":"Teoria Geral & Classificação","text":"Em relação às características e classificações da Constituição Federal brasileira de 1988, é correto afirmar que ela é classificada, quanto à sua origem e quanto ao seu processo de alteração, respectivamente, como","options":["outorgada e flexível.","promulgada e rígida.","cesarista e semirrígida.","pactuada e imutável.","promulgada e supralegal."],"answer":"B","comment":"Gabarito indicado no caderno: B. A CF/88 é promulgada e rígida, pois nasceu de Assembleia Nacional Constituinte e exige rito mais dificultoso para alteração.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"funcoes_essenciais","title":"Funções Essenciais à Justiça","priority":"ALTA","focus":"Arts. 127 a 135: Ministério Público, Advocacia Pública, Advocacia e Defensoria Pública.","summary":["Este módulo foi acrescentado para acomodar as questões do novo caderno dentro do respectivo assunto constitucional.","<mark>Foco de prova:</mark> Arts. 127 a 135: Ministério Público, Advocacia Pública, Advocacia e Defensoria Pública.","A revisão deve priorizar a literalidade constitucional e as distinções conceituais que aparecem nas alternativas."],"highlights":["Unidade, indivisibilidade e independência funcional do MP.","Funções constitucionais do Ministério Público.","Advocacia Pública e Defensoria Pública."],"pegadinhas":["Leia o dispositivo constitucional exato antes de memorizar a resposta.","A AOCP costuma misturar conceitos próximos em alternativas aparentemente corretas.","Dê atenção especial a expressões taxativas, quóruns, competências e exceções."],"law_items":[["Art. 127","Ministério Público e seus princípios institucionais."],["Arts. 131 a 135","Advocacia Pública, Advocacia e Defensoria Pública."]],"juris":[],"questions":[{"num":"Q12","source":"Instituto AOCP (2025) - MPE-RS - Analista do MP","topic":"Ministério Público","text":"O Ministério Público é instituição permanente, essencial à função jurisdicional do Estado, incumbindo-lhe a defesa da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis. São princípios institucionais do MP:","options":["a unidade, a indivisibilidade e a independência funcional.","a hierarquia rígida, a descentralização e a autonomia orgânica.","a inamovibilidade, a vitaliciedade e a irredutibilidade de subsídio.","a legalidade, a impessoalidade, a moralidade e a eficiência.","a colegialidade, a cooperação externa e a discricionariedade."],"answer":"A","comment":"Gabarito indicado no caderno: A. Art. 127, §1º, CF.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"sistema_tributario_orcamento","title":"Sistema Tributário & Orçamento","priority":"COMPLEMENTAR","focus":"Arts. 145 a 169: sistema tributário, finanças públicas, PPA, LDO e LOA.","summary":["Este módulo foi acrescentado para acomodar as questões do novo caderno dentro do respectivo assunto constitucional.","<mark>Foco de prova:</mark> Arts. 145 a 169: sistema tributário, finanças públicas, PPA, LDO e LOA.","A revisão deve priorizar a literalidade constitucional e as distinções conceituais que aparecem nas alternativas."],"highlights":["Diferenças entre PPA, LDO e LOA.","Metas e prioridades na LDO.","Orçamento público constitucional."],"pegadinhas":["Leia o dispositivo constitucional exato antes de memorizar a resposta.","A AOCP costuma misturar conceitos próximos em alternativas aparentemente corretas.","Dê atenção especial a expressões taxativas, quóruns, competências e exceções."],"law_items":[["Art. 165","PPA, LDO e LOA."],["Arts. 145 a 162","Sistema tributário e repartição de receitas."]],"juris":[],"questions":[{"num":"Q14","source":"Instituto AOCP (2024) - IF-PA - Contador / Auditor","topic":"Leis de Orçamento","text":"O documento orçamentário previsto no Art. 165, § 6º da CF/88 que compreende as metas e prioridades da administração pública federal e orienta a elaboração da lei orçamentária anual é a","options":["Lei do Plano Plurianual (PPA).","Lei de Diretrizes Orçamentárias (LDO).","Lei Orçamentária Anual (LOA).","Demonstração das Variações Patrimoniais.","Lei de Responsabilidade Fiscal."],"answer":"B","comment":"Gabarito indicado no caderno: B. A LDO estabelece metas e prioridades e orienta a elaboração da LOA.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"ordem_economica_social","title":"Ordem Econômica & Social","priority":"COMPLEMENTAR","focus":"Arts. 170 a 232: atividade econômica, seguridade social e ordem social.","summary":["Este módulo foi acrescentado para acomodar as questões do novo caderno dentro do respectivo assunto constitucional.","<mark>Foco de prova:</mark> Arts. 170 a 232: atividade econômica, seguridade social e ordem social.","A revisão deve priorizar a literalidade constitucional e as distinções conceituais que aparecem nas alternativas."],"highlights":["Valorização do trabalho humano e livre iniciativa.","Existência digna.","Seguridade social."],"pegadinhas":["Leia o dispositivo constitucional exato antes de memorizar a resposta.","A AOCP costuma misturar conceitos próximos em alternativas aparentemente corretas.","Dê atenção especial a expressões taxativas, quóruns, competências e exceções."],"law_items":[["Art. 170","Princípios gerais da atividade econômica."],["Art. 194","Seguridade social e seus objetivos."]],"juris":[],"questions":[{"num":"Q15","source":"Instituto AOCP (2024) - IPE Prev - Analista","topic":"Ordem Social e Seguridade","text":"Com base nos princípios gerais da atividade econômica e da ordem social (Arts. 170 e 194 da CF), assinale a alternativa correta:","options":["A ordem econômica é fundada na valorização do trabalho humano e na livre iniciativa e tem por finalidade assegurar a todos existência digna.","A seguridade social é financiada exclusivamente de forma direta pelo Poder Público municipal e estadual.","É vedada a exploração de atividade econômica pelo Estado sob qualquer hipótese.","As empresas públicas não se sujeitam ao regime de licitações."],"answer":"A","comment":"Gabarito indicado no caderno: A. Redação correspondente ao caput do art. 170 da CF.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"adm_regime_principios","title":"Regime Jurídico-Administrativo & Princípios","discipline":"Direito Administrativo","priority":"ALTA","focus":"Supremacia e indisponibilidade do interesse público; princípios expressos e implícitos; autotutela, motivação, razoabilidade e segurança jurídica.","summary":["O <mark>regime jurídico-administrativo</mark> reúne prerrogativas e sujeições próprias da Administração. Sua base clássica está na <u>supremacia do interesse público</u> e na <u>indisponibilidade do interesse público</u>.","Os princípios expressos do art. 37, caput, formam o mnemônico <mark>LIMPE</mark>: legalidade, impessoalidade, moralidade, publicidade e eficiência.","Em prova, compare <u>autotutela</u> (anular atos ilegais e revogar atos válidos por conveniência/oportunidade) com controle judicial, que não revoga ato administrativo válido.","A Lei 9.784/1999 reforça princípios como finalidade, motivação, razoabilidade, proporcionalidade, contraditório, ampla defesa, segurança jurídica e interesse público."],"highlights":["LIMPE — art. 37, caput.","Supremacia x indisponibilidade do interesse público.","Autotutela: anulação x revogação.","Segurança jurídica e decadência administrativa.","Motivação como exposição dos fundamentos de fato e de direito."],"pegadinhas":["Legalidade administrativa é mais restritiva que a autonomia privada.","Publicidade não é absoluta: há hipóteses legais de sigilo.","Autotutela não afasta o controle judicial.","A Administração não pode revogar ato por ilegalidade; nesse caso, anula."],"law_items":[["CF, art. 37, caput","A Administração Pública direta e indireta obedecerá aos princípios da <mark>legalidade, impessoalidade, moralidade, publicidade e eficiência</mark>."],["Lei 9.784/1999, art. 2º","A Administração Pública obedecerá, entre outros, aos princípios da legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência."],["Lei 9.784/1999, art. 53","A Administração <mark>deve anular</mark> seus próprios atos quando eivados de vício de legalidade e <mark>pode revogá-los</mark> por conveniência ou oportunidade, respeitados os direitos adquiridos."],["Lei 9.784/1999, art. 54","O direito da Administração de anular atos administrativos favoráveis decai em <mark>cinco anos</mark>, salvo comprovada má-fé."]],"juris":[["Súmula 473/STF — autotutela","A Administração pode anular seus próprios atos ilegais ou revogá-los por conveniência ou oportunidade, respeitados direitos adquiridos e o controle judicial."],["Súmula Vinculante 13 — nepotismo","A nomeação de cônjuge, companheiro ou parente até o terceiro grau, nas hipóteses definidas pela súmula, viola a Constituição e se relaciona diretamente com moralidade e impessoalidade."]],"questions":[],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2024) — UFS","text":"Como administrador público, qual princípio busca a melhor relação custo-benefício possível na aplicação dos recursos públicos?","options":["Princípio da eficiência.","Princípio da legalidade.","Princípio da publicidade.","Princípio da moralidade.","Princípio da impessoalidade."],"answer":"A","comment":"O material identifica a eficiência como o princípio relacionado à prestação de serviços de qualidade, com melhor uso possível de recursos e tempo.","collection":"1. Regime jurídico-administrativo. C.pdf"},{"num":"Q02","source":"Instituto AOCP (2024) — CBM-PE","text":"O art. 53 da Lei nº 9.784/1999, ao prever anulação dos atos ilegais e revogação por conveniência ou oportunidade, descreve o princípio da:","options":["legalidade.","impessoalidade.","publicidade.","eficiência.","autotutela."],"answer":"E","comment":"O dispositivo reproduz a lógica da autotutela administrativa, também sintetizada pela Súmula 473 do STF.","collection":"1. Regime jurídico-administrativo. C.pdf"}]},{"id":"adm_organizacao","title":"Organização Administrativa","discipline":"Direito Administrativo","priority":"MUITO ALTA","focus":"Centralização, descentralização, concentração, desconcentração; Administração Direta e Indireta; autarquias e órgãos públicos.","summary":["A organização administrativa estuda como o Estado estrutura <mark>entidades, órgãos e agentes</mark> para desempenhar suas funções.","<u>Centralização</u> ocorre quando o próprio ente político executa a atividade. <u>Descentralização</u> envolve outra pessoa jurídica; <u>desconcentração</u> distribui competências internamente entre órgãos da mesma pessoa jurídica.","Entidade possui personalidade jurídica; órgão é centro de competências sem personalidade jurídica própria.","As autarquias integram a Administração Indireta e são pessoas jurídicas de direito público criadas diretamente por lei."],"highlights":["Entidade ≠ órgão.","Descentralização ≠ desconcentração.","Administração Direta x Indireta.","Autarquia: pessoa jurídica de direito público.","Vinculação não significa hierarquia entre Administração Direta e entidade da Indireta."],"pegadinhas":["Descentralização por serviço transfere titularidade/execução a entidade criada ou autorizada por lei; por colaboração, a execução é atribuída a particular.","Órgãos não têm personalidade jurídica.","Administração Indireta traduz descentralização administrativa."],"law_items":[["DL 200/1967, art. 4º","A Administração Federal compreende a Administração Direta e a Administração Indireta."],["Lei 9.784/1999, art. 1º, §2º","Para fins da lei, órgão é unidade de atuação integrante da estrutura da Administração; entidade é unidade de atuação dotada de personalidade jurídica."],["CF, art. 37, XIX","Somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, sociedade de economia mista e fundação."]],"juris":[["STF — regime dos conselhos profissionais","Os conselhos de fiscalização profissional possuem natureza autárquica, mas a jurisprudência distingue aspectos específicos de seu regime, inclusive quanto a precatórios."]],"questions":[],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2018) — TRT-1","text":"A respeito da organização da Administração Pública, assinale a alternativa correta.","options":["Os pagamentos devidos pelos Conselhos Profissionais submetem-se sempre ao regime de precatórios.","O regime jurídico de direito privado das empresas públicas é parcialmente derrogado por normas de direito público, formando regime híbrido.","A dotação patrimonial das fundações públicas deve ser inteiramente pública.","Sociedades de economia mista podem adotar qualquer forma societária.","Descentralização por serviço ocorre sempre mediante contrato com pessoa jurídica privada."],"answer":"B","comment":"O material destaca o regime híbrido das empresas estatais: embora tenham personalidade de direito privado, submetem-se a diversas normas de direito público.","collection":"2. Noções de organização administrat.pdf"}]},{"id":"adm_estatais_fundacoes","title":"Fundações, Empresas Públicas & Sociedades de Economia Mista","discipline":"Direito Administrativo","priority":"ALTA","focus":"Empresas estatais, fundações públicas, regime jurídico, criação, capital, forma societária e atuação econômica.","summary":["Empresas públicas e sociedades de economia mista são pessoas jurídicas de direito privado da Administração Indireta, submetidas a <mark>regime híbrido</mark>.","A empresa pública pode adotar diferentes formas societárias e possui capital exclusivamente público; a sociedade de economia mista deve ser sociedade anônima e admite capital público e privado, com controle estatal.","As fundações públicas podem possuir personalidade de direito público ou de direito privado, conforme o modelo adotado.","A exploração direta de atividade econômica pelo Estado é excepcional e depende das hipóteses constitucionais, imperativo de segurança nacional ou relevante interesse coletivo."],"highlights":["Empresa pública: capital público e forma societária flexível.","SEM: sociedade anônima e controle estatal.","Estatais submetem-se a concurso público.","Lei 13.303/2016 — estatuto das estatais.","Fundação pública pode ter regime de direito público ou privado."],"pegadinhas":["Empresa pública não é órgão.","Sociedade de economia mista não pode adotar qualquer forma societária.","A personalidade privada não elimina incidência de regras públicas."],"law_items":[["CF, art. 173","A exploração direta de atividade econômica pelo Estado é admitida nos casos previstos na Constituição ou quando necessária aos imperativos da segurança nacional ou a relevante interesse coletivo."],["CF, art. 37, XIX e XX","A criação/autorização de entidades da Administração Indireta depende de lei específica; subsidiárias e participação em empresa privada dependem de autorização legislativa."],["Lei 13.303/2016, arts. 3º e 4º","Disciplina o estatuto jurídico da empresa pública, da sociedade de economia mista e de suas subsidiárias."]],"juris":[],"questions":[],"official_questions":[{"num":"Q01","source":"AOCP (2017) — Polícia Penal/PA","text":"Acerca da administração pública direta e indireta, assinale a alternativa correta.","options":["Autarquias são órgãos da administração direta.","Não é permitida a criação de fundações públicas.","A Administração Direta traduz descentralização.","Empresas públicas são entidades da Administração Indireta.","Estados e Municípios são órgãos da Administração Indireta."],"answer":"D","comment":"Empresas públicas integram a Administração Indireta. Autarquias e fundações também são entidades, não órgãos.","collection":"3. Fundações, empresas públicas e so.pdf"}]},{"id":"adm_poderes","title":"Poderes Administrativos","discipline":"Direito Administrativo","priority":"MÉDIA","focus":"Poder hierárquico, disciplinar, regulamentar/normativo, poder de polícia, vinculado e discricionário; abuso de poder.","summary":["Os poderes administrativos são <mark>instrumentos para cumprimento do dever funcional</mark>; não são privilégios pessoais do agente.","O poder hierárquico organiza, distribui e fiscaliza competências internas. O disciplinar permite apurar e sancionar infrações funcionais e de particulares sujeitos a vínculo específico.","O poder regulamentar/normativo viabiliza a fiel execução da lei. O poder de polícia condiciona direitos e atividades privadas em benefício do interesse coletivo.","O abuso de poder pode ocorrer por <u>excesso de poder</u> (competência) ou <u>desvio de finalidade</u>."],"highlights":["Hierárquico: ordenar, fiscalizar, delegar e avocar.","Disciplinar: sanções em vínculos específicos.","Regulamentar: fiel execução da lei.","Polícia: restrição de liberdade/propriedade em benefício coletivo.","Excesso de poder x desvio de finalidade."],"pegadinhas":["Não confundir poder disciplinar com poder de polícia.","Discricionariedade não significa liberdade absoluta.","Abuso de poder torna a atuação ilegítima."],"law_items":[["CF, art. 84, IV","Compete ao Presidente da República expedir decretos e regulamentos para a fiel execução das leis."],["CTN, art. 78","Define poder de polícia como atividade administrativa que limita ou disciplina direito, interesse ou liberdade em razão do interesse público."],["Lei 9.784/1999, arts. 11 a 15","Trata de competência, delegação e avocação no processo administrativo federal."]],"juris":[],"questions":[],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2019) — Prefeitura de São Bento do Sul","text":"Sobre o poder de polícia, assinale a definição correta.","options":["Editar atos gerais e abstratos para dar fiel execução à lei.","Aplicar punições aos agentes públicos por infrações funcionais.","Distribuir e escalonar funções internas e rever a atuação de agentes.","Atividade estatal restritiva de interesses privados, limitando liberdade e propriedade em favor do interesse público.","Controlar politicamente os atos do Poder Legislativo."],"answer":"D","comment":"O material define poder de polícia como faculdade de condicionar e restringir bens, atividades e direitos individuais em benefício da coletividade ou do próprio Estado.","collection":"4. Poderes administrativos. Hierárqu.pdf"}]},{"id":"adm_atos","title":"Atos Administrativos","discipline":"Direito Administrativo","priority":"ALTA","focus":"Conceito, elementos, atributos, classificação, espécies, vícios, mérito, extinção, convalidação e decadência.","summary":["Ato administrativo é manifestação unilateral da Administração, sob regime jurídico administrativo, destinada a produzir efeitos jurídicos.","Os cinco elementos clássicos são <mark>competência, finalidade, forma, motivo e objeto</mark>. Atributos incluem presunção de legitimidade/veracidade, imperatividade e, em hipóteses próprias, autoexecutoriedade e tipicidade.","Quanto à retirada: <u>anulação</u> decorre de ilegalidade; <u>revogação</u> decorre de conveniência e oportunidade; cassação, caducidade e contraposição têm fundamentos distintos.","A convalidação corrige vícios sanáveis quando não houver lesão ao interesse público nem prejuízo a terceiros."],"highlights":["COFIFOMOB: competência, finalidade, forma, motivo e objeto.","Anulação x revogação.","Presunção de legitimidade.","Mérito administrativo: motivo e objeto nos atos discricionários.","Convalidação e vícios sanáveis."],"pegadinhas":["Autoexecutoriedade não é elemento do ato.","Nem todo ato possui imperatividade ou autoexecutoriedade.","Judiciário pode anular ato ilegal, mas não revogá-lo por mérito."],"law_items":[["Lei 4.717/1965, art. 2º","A Lei da Ação Popular trabalha com vícios relacionados a competência, forma, objeto, motivo e finalidade."],["Lei 9.784/1999, art. 50","Os atos administrativos deverão ser motivados nas hipóteses previstas em lei, com indicação dos fatos e fundamentos jurídicos."],["Lei 9.784/1999, art. 55","Atos com defeitos sanáveis poderão ser convalidados pela própria Administração quando não houver lesão ao interesse público nem prejuízo a terceiros."]],"juris":[["Súmula 473/STF","Base clássica para anulação e revogação de atos administrativos pela própria Administração."]],"questions":[],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2019) — Câmara Municipal do Cabo de Santo Agostinho","text":"A respeito dos atos administrativos, assinale a alternativa correta.","options":["Os cinco requisitos são competência, finalidade, forma, motivo e autoexecutoriedade.","É possível avocar competência de órgão hierarquicamente superior ou inferior.","Circular é sempre ato individual.","Atos complexos resultam da soma de vontades de órgãos independentes; a aposentadoria é exemplo clássico de ato complexo.","Todo ato administrativo é irrevogável."],"answer":"D","comment":"O material lembra que os elementos são competência, finalidade, forma, motivo e objeto; autoexecutoriedade é atributo. Também aponta a aposentadoria como exemplo clássico de ato complexo.","collection":"5. Ato administrativo. Conceito, req.pdf"}]},{"id":"adm_licitacao_principios","title":"Licitação — Princípios, Modalidades & Procedimento","discipline":"Direito Administrativo","priority":"MUITO ALTA","focus":"Lei 14.133/2021: princípios, objetivos, agentes, modalidades, critérios de julgamento e fases da licitação.","summary":["A Lei 14.133/2021 concentra as normas gerais de licitações e contratos. Em prova, destaque <mark>princípios, modalidades, critérios de julgamento e fases</mark>.","Modalidades: pregão, concorrência, concurso, leilão e diálogo competitivo. Convite e tomada de preços não integram a nova lei.","Critérios de julgamento incluem menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance e maior retorno econômico.","A publicidade é regra, mas pode haver publicidade diferida em hipóteses legais, como conteúdo das propostas antes da abertura e orçamento sigiloso quando justificado."],"highlights":["Art. 5º — princípios da Lei 14.133.","Modalidades da nova lei.","Critérios de julgamento.","Fases do procedimento.","Publicidade x sigilo legalmente admitido."],"pegadinhas":["Pregão é modalidade, não critério de julgamento.","Convite e tomada de preços foram superados pela Lei 14.133.","O conteúdo das propostas não é público antes da abertura."],"law_items":[["Lei 14.133/2021, art. 5º","A aplicação da lei observa princípios como legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, planejamento, transparência, segregação de funções, motivação, vinculação ao edital e julgamento objetivo."],["Lei 14.133/2021, art. 28","São modalidades de licitação: pregão, concorrência, concurso, leilão e diálogo competitivo."],["Lei 14.133/2021, art. 33","Estabelece os critérios de julgamento das propostas."],["Lei 14.133/2021, art. 17","Disciplina a sequência das fases do processo licitatório."]],"juris":[],"questions":[{"num":"Q-C1","source":"Questão comentada do material","topic":"Publicidade","text":"Conforme o princípio da publicidade, o conteúdo das propostas deve ser público em todas as fases da licitação, inclusive antes da abertura.","options":["Certo","Errado"],"answer":"B","comment":"O material explica que a publicidade do conteúdo das propostas é diferida até a respectiva abertura, conforme a Lei 14.133/2021."}],"official_questions":[]},{"id":"adm_contratacao_direta","title":"Licitação — Contratação Direta","discipline":"Direito Administrativo","priority":"MUITO ALTA","focus":"Dispensa e inexigibilidade, alienações, fases, instrumentos auxiliares e disposições setoriais da Lei 14.133/2021.","summary":["Contratação direta é gênero que abrange <mark>dispensa</mark> e <mark>inexigibilidade</mark>. Na dispensa, a competição é possível, mas a lei autoriza não licitar; na inexigibilidade, a competição é inviável.","O art. 74 trata da inexigibilidade e o art. 75 concentra hipóteses de dispensa.","O processo de contratação direta exige instrução formal e justificativas, inclusive razão da escolha do contratado e justificativa de preço.","A prova costuma misturar hipóteses de dispensa e inexigibilidade, além de explorar valores atualizados por decreto."],"highlights":["Dispensa ≠ inexigibilidade.","Art. 74 — inviabilidade de competição.","Art. 75 — hipóteses de dispensa.","Processo formal de contratação direta.","Valores legais podem ser atualizados anualmente."],"pegadinhas":["Fornecedor exclusivo tende à inexigibilidade, não dispensa.","Serviços técnicos especializados de natureza predominantemente intelectual exigem atenção às hipóteses legais.","Publicidade/divulgação não entra na inexigibilidade do art. 74, III."],"law_items":[["Lei 14.133/2021, art. 72","O processo de contratação direta deve ser instruído com documentos e justificativas previstos em lei."],["Lei 14.133/2021, art. 74","A licitação é inexigível quando inviável a competição, nas hipóteses legais."],["Lei 14.133/2021, art. 75 — caput e incisos selecionados","Dispõe sobre hipóteses de licitação dispensável."],["Lei 14.133/2021, art. 182","Os valores fixados na lei são atualizados anualmente pelo Poder Executivo federal."]],"juris":[],"questions":[{"num":"Q-C1","source":"Questão comentada do material","topic":"Orçamento sigiloso","text":"Nos casos devidamente justificados, o orçamento estimado poderá ter caráter sigiloso, mas o sigilo não prevalece perante órgãos de controle interno e externo.","options":["Certo","Errado"],"answer":"A","comment":"O material remete ao art. 24 da Lei 14.133/2021: o orçamento pode ser sigiloso quando justificado, sem impedir acesso dos órgãos de controle."}],"official_questions":[]},{"id":"adm_contratos","title":"Contratos Administrativos","discipline":"Direito Administrativo","priority":"MÉDIA","focus":"Lei 14.133/2021: características, cláusulas exorbitantes, duração, execução, pagamentos, extinção, nulidades, riscos e controle.","summary":["Contratos administrativos submetem-se à Lei 14.133/2021 e possuem características próprias, incluindo prerrogativas da Administração e cláusulas exorbitantes.","A execução contratual envolve fiscalização, responsabilidades, recebimento do objeto, pagamentos e, quando cabível, garantias.","A extinção pode ocorrer por diferentes causas e gera consequências previstas em lei, especialmente quando unilateral.","A nulidade contratual deve considerar o interesse público e os impactos concretos da paralisação ou invalidação."],"highlights":["Cláusulas exorbitantes.","Fiscalização da execução.","Alterações unilaterais nos limites legais.","Equilíbrio econômico-financeiro.","Extinção e nulidade contratual."],"pegadinhas":["Contrato verbal é, em regra, nulo, salvo pequenas compras/serviços de pronto pagamento nos limites legais.","Alteração unilateral não autoriza romper equilíbrio econômico-financeiro.","Nulidade deve ser analisada à luz do interesse público."],"law_items":[["Lei 14.133/2021, art. 89","Contratos regulam-se por suas cláusulas, preceitos de direito público e, supletivamente, princípios da teoria geral dos contratos e direito privado."],["Lei 14.133/2021, art. 92 — cláusulas mais cobradas","Prevê cláusulas necessárias nos contratos administrativos."],["Lei 14.133/2021, art. 104","Estabelece prerrogativas da Administração nos contratos administrativos."],["Lei 14.133/2021, arts. 137 a 139 — trechos centrais","Disciplina hipóteses de extinção e consequências da extinção unilateral."]],"juris":[],"questions":[{"num":"Q-C1","source":"Questão inédita comentada do material","topic":"Cláusulas contratuais","text":"As cláusulas contratuais devem ser claras e precisas, contendo direitos, obrigações e responsabilidades das partes.","options":["Certo","Errado"],"answer":"A","comment":"O material relaciona a assertiva ao art. 89, §§1º e 2º, da Lei 14.133/2021."}],"official_questions":[]},{"id":"adm_controle","title":"Controle da Administração Pública","discipline":"Direito Administrativo","priority":"MÉDIA","focus":"Controle administrativo, legislativo e judicial; controle interno e externo; autotutela e controle finalístico.","summary":["Controle da Administração busca verificar legalidade, legitimidade, eficiência e aderência ao interesse público.","O controle administrativo decorre da própria atividade administrativa; pode envolver <mark>autotutela</mark> e, internamente, relações hierárquicas.","O controle legislativo inclui fiscalização política e financeira, com auxílio dos Tribunais de Contas nos limites constitucionais.","O controle judicial incide sobre legalidade e legitimidade, sem substituir a Administração na escolha legítima de mérito."],"highlights":["Controle interno x externo.","Controle hierárquico x finalístico.","Autotutela.","Controle judicial de legalidade.","Papel dos Tribunais de Contas."],"pegadinhas":["Vinculação entre Administração Direta e Indireta não cria hierarquia.","Judiciário não revoga ato administrativo por conveniência e oportunidade.","Controle pode ser prévio, concomitante ou posterior."],"law_items":[["CF, arts. 70 e 71 — trechos centrais","Disciplina fiscalização contábil, financeira, orçamentária, operacional e patrimonial e competências do TCU."],["CF, art. 74","Os Poderes manterão sistema de controle interno de forma integrada."],["Lei 9.784/1999, art. 53","Expressa a autotutela administrativa quanto a atos ilegais e inconvenientes."],["CF, art. 5º, XXXV","A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito."]],"juris":[["Súmula 473/STF","A autotutela permite à Administração anular atos ilegais e revogar atos válidos por conveniência ou oportunidade."]],"questions":[],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2019) — UFPB","text":"Em termos de Administração Pública Direta, o controle da administração decorre da:","options":["vinculação administrativa.","entidade descentralizada.","subordinação hierárquica.","compreensão autoritária.","descentralização política."],"answer":"C","comment":"O material destaca que o controle interno da Administração Direta decorre da subordinação hierárquica; já o controle finalístico sobre a Indireta decorre de vinculação.","collection":"9. Controle da Administração Pública.pdf"}]},{"id":"adm_responsabilidade_estado","title":"Responsabilidade Civil do Estado","discipline":"Direito Administrativo","priority":"ALTA","focus":"Responsabilidade objetiva, risco administrativo, omissão estatal, excludentes, ação regressiva e agentes públicos.","summary":["A Constituição adota, como regra para pessoas jurídicas de direito público e prestadoras de serviço público, a <mark>responsabilidade objetiva</mark> pelos danos causados por seus agentes nessa qualidade.","O regime geral é o <u>risco administrativo</u>, que admite excludentes/atenuantes conforme o caso. O risco integral é excepcional.","Na omissão estatal, a jurisprudência trabalha com requisitos próprios e análise do dever específico de agir.","O agente responde regr function toggleFolder(id){
  const el=document.getElementById(id);
  if(!el) return;

  const willOpen=!el.classList.contains('open');

  document.querySelectorAll('.folder-wrap.open').forEach(folder=>{
    if(folder.id!==id){
      folder.classList.remove('open');
      const btn=folder.querySelector('.folder-btn');
      if(btn) btn.setAttribute('aria-expanded','false');
    }
  });

  el.classList.toggle('open',willOpen);
  const btn=el.querySelector('.folder-btn');
  if(btn) btn.setAttribute('aria-expanded',willOpen?'true':'false');
}

function wrapTextSvg(text, maxLen){
  const words = text.split(' ');
  let lines = [], current='';
  words.forEach(w=>{
    if((current + ' ' + w).trim().length <= maxLen) current = (current + ' ' + w).trim();
    else { lines.push(current); current=w; }
  });
  if(current) lines.push(current);
  return lines.slice(0,3);
}
