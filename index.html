function stripTags(s){return String(s).replace(/<[^>]+>/g,'');}
function questionHTML(q,i,prefix){
  const qkey = `${prefix}_${i}`;
  return `<div class="card q" id="card_${qkey}">
    <div class="small muted"><b>${q.num || ('Q'+(i+1))}</b> • ${q.source || 'Caderno enviado'} • ${q.topic || ''}${q.collection ? `<br><span class="official-source">Fonte: ${q.collection}</span>` : ''}</div>
    <p><b>${q.text}</b></p>
    ${q.options.map((o,j)=>`<label class="opt" id="opt_${qkey}_${j}">
      <input type="radio" name="${qkey}" value="${'ABCDE'[j]}">
      <span><b>${'ABCDE'[j]})</b> ${o}</span>
    </label>`).join('')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button onclick="checkQuestion('${prefix}',${i})">Responder</button>
      <button type="button" onclick="clearQuestion('${prefix}',${i})" style="background:#17202a;border-color:#344250;color:#cbd7e1">Limpar</button>
    </div>
    <div class="answer" id="ans_${qkey}" role="status" aria-live="polite"></div>
  </div>`;
}


const literalConstitution = {"Art. 136": "<p><b>Art. 136.</b> O Presidente da República pode, ouvidos o Conselho da República e o Conselho de Defesa Nacional, decretar estado de defesa para preservar ou prontamente restabelecer, em locais restritos e determinados, a ordem pública ou a paz social ameaçadas por grave e iminente instabilidade institucional ou atingidas por calamidades de grandes proporções na natureza.</p>\n<p><b>§ 1º</b> O decreto que instituir o estado de defesa determinará o tempo de sua duração, especificará as áreas a serem abrangidas e indicará, nos termos e limites da lei, as medidas coercitivas a vigorarem, dentre as seguintes:</p>\n<p><b>I</b> - restrições aos direitos de:</p>\n<p class=\"indent\"><b>a)</b> reunião, ainda que exercida no seio das associações;</p>\n<p class=\"indent\"><b>b)</b> sigilo de correspondência;</p>\n<p class=\"indent\"><b>c)</b> sigilo de comunicação telegráfica e telefônica;</p>\n<p><b>II</b> - ocupação e uso temporário de bens e serviços públicos, na hipótese de calamidade pública, respondendo a União pelos danos e custos decorrentes.</p>\n<p><b>§ 2º</b> O tempo de duração do estado de defesa não será superior a trinta dias, podendo ser prorrogado uma vez, por igual período, se persistirem as razões que justificaram a sua decretação.</p>\n<p><b>§ 3º</b> Na vigência do estado de defesa:</p>\n<p><b>I</b> - a prisão por crime contra o Estado, determinada pelo executor da medida, será por este comunicada imediatamente ao juiz competente, que a relaxará, se não for legal, facultado ao preso requerer exame de corpo de delito à autoridade policial;</p>\n<p><b>II</b> - a comunicação será acompanhada de declaração, pela autoridade, do estado físico e mental do detido no momento de sua autuação;</p>\n<p><b>III</b> - a prisão ou detenção de qualquer pessoa não poderá ser superior a dez dias, salvo quando autorizada pelo Poder Judiciário;</p>\n<p><b>IV</b> - é vedada a incomunicabilidade do preso.</p>\n<p><b>§ 4º</b> Decretado o estado de defesa ou sua prorrogação, o Presidente da República, dentro de vinte e quatro horas, submeterá o ato com a respectiva justificação ao Congresso Nacional, que decidirá por maioria absoluta.</p>\n<p><b>§ 5º</b> Se o Congresso Nacional estiver em recesso, será convocado, extraordinariamente, no prazo de cinco dias.</p>\n<p><b>§ 6º</b> O Congresso Nacional apreciará o decreto dentro de dez dias contados de seu recebimento, devendo continuar funcionando enquanto vigorar o estado de defesa.</p>\n<p><b>§ 7º</b> Rejeitado o decreto, cessa imediatamente o estado de defesa.</p>", "Art. 137": "<p><b>Art. 137.</b> O Presidente da República pode, ouvidos o Conselho da República e o Conselho de Defesa Nacional, solicitar ao Congresso Nacional autorização para decretar o estado de sítio nos casos de:</p>\n<p><b>I</b> - comoção grave de repercussão nacional ou ocorrência de fatos que comprovem a ineficácia de medida tomada durante o estado de defesa;</p>\n<p><b>II</b> - declaração de estado de guerra ou resposta a agressão armada estrangeira.</p>\n<p><b>Parágrafo único.</b> O Presidente da República, ao solicitar autorização para decretar o estado de sítio ou sua prorrogação, relatará os motivos determinantes do pedido, devendo o Congresso Nacional decidir por maioria absoluta.</p>", "Art. 139": "<p><b>Art. 139.</b> Na vigência do estado de sítio decretado com fundamento no art. 137, I, só poderão ser tomadas contra as pessoas as seguintes medidas:</p>\n<p><b>I</b> - obrigação de permanência em localidade determinada;</p>\n<p><b>II</b> - detenção em edifício não destinado a acusados ou condenados por crimes comuns;</p>\n<p><b>III</b> - restrições relativas à inviolabilidade da correspondência, ao sigilo das comunicações, à prestação de informações e à liberdade de imprensa, radiodifusão e televisão, na forma da lei;</p>\n<p><b>IV</b> - suspensão da liberdade de reunião;</p>\n<p><b>V</b> - busca e apreensão em domicílio;</p>\n<p><b>VI</b> - intervenção nas empresas de serviços públicos;</p>\n<p><b>VII</b> - requisição de bens.</p>\n<p><b>Parágrafo único.</b> Não se inclui nas restrições do inciso III a difusão de pronunciamentos de parlamentares efetuados em suas Casas Legislativas, desde que liberada pela respectiva Mesa.</p>", "Art. 144": "<p><b>Art. 144.</b> A segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio, através dos seguintes órgãos:</p>\n<p><b>I</b> - polícia federal;</p>\n<p><b>II</b> - polícia rodoviária federal;</p>\n<p><b>III</b> - polícia ferroviária federal;</p>\n<p><b>IV</b> - polícias civis;</p>\n<p><b>V</b> - polícias militares e corpos de bombeiros militares;</p>\n<p><b>VI</b> - polícias penais federal, estaduais e distrital.</p>\n<p><b>§ 1º</b> A polícia federal, instituída por lei como órgão permanente, organizado e mantido pela União e estruturado em carreira, destina-se a:</p>\n<p><b>I</b> - apurar infrações penais contra a ordem política e social ou em detrimento de bens, serviços e interesses da União ou de suas entidades autárquicas e empresas públicas, assim como outras infrações cuja prática tenha repercussão interestadual ou internacional e exija repressão uniforme, segundo se dispuser em lei;</p>\n<p><b>II</b> - prevenir e reprimir o tráfico ilícito de entorpecentes e drogas afins, o contrabando e o descaminho, sem prejuízo da ação fazendária e de outros órgãos públicos nas respectivas áreas de competência;</p>\n<p><b>III</b> - exercer as funções de polícia marítima, aeroportuária e de fronteiras;</p>\n<p><b>IV</b> - exercer, com exclusividade, as funções de polícia judiciária da União.</p>\n<p><b>§ 2º</b> A polícia rodoviária federal, órgão permanente, organizado e mantido pela União e estruturado em carreira, destina-se, na forma da lei, ao patrulhamento ostensivo das rodovias federais.</p>\n<p><b>§ 3º</b> A polícia ferroviária federal, órgão permanente, organizado e mantido pela União e estruturado em carreira, destina-se, na forma da lei, ao patrulhamento ostensivo das ferrovias federais.</p>\n<p><b>§ 4º</b> Às polícias civis, dirigidas por delegados de polícia de carreira, incumbem, ressalvada a competência da União, as funções de polícia judiciária e a apuração de infrações penais, exceto as militares.</p>\n<p><b>§ 5º</b> Às polícias militares cabem a polícia ostensiva e a preservação da ordem pública; aos corpos de bombeiros militares, além das atribuições definidas em lei, incumbe a execução de atividades de defesa civil.</p>\n<p><b>§ 5º-A.</b> Às polícias penais, vinculadas ao órgão administrador do sistema penal da unidade federativa a que pertencem, cabe a segurança dos estabelecimentos penais.</p>", "Art. 5º, caput": "<p><b>Art. 5º.</b> Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à <b>vida</b>, à <b>liberdade</b>, à <b>igualdade</b>, à <b>segurança</b> e à <b>propriedade</b>, nos termos seguintes:</p>", "Art. 5º, §1º": "<p><b>§ 1º</b> As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata.</p>", "Art. 5º, §2º": "<p><b>§ 2º</b> Os direitos e garantias expressos nesta Constituição não excluem outros decorrentes do regime e dos princípios por ela adotados, ou dos tratados internacionais em que a República Federativa do Brasil seja parte.</p>", "Art. 5º, §3º": "<p><b>§ 3º</b> Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às emendas constitucionais.</p>", "Art. 5º, §4º": "<p><b>§ 4º</b> O Brasil se submete à jurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão.</p>", "Incisos XI e XII": "<p><b>Art. 5º, XI</b> - a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial;</p>\n<p><b>XII</b> - é inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por ordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de investigação criminal ou instrução processual penal;</p>", "Incisos XVI a XXI": "<p><b>Art. 5º, XVI</b> - todos podem reunir-se pacificamente, sem armas, em locais abertos ao público, independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à autoridade competente;</p>\n<p><b>XVII</b> - é plena a liberdade de associação para fins lícitos, vedada a de caráter paramilitar;</p>\n<p><b>XVIII</b> - a criação de associações e, na forma da lei, a de cooperativas independem de autorização, sendo vedada a interferência estatal em seu funcionamento;</p>\n<p><b>XIX</b> - as associações só poderão ser compulsoriamente dissolvidas ou ter suas atividades suspensas por decisão judicial, exigindo-se, no primeiro caso, o trânsito em julgado;</p>\n<p><b>XX</b> - ninguém poderá ser compelido a associar-se ou a permanecer associado;</p>\n<p><b>XXI</b> - as entidades associativas, quando expressamente autorizadas, têm legitimidade para representar seus filiados judicial ou extrajudicialmente;</p>", "Incisos LXVIII a LXXIII": "<p><b>Art. 5º, LXVIII</b> - conceder-se-á habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder;</p>\n<p><b>LXIX</b> - conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, quando o responsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público;</p>\n<p><b>LXX</b> - o mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional; e por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados;</p>\n<p><b>LXXI</b> - conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania;</p>\n<p><b>LXXII</b> - conceder-se-á habeas data para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, e para a retificação de dados;</p>\n<p><b>LXXIII</b> - qualquer cidadão é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural.</p>", "Inciso LXXVIII": "<p><b>Art. 5º, LXXVIII</b> - a todos, no âmbito judicial e administrativo, são assegurados a razoável duração do processo e os meios que garantam a celeridade de sua tramitação.</p>", "Art. 6º": "<p><b>Art. 6º.</b> São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância e a assistência aos desamparados, na forma desta Constituição.</p>", "Arts. 1º a 4º": "<p><b>Art. 1º.</b> A República Federativa do Brasil, formada pela união indissolúvel dos Estados e Municípios e do Distrito Federal, constitui-se em Estado Democrático de Direito e tem como fundamentos: I - a soberania; II - a cidadania; III - a dignidade da pessoa humana; IV - os valores sociais do trabalho e da livre iniciativa; V - o pluralismo político.</p>\n<p><b>Parágrafo único.</b> Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição.</p>\n<p><b>Art. 2º.</b> São Poderes da União, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário.</p>\n<p><b>Art. 3º.</b> Constituem objetivos fundamentais da República Federativa do Brasil: I - construir uma sociedade livre, justa e solidária; II - garantir o desenvolvimento nacional; III - erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais; IV - promover o bem de todos, sem preconceitos de origem, raça, sexo, cor, idade e quaisquer outras formas de discriminação.</p>\n<p><b>Art. 4º.</b> A República Federativa do Brasil rege-se nas suas relações internacionais pelos seguintes princípios: I - independência nacional; II - prevalência dos direitos humanos; III - autodeterminação dos povos; IV - não-intervenção; V - igualdade entre os Estados; VI - defesa da paz; VII - solução pacífica dos conflitos; VIII - repúdio ao terrorismo e ao racismo; IX - cooperação entre os povos para o progresso da humanidade; X - concessão de asilo político.</p>"};

const literalAdministrative = {"CF, art. 37, caput":"<p><b>Art. 37.</b> A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de <b>legalidade, impessoalidade, moralidade, publicidade e eficiência</b> e, também, ao seguinte:</p>","Lei 9.784/1999, art. 2º":"<p><b>Art. 2º</b> A Administração Pública obedecerá, dentre outros, aos princípios da <b>legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência</b>.</p>\n<p><b>Parágrafo único.</b> Nos processos administrativos serão observados, entre outros, os critérios de:</p>\n<p class=\"indent\"><b>I</b> - atuação conforme a lei e o Direito;</p>\n<p class=\"indent\"><b>II</b> - atendimento a fins de interesse geral, vedada a renúncia total ou parcial de poderes ou competências, salvo autorização em lei;</p>\n<p class=\"indent\"><b>III</b> - objetividade no atendimento do interesse público, vedada a promoção pessoal de agentes ou autoridades;</p>\n<p class=\"indent\"><b>IV</b> - atuação segundo padrões éticos de probidade, decoro e boa-fé;</p>\n<p class=\"indent\"><b>V</b> - divulgação oficial dos atos administrativos, ressalvadas as hipóteses de sigilo previstas na Constituição;</p>\n<p class=\"indent\"><b>VI</b> - adequação entre meios e fins, vedada a imposição de obrigações, restrições e sanções em medida superior àquelas estritamente necessárias ao atendimento do interesse público;</p>\n<p class=\"indent\"><b>VII</b> - indicação dos pressupostos de fato e de direito que determinarem a decisão;</p>\n<p class=\"indent\"><b>VIII</b> - observância das formalidades essenciais à garantia dos direitos dos administrados;</p>\n<p class=\"indent\"><b>IX</b> - adoção de formas simples, suficientes para propiciar adequado grau de certeza, segurança e respeito aos direitos dos administrados;</p>\n<p class=\"indent\"><b>X</b> - garantia dos direitos à comunicação, à apresentação de alegações finais, à produção de provas e à interposição de recursos, nos processos de que possam resultar sanções e nas situações de litígio;</p>\n<p class=\"indent\"><b>XI</b> - proibição de cobrança de despesas processuais, ressalvadas as previstas em lei;</p>\n<p class=\"indent\"><b>XII</b> - impulsão, de ofício, do processo administrativo, sem prejuízo da atuação dos interessados;</p>\n<p class=\"indent\"><b>XIII</b> - interpretação da norma administrativa da forma que melhor garanta o atendimento do fim público a que se dirige, vedada aplicação retroativa de nova interpretação.</p>","Lei 9.784/1999, art. 53":"<p><b>Art. 53.</b> A Administração <b>deve anular</b> seus próprios atos, quando eivados de vício de legalidade, e <b>pode revogá-los</b> por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos.</p>","Lei 9.784/1999, art. 54":"<p><b>Art. 54.</b> O direito da Administração de anular os atos administrativos de que decorram efeitos favoráveis para os destinatários <b>decai em cinco anos</b>, contados da data em que foram praticados, salvo comprovada má-fé.</p>\n<p><b>§ 1º</b> No caso de efeitos patrimoniais contínuos, o prazo de decadência contar-se-á da percepção do primeiro pagamento.</p>\n<p><b>§ 2º</b> Considera-se exercício do direito de anular qualquer medida de autoridade administrativa que importe impugnação à validade do ato.</p>","DL 200/1967, art. 4º":"<p><b>Art. 4º</b> A Administração Federal compreende:</p>\n<p class=\"indent\"><b>I</b> - A Administração Direta, que se constitui dos serviços integrados na estrutura administrativa da Presidência da República e dos Ministérios.</p>\n<p class=\"indent\"><b>II</b> - A Administração Indireta, que compreende as seguintes categorias de entidades, dotadas de personalidade jurídica própria:</p>\n<p class=\"indent\">a) Autarquias;</p><p class=\"indent\">b) Empresas Públicas;</p><p class=\"indent\">c) Sociedades de Economia Mista;</p><p class=\"indent\">d) Fundações Públicas.</p>","Lei 9.784/1999, art. 1º, §2º":"<p><b>Art. 1º, § 2º</b> Para os fins desta Lei, consideram-se:</p>\n<p class=\"indent\"><b>I</b> - órgão - a unidade de atuação integrante da estrutura da Administração direta e da estrutura da Administração indireta;</p>\n<p class=\"indent\"><b>II</b> - entidade - a unidade de atuação dotada de personalidade jurídica;</p>\n<p class=\"indent\"><b>III</b> - autoridade - o servidor ou agente público dotado de poder de decisão.</p>","CF, art. 37, XIX":"<p><b>Art. 37, XIX</b> - somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação;</p>","CF, art. 173":"<p><b>Art. 173.</b> Ressalvados os casos previstos nesta Constituição, a exploração direta de atividade econômica pelo Estado só será permitida quando <b>necessária aos imperativos da segurança nacional ou a relevante interesse coletivo</b>, conforme definidos em lei.</p>","CF, art. 37, XIX e XX":"<p><b>Art. 37, XIX</b> - somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação;</p>\n<p><b>XX</b> - depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer delas em empresa privada;</p>","Lei 13.303/2016, arts. 3º e 4º":"<p><b>Art. 3º</b> Empresa pública é a entidade dotada de personalidade jurídica de direito privado, com criação autorizada por lei e com patrimônio próprio, cujo capital social é <b>integralmente detido pela União, pelos Estados, pelo Distrito Federal ou pelos Municípios</b>.</p>\n<p><b>Art. 4º</b> Sociedade de economia mista é a entidade dotada de personalidade jurídica de direito privado, com criação autorizada por lei, sob a forma de <b>sociedade anônima</b>, cujas ações com direito a voto pertençam em sua maioria à União, aos Estados, ao Distrito Federal, aos Municípios ou a entidade da administração indireta.</p>","CF, art. 84, IV":"<p><b>Art. 84, IV</b> - sancionar, promulgar e fazer publicar as leis, bem como <b>expedir decretos e regulamentos para sua fiel execução</b>;</p>","CTN, art. 78":"<p><b>Art. 78.</b> Considera-se poder de polícia atividade da administração pública que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato, em razão de interesse público concernente à segurança, à higiene, à ordem, aos costumes, à disciplina da produção e do mercado, ao exercício de atividades econômicas dependentes de concessão ou autorização do Poder Público, à tranquilidade pública ou ao respeito à propriedade e aos direitos individuais ou coletivos.</p>\n<p><b>Parágrafo único.</b> Considera-se regular o exercício do poder de polícia quando desempenhado pelo órgão competente nos limites da lei aplicável, com observância do processo legal e, tratando-se de atividade que a lei tenha como discricionária, sem abuso ou desvio de poder.</p>","Lei 9.784/1999, arts. 11 a 15":"<p><b>Art. 11.</b> A competência é <b>irrenunciável</b> e se exerce pelos órgãos administrativos a que foi atribuída como própria, salvo os casos de delegação e avocação legalmente admitidos.</p>\n<p><b>Art. 12.</b> Um órgão administrativo e seu titular poderão, se não houver impedimento legal, delegar parte da sua competência a outros órgãos ou titulares, <b>ainda que estes não lhe sejam hierarquicamente subordinados</b>, quando for conveniente, em razão de circunstâncias de índole técnica, social, econômica, jurídica ou territorial.</p>\n<p><b>Art. 13.</b> Não podem ser objeto de delegação:</p>\n<p class=\"indent\">I - a edição de atos de caráter normativo;</p><p class=\"indent\">II - a decisão de recursos administrativos;</p><p class=\"indent\">III - as matérias de competência exclusiva do órgão ou autoridade.</p>\n<p><b>Art. 15.</b> Será permitida, em caráter excepcional e por motivos relevantes devidamente justificados, a <b>avocação temporária</b> de competência atribuída a órgão hierarquicamente inferior.</p>","Lei 4.717/1965, art. 2º":"<p><b>Art. 2º</b> São nulos os atos lesivos ao patrimônio das entidades mencionadas no artigo anterior, nos casos de:</p>\n<p class=\"indent\">a) incompetência;</p><p class=\"indent\">b) vício de forma;</p><p class=\"indent\">c) ilegalidade do objeto;</p><p class=\"indent\">d) inexistência dos motivos;</p><p class=\"indent\">e) desvio de finalidade.</p>","Lei 9.784/1999, art. 50":"<p><b>Art. 50.</b> Os atos administrativos deverão ser motivados, com indicação dos fatos e dos fundamentos jurídicos, quando:</p>\n<p class=\"indent\">I - neguem, limitem ou afetem direitos ou interesses;</p><p class=\"indent\">II - imponham ou agravem deveres, encargos ou sanções;</p><p class=\"indent\">III - decidam processos administrativos de concurso ou seleção pública;</p><p class=\"indent\">IV - dispensem ou declarem a inexigibilidade de processo licitatório;</p><p class=\"indent\">V - decidam recursos administrativos;</p><p class=\"indent\">VIII - importem anulação, revogação, suspensão ou convalidação de ato administrativo.</p>","Lei 9.784/1999, art. 55":"<p><b>Art. 55.</b> Em decisão na qual se evidencie não acarretarem lesão ao interesse público nem prejuízo a terceiros, os atos que apresentarem defeitos sanáveis poderão ser <b>convalidados pela própria Administração</b>.</p>","Lei 14.133/2021, art. 5º":"<p><b>Art. 5º</b> Na aplicação desta Lei, serão observados os princípios da <b>legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, planejamento, transparência, eficácia, segregação de funções, motivação, vinculação ao edital, julgamento objetivo, segurança jurídica, razoabilidade, competitividade, proporcionalidade, celeridade, economicidade e desenvolvimento nacional sustentável</b>, assim como as disposições do Decreto-Lei nº 4.657, de 4 de setembro de 1942.</p>","Lei 14.133/2021, art. 28":"<p><b>Art. 28.</b> São modalidades de licitação:</p><p class=\"indent\"><b>I</b> - pregão;</p><p class=\"indent\"><b>II</b> - concorrência;</p><p class=\"indent\"><b>III</b> - concurso;</p><p class=\"indent\"><b>IV</b> - leilão;</p><p class=\"indent\"><b>V</b> - diálogo competitivo.</p>","Lei 14.133/2021, art. 33":"<p><b>Art. 33.</b> O julgamento das propostas será realizado de acordo com os seguintes critérios:</p><p class=\"indent\"><b>I</b> - menor preço;</p><p class=\"indent\"><b>II</b> - maior desconto;</p><p class=\"indent\"><b>III</b> - melhor técnica ou conteúdo artístico;</p><p class=\"indent\"><b>IV</b> - técnica e preço;</p><p class=\"indent\"><b>V</b> - maior lance, no caso de leilão;</p><p class=\"indent\"><b>VI</b> - maior retorno econômico.</p>","Lei 14.133/2021, art. 17":"<p><b>Art. 17.</b> O processo de licitação observará as seguintes fases, em sequência:</p><p class=\"indent\"><b>I</b> - preparatória;</p><p class=\"indent\"><b>II</b> - de divulgação do edital de licitação;</p><p class=\"indent\"><b>III</b> - de apresentação de propostas e lances, quando for o caso;</p><p class=\"indent\"><b>IV</b> - de julgamento;</p><p class=\"indent\"><b>V</b> - de habilitação;</p><p class=\"indent\"><b>VI</b> - recursal;</p><p class=\"indent\"><b>VII</b> - de homologação.</p>\n<p><b>§ 1º</b> A fase referida no inciso V poderá, mediante ato motivado com explicitação dos benefícios decorrentes, anteceder as fases referidas nos incisos III e IV, desde que expressamente previsto no edital de licitação.</p>","Lei 14.133/2021, art. 72":"<p><b>Art. 72.</b> O processo de contratação direta, que compreende os casos de <b>inexigibilidade e de dispensa de licitação</b>, deverá ser instruído com os seguintes documentos:</p>\n<p class=\"indent\">I - documento de formalização de demanda e, se for o caso, estudo técnico preliminar, análise de riscos, termo de referência, projeto básico ou projeto executivo;</p><p class=\"indent\">II - estimativa de despesa;</p><p class=\"indent\">III - parecer jurídico e pareceres técnicos, se for o caso;</p><p class=\"indent\">IV - demonstração da compatibilidade da previsão de recursos orçamentários;</p><p class=\"indent\">V - comprovação de que o contratado preenche os requisitos de habilitação e qualificação mínima necessária;</p><p class=\"indent\">VI - razão da escolha do contratado;</p><p class=\"indent\">VII - justificativa de preço;</p><p class=\"indent\">VIII - autorização da autoridade competente.</p>","Lei 14.133/2021, art. 74":"<p><b>Art. 74.</b> É <b>inexigível a licitação quando inviável a competição</b>, em especial nos casos de:</p>\n<p class=\"indent\">I - aquisição de materiais, de equipamentos ou de gêneros ou contratação de serviços que só possam ser fornecidos por produtor, empresa ou representante comercial exclusivos;</p><p class=\"indent\">II - contratação de profissional do setor artístico, diretamente ou por meio de empresário exclusivo, desde que consagrado pela crítica especializada ou pela opinião pública;</p><p class=\"indent\">III - contratação de serviços técnicos especializados de natureza predominantemente intelectual com profissionais ou empresas de notória especialização, vedada a inexigibilidade para serviços de publicidade e divulgação;</p><p class=\"indent\">IV - objetos que devam ou possam ser contratados por meio de credenciamento;</p><p class=\"indent\">V - aquisição ou locação de imóvel cujas características de instalações e de localização tornem necessária sua escolha.</p>","Lei 14.133/2021, art. 75 — caput e incisos selecionados":"<p><b>Art. 75.</b> É <b>dispensável a licitação</b>:</p>\n<p class=\"indent\"><b>I</b> - para contratação que envolva valores inferiores ao limite legal para obras e serviços de engenharia ou de serviços de manutenção de veículos automotores;</p><p class=\"indent\"><b>II</b> - para contratação que envolva valores inferiores ao limite legal para outros serviços e compras;</p><p class=\"indent\"><b>VIII</b> - nos casos de emergência ou de calamidade pública, quando caracterizada urgência de atendimento de situação que possa ocasionar prejuízo ou comprometer a continuidade dos serviços públicos ou a segurança de pessoas, obras, serviços, equipamentos e outros bens.</p>\n<p class=\"law-note\"><b>Atenção:</b> o art. 75 possui outras hipóteses. O NEXO exibe aqui trechos literais selecionados de maior incidência.</p>","Lei 14.133/2021, art. 182":"<p><b>Art. 182.</b> O Poder Executivo federal atualizará, <b>a cada dia 1º de janeiro</b>, pelo Índice Nacional de Preços ao Consumidor Amplo Especial (IPCA-E) ou por índice que venha a substituí-lo, os valores fixados por esta Lei, os quais serão divulgados no PNCP.</p>","Lei 14.133/2021, art. 89":"<p><b>Art. 89.</b> Os contratos de que trata esta Lei regular-se-ão pelas suas cláusulas e pelos preceitos de direito público, e a eles serão aplicados, supletivamente, os princípios da teoria geral dos contratos e as disposições de direito privado.</p><p><b>§ 1º</b> Todo contrato deverá mencionar os nomes das partes e os de seus representantes, a finalidade, o ato que autorizou sua lavratura, o número do processo da licitação ou da contratação direta e a sujeição dos contratantes às normas desta Lei e às cláusulas contratuais.</p><p><b>§ 2º</b> Os contratos deverão estabelecer com clareza e precisão as condições para sua execução, expressas em cláusulas que definam os direitos, as obrigações e as responsabilidades das partes.</p>","Lei 14.133/2021, art. 92 — cláusulas mais cobradas":"<p><b>Art. 92.</b> São necessárias em todo contrato cláusulas que estabeleçam:</p>\n<p class=\"indent\"><b>I</b> - o objeto e seus elementos característicos;</p><p class=\"indent\"><b>II</b> - a vinculação ao edital de licitação e à proposta do licitante vencedor ou ao ato que tiver autorizado a contratação direta e à respectiva proposta;</p><p class=\"indent\"><b>III</b> - a legislação aplicável à execução do contrato, inclusive quanto aos casos omissos;</p><p class=\"indent\"><b>IV</b> - o regime de execução ou a forma de fornecimento;</p><p class=\"indent\"><b>V</b> - o preço e as condições de pagamento;</p><p class=\"indent\"><b>IX</b> - a matriz de risco, quando for o caso;</p><p class=\"indent\"><b>XIV</b> - os direitos e as responsabilidades das partes, as penalidades cabíveis e os valores das multas e suas bases de cálculo.</p>\n<p class=\"law-note\"><b>Atenção:</b> artigo extenso; o NEXO exibe os trechos literais mais relevantes para revisão.</p>","Lei 14.133/2021, art. 104":"<p><b>Art. 104.</b> O regime jurídico dos contratos instituído por esta Lei confere à Administração, em relação a eles, as prerrogativas de:</p><p class=\"indent\"><b>I</b> - modificá-los, unilateralmente, para melhor adequação às finalidades de interesse público, respeitados os direitos do contratado;</p><p class=\"indent\"><b>II</b> - extingui-los, unilateralmente, nos casos especificados nesta Lei;</p><p class=\"indent\"><b>III</b> - fiscalizar sua execução;</p><p class=\"indent\"><b>IV</b> - aplicar sanções motivadas pela inexecução total ou parcial do ajuste;</p><p class=\"indent\"><b>V</b> - ocupar provisoriamente bens móveis e imóveis e utilizar pessoal e serviços vinculados ao objeto do contrato nas hipóteses previstas em lei.</p>","Lei 14.133/2021, arts. 137 a 139 — trechos centrais":"<p><b>Art. 137.</b> Constituirão motivos para extinção do contrato, a qual deverá ser <b>formalmente motivada nos autos do processo, assegurados o contraditório e a ampla defesa</b>, as situações previstas em lei.</p><p><b>Art. 138.</b> A extinção do contrato poderá ser:</p><p class=\"indent\">I - determinada por ato unilateral e escrito da Administração;</p><p class=\"indent\">II - consensual, por acordo entre as partes, conciliação, mediação ou comitê de resolução de disputas, desde que haja interesse da Administração;</p><p class=\"indent\">III - determinada por decisão arbitral ou por decisão judicial.</p><p><b>Art. 139.</b> A extinção determinada por ato unilateral da Administração poderá acarretar as consequências previstas em lei.</p>","CF, arts. 70 e 71 — trechos centrais":"<p><b>Art. 70.</b> A fiscalização contábil, financeira, orçamentária, operacional e patrimonial da União e das entidades da administração direta e indireta, quanto à <b>legalidade, legitimidade, economicidade, aplicação das subvenções e renúncia de receitas</b>, será exercida pelo Congresso Nacional, mediante controle externo, e pelo sistema de controle interno de cada Poder.</p><p><b>Art. 71.</b> O controle externo, a cargo do Congresso Nacional, será exercido com o auxílio do <b>Tribunal de Contas da União</b>.</p>","CF, art. 74":"<p><b>Art. 74.</b> Os Poderes Legislativo, Executivo e Judiciário manterão, de forma integrada, sistema de controle interno com a finalidade de:</p><p class=\"indent\">I - avaliar o cumprimento das metas previstas no plano plurianual, a execução dos programas de governo e dos orçamentos da União;</p><p class=\"indent\">II - comprovar a legalidade e avaliar os resultados, quanto à eficácia e eficiência, da gestão orçamentária, financeira e patrimonial;</p><p class=\"indent\">III - exercer o controle das operações de crédito, avais e garantias, bem como dos direitos e haveres da União;</p><p class=\"indent\">IV - apoiar o controle externo no exercício de sua missão institucional.</p>","CF, art. 5º, XXXV":"<p><b>Art. 5º, XXXV</b> - a lei <b>não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito</b>;</p>","CF, art. 37, §6º":"<p><b>Art. 37, § 6º</b> As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos <b>responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros</b>, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.</p>","CC, art. 43":"<p><b>Art. 43.</b> As pessoas jurídicas de direito público interno são civilmente responsáveis por atos dos seus agentes que nessa qualidade causem danos a terceiros, ressalvado direito regressivo contra os causadores do dano, se houver, por parte destes, culpa ou dolo.</p>","CF, art. 37, II":"<p><b>Art. 37, II</b> - a investidura em cargo ou emprego público depende de <b>aprovação prévia em concurso público de provas ou de provas e títulos</b>, de acordo com a natureza e a complexidade do cargo ou emprego, na forma prevista em lei, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração;</p>","CF, art. 37, XVI":"<p><b>Art. 37, XVI</b> - é vedada a acumulação remunerada de cargos públicos, exceto, quando houver <b>compatibilidade de horários</b>, observado em qualquer caso o disposto no inciso XI:</p><p class=\"indent\">a) a de dois cargos de professor;</p><p class=\"indent\">b) a de um cargo de professor com outro técnico ou científico;</p><p class=\"indent\">c) a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas;</p>","CF, art. 41":"<p><b>Art. 41.</b> São estáveis após <b>três anos de efetivo exercício</b> os servidores nomeados para cargo de provimento efetivo em virtude de concurso público.</p><p><b>§ 1º</b> O servidor público estável só perderá o cargo: I - em virtude de sentença judicial transitada em julgado; II - mediante processo administrativo em que lhe seja assegurada ampla defesa; III - mediante procedimento de avaliação periódica de desempenho, na forma de lei complementar, assegurada ampla defesa.</p>","Lei 8.429/1992, art. 2º":"<p><b>Art. 2º</b> Para os efeitos desta Lei, consideram-se agente público o agente político, o servidor público e todo aquele que exerce, <b>ainda que transitoriamente ou sem remuneração</b>, por eleição, nomeação, designação, contratação ou qualquer outra forma de investidura ou vínculo, mandato, cargo, emprego ou função nas entidades referidas no art. 1º desta Lei.</p>","Lei 8.429/1992, art. 1º, §1º":"<p><b>Art. 1º, § 1º</b> Consideram-se atos de improbidade administrativa as <b>condutas dolosas</b> tipificadas nos arts. 9º, 10 e 11 desta Lei, ressalvados tipos previstos em leis especiais.</p><p><b>§ 2º</b> Considera-se dolo a vontade livre e consciente de alcançar o resultado ilícito tipificado nos arts. 9º, 10 e 11 desta Lei, <b>não bastando a voluntariedade do agente</b>.</p><p><b>§ 3º</b> O mero exercício da função ou desempenho de competências públicas, sem comprovação de ato doloso com fim ilícito, afasta a responsabilidade por ato de improbidade administrativa.</p>","Lei 8.429/1992, arts. 9º a 11 — caputs":"<p><b>Art. 9º</b> Constitui ato de improbidade administrativa importando em <b>enriquecimento ilícito</b> auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida em razão do exercício de cargo, de mandato, de função, de emprego ou de atividade nas entidades referidas no art. 1º desta Lei.</p><p><b>Art. 10.</b> Constitui ato de improbidade administrativa que causa <b>lesão ao erário</b> qualquer ação ou omissão dolosa, que enseje, efetiva e comprovadamente, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação dos bens ou haveres das entidades referidas no art. 1º desta Lei.</p><p><b>Art. 11.</b> Constitui ato de improbidade administrativa que atenta contra os <b>princípios da administração pública</b> a ação ou omissão dolosa que viole os deveres de honestidade, de imparcialidade e de legalidade, caracterizada por uma das condutas previstas em lei.</p>","Lei 8.429/1992, art. 12":"<p><b>Art. 12.</b> Independentemente do ressarcimento integral do dano patrimonial, se efetivo, e das demais sanções previstas na legislação, está o responsável pelo ato de improbidade sujeito às cominações legais, que podem ser aplicadas isolada ou cumulativamente, de acordo com a gravidade do fato.</p><p><b>I</b> - na hipótese do art. 9º: suspensão dos direitos políticos <b>até 14 anos</b> e demais sanções legais;</p><p><b>II</b> - na hipótese do art. 10: suspensão dos direitos políticos <b>até 12 anos</b> e demais sanções legais;</p><p><b>III</b> - na hipótese do art. 11: multa civil de até <b>24 vezes</b> o valor da remuneração percebida pelo agente e proibição de contratar ou receber benefícios pelo prazo não superior a <b>4 anos</b>.</p>","Lei 8.429/1992, art. 23":"<p><b>Art. 23.</b> A ação para a aplicação das sanções previstas nesta Lei <b>prescreve em 8 (oito) anos</b>, contados a partir da ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência.</p><p><b>§ 1º</b> A instauração de inquérito civil ou de processo administrativo para apuração dos ilícitos referidos nesta Lei suspende o curso do prazo prescricional por, no máximo, <b>180 dias corridos</b>.</p>"};
function literalFor(label, summary){
  return literalConstitution[label] || literalAdministrative[label] || `<p>${summary}</p>`;
}

    ['funções de polícia judiciária e a apuração de infrações penais, exceto as militares','exam-mark-red'],
    ['polícia ostensiva e a preservação da ordem pública','exam-mark-red'],
    ['segurança dos estabelecimentos penais','exam-mark-red'],

    // Art. 5º
    ['aplicação imediata','exam-mark-red'],
    ['equivalentes às emendas constitucionais','exam-mark-red'],
    ['asilo inviolável do indivíduo','exam-mark-red'],

    ['mandado de injunção','exam-mark-red'],
    ['habeas data','exam-mark-red'],
    ['qualquer cidadão é parte legítima para propor ação popular','exam-mark-red'],
    ['razoável duração do processo','exam-mark-red'],

    // Princípios fundamentais
    ['Todo o poder emana do povo','exam-mark-red'],
    ['erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais','exam-mark-red'],

    // Administração Pública
    ['legalidade','exam-mark'],
    ['impessoalidade','exam-mark'],
    ['moralidade','exam-mark'],
    ['publicidade','exam-mark'],
    ['eficiência','exam-mark'],
    ['até dois anos','exam-mark-red'],
    ['prorrogável uma vez, por igual período','exam-mark-red'],
    ['legalidade, impessoalidade, moralidade, publicidade e eficiência','exam-mark-red'],
    ['decai em cinco anos','exam-mark-red'],
    ['deve anular','exam-mark-red'],
    ['pode revogá-los','exam-mark-green'],
    ['somente por lei específica','exam-mark-red'],
    ['integralmente detido','exam-mark-red'],
    ['sociedade anônima','exam-mark-red'],
    ['competência é irrenunciável','exam-mark-red'],
    ['não podem ser objeto de delegação','exam-mark-red'],
    ['avocação temporária','exam-mark-red'],
    ['convalidados pela própria Administração','exam-mark-green'],
    ['São modalidades de licitação','exam-mark-red'],
    ['diálogo competitivo','exam-mark'],
    ['É inexigível a licitação quando inviável a competição','exam-mark-red'],
    ['É dispensável a licitação','exam-mark-red'],
    ['razão da escolha do contratado','exam-mark'],
    ['justificativa de preço','exam-mark-red'],
    ['a cada dia 1º de janeiro','exam-mark-red'],
    ['modificá-los, unilateralmente','exam-mark-red'],
    ['formalmente motivada nos autos do processo','exam-mark'],
    ['assegurados o contraditório e a ampla defesa','exam-mark-green'],
    ['legalidade, legitimidade, economicidade','exam-mark-red'],
    ['não excluirá da apreciação do Poder Judiciário','exam-mark-red'],
    ['responderão pelos danos que seus agentes','exam-mark-red'],
    ['aprovação prévia em concurso público','exam-mark-red'],
    ['compatibilidade de horários','exam-mark-red'],
    ['três anos de efetivo exercício','exam-mark-red'],
    ['ainda que transitoriamente ou sem remuneração','exam-mark'],
    ['condutas dolosas','exam-mark-red'],
    ['não bastando a voluntariedade do agente','exam-mark-red'],
    ['enriquecimento ilícito','exam-mark-red'],
    ['lesão ao erário','exam-mark-red'],
    ['princípios da administração pública','exam-mark-red'],
    ['até 14 anos','exam-mark'],
    ['até 12 anos','exam-mark'],
    ['24 vezes','exam-mark'],
    ['4 anos','exam-mark'],
    ['prescreve em 8 (oito) anos','exam-mark-red'],
    ['180 dias corridos','exam-mark-green']
  ];

  // Avoid matching inside HTML tags by temporarily protecting tags.
  const tags=[];
  s=s.replace(/<[^>]+>/g, m=>`@@TAG${tags.push(m)-1}@@`);
  for(const [phrase,cls] of rules){
    const escaped=phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp(escaped,'gi'), m=>`<span class="${cls}">${m}</span>`);
  }
  s=s.replace(/@@TAG(\d+)@@/g,(_,i)=>tags[Number(i)]);
  return s;
}

function lawLiteralBlock(item,idx){
  const label=item[0], summary=item[1];
  const mod=modules.find(x=>x.id===current);
  const isAdm=mod && mod.discipline==='Direito Administrativo';
  const level=idx<2?'MUITO COBRADO':'IMPORTANTE';
  const cls=idx<2?'tag-important':'tag-very';
  const literal=literalFor(label, summary);
  return `<details class="law-details">
    <summary>
      <div class="law-summary-text">
        <b><span class="${cls}">${level}</span> ${label}</b>
        <div style="margin-top:7px;line-height:1.55">${summary}</div>
      </div>
      <span class="expand-hint">▾ ABRIR TEXTO LEGAL</span>
    </summary>
    <div class="constitution-sheet">
      <div class="constitution-head">
        <div class="republic">${isAdm?"LEGISLAÇÃO ADMINISTRATIVA — TEXTO LITERAL":"Constituição da República Federativa do Brasil de 1988"}</div>
        <div class="title">${label}</div>
      </div>
      <div class="exam-legend">
        <span><i class="exam-dot red"></i><b>MUITO COBRADO</b></span>
        <span><i class="exam-dot yellow"></i><b>IMPORTANTE</b></span>
        <span><i class="exam-dot green"></i><b>EXCEÇÃO / CONDIÇÃO</b></span>
      </div>
      <div class="constitution-text">${highlightLiteral(literal)}</div>
      <div class="constitution-source">${isAdm?"Redação literal incorporada ao NEXO a partir da legislação indicada no módulo. Itens identificados como 'trechos' exibem apenas os dispositivos de maior incidência, sem paráfrase.":"Texto constitucional incorporado ao NEXO para leitura de revisão."}</div>
    </div>
  </details>`;
}


function officialQuestionHTML(q,i,prefix){
  const key=`official_${prefix}_${i}`;
  return `<div class="card q" id="card_${key}">
    <div class="small muted"><b>${q.num || ('Q'+(i+1))}</b> • ${q.source || 'Instituto AOCP'}</div>
    <div class="official-source">Caderno: ${q.collection || 'material oficial enviado'}</div>
    <p><b>${q.text}</b></p>
    ${q.options.map((o,j)=>`<label class="opt" id="opt_${key}_${j}">
      <input type="radio" name="${key}" value="${'ABCDE'[j]}">
      <span><b>${'ABCDE'[j]})</b> ${o}</span>
    </label>`).join('')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button onclick="checkOfficialQuestion('${prefix}',${i})">Responder</button>
      <button type="button" onclick="clearOfficialQuestion('${prefix}',${i})" style="background:#17202a;border-color:#344250;color:#cbd7e1">Limpar</button>
    </div>
    <div class="answer" id="ans_${key}" role="status" aria-live="polite"></div>
  </div>`;
}

function checkOfficialQuestion(prefix,i){
  const m=modules.find(x=>x.id===prefix);
  if(!m || !m.official_questions || !m.official_questions[i]) return;
  const q=m.official_questions[i];
  const key=`official_${prefix}_${i}`;
  const sel=document.querySelector(`input[name="${key}"]:checked`);
  if(!sel){ showQuestionError(key); return; }
  const card=document.getElementById('card_'+key);
  const box=document.getElementById('ans_'+key);
  if(!card || !box || card.dataset.done==='1') return;
  card.dataset.done='1';
  finishQuestion(card);
  solved++;
  const ok=sel.value===q.answer;
  if(ok) correct++;
  q.options.forEach((_,j)=>{
    const letter='ABCDE'[j];
    const opt=document.getElementById(`opt_${key}_${j}`);
    if(!opt) return;
    opt.style.borderWidth='2px';
    if(letter===q.answer){ opt.style.borderColor='#75a37a'; opt.style.background='#edf5ed'; }
    else if(letter===sel.value){ opt.style.borderColor='#c48585'; opt.style.background='#fbefed'; }
    else opt.style.opacity='.72';
  });
  box.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:7px;color:${ok?'#43794c':'#a15050'}">${ok?'Resposta correta':'Resposta incorreta'}</div>
    <div><b>Gabarito: ${q.answer}</b></div>
    <div style="margin-top:8px;line-height:1.55"><b>Comentário do caderno:</b> ${q.comment || ''}</div>`;
  box.style.display='block';
  document.getElementById('score').textContent=`${correct} acertos / ${solved}`;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function clearOfficialQuestion(prefix,i){
  const key=`official_${prefix}_${i}`;
  const card=document.getElementById('card_'+key);
  if(card && card.dataset.done==='1') return;
  document.querySelectorAll(`input[name="${key}"]`).forEach(el=>el.checked=false);
}

function checkQuestion(prefix,i){
  try{
    const m = modules.find(x=>x.id===prefix);
    if(!m || !m.questions || !m.questions[i]){
      alert('Não foi possível localizar esta questão.');
      return;
    }
    const q = m.questions[i];
    const key = `${prefix}_${i}`;
    const sel = document.querySelector(`input[name="${key}"]:checked`);
    if(!sel){
      showQuestionError(key);
      return;
    }

    const box = document.getElementById('ans_'+key);
    const card = document.getElementById('card_'+key);
    if(!box || !card){
      alert('Erro ao carregar a correção visual. Reabra a questão.');
      return;
    }
    if(card.dataset.done==='1') return;

    card.dataset.done='1';
    finishQuestion(card);
    solved++;
    const ok = sel.value === q.answer;
    if(ok) correct++;

    // Visual feedback on every alternative.
    q.options.forEach((_,j)=>{
      const letter='ABCDE'[j];
      const opt=document.getElementById(`opt_${key}_${j}`);
      if(!opt) return;
      opt.style.borderWidth='2px';
      if(letter===q.answer){
        opt.style.borderColor='#75a37a';
        opt.style.background='#edf5ed';
      } else if(letter===sel.value){
        opt.style.borderColor='#c48585';
        opt.style.background='#fbefed';
      } else {
        opt.style.opacity='.72';
      }
    });

    box.innerHTML = `
      <div style="font-size:16px;font-weight:700;margin-bottom:7px;color:${ok?'#43794c':'#a15050'}">
        ${ok?'Resposta correta':'Resposta incorreta'}
      </div>
      <div><b>Gabarito: ${q.answer}</b></div>
      <div style="margin-top:8px;line-height:1.55"><b>Comentário:</b> ${q.comment || 'Revise o ponto indicado no resumo e na lei seca deste módulo.'}</div>
    `;
    box.style.display='block';
    document.getElementById('score').textContent=`${correct} acertos / ${solved}`;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(err){
    const fallback=document.getElementById('view');
    if(fallback){
      const msg=document.createElement('div');
      msg.className='warn';
      msg.style.marginTop='12px';
      msg.textContent='Ocorreu um erro ao exibir a correção. Recarregue esta versão do NEXO e tente novamente.';
      fallback.prepend(msg);
    }
  }
}

function clearQuestion(prefix,i){
  const key=`${prefix}_${i}`;
  const card=document.getElementById('card_'+key);
  if(card && card.dataset.done==='1') return;
  document.querySelectorAll(`input[name="${key}"]`).forEach(el=>el.checked=false);
}
renderNav(); home();
</script>
<script>
let activeResource = 'resumo';
let libraryPriority = 'all';
let libraryLayout = 'list';
let readingSize = 15;
let messageTimer;

const resourceOptions = {
  resumo: { label: 'Módulos de estudo', short: 'Resumos', action: 'Estudar assunto', icon: 'book', description: 'Escolha um assunto. Encontre resumo, lei seca e prática no mesmo lugar.' },
  quest: { label: 'Praticar questões', short: 'Questões', action: 'Resolver questões', icon: 'check', description: 'Treine por assunto, confira o gabarito e entenda cada resposta.' },
  lei: { label: 'Lei seca, sem distrações', short: 'Lei seca', action: 'Ler os artigos', icon: 'shield', description: 'Consulte os dispositivos constitucionais organizados por assunto.' },
  mapa: { label: 'Conecte os conceitos', short: 'Mapas mentais', action: 'Abrir mapa', icon: 'map', description: 'Enxergue os pontos-chave de cada assunto e suas conexões.' },
  juris: { label: 'Jurisprudência por assunto', short: 'Jurisprudência', action: 'Revisar decisões', icon: 'shield', description: 'Revise decisões e súmulas disponíveis no seu material de estudo.' }
};

function workspaceIcon(name) {
  if (name === 'search') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>';
  if (name === 'focus') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></svg>';
  return icon(name);
}

function normalizeSearch(value) {
  return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function countQuestions(module) {
  return (module.questions || []).length + (module.official_questions || []).length;
}

function resourceModules() {
  return sortedModules().filter(module => {
    if (activeResource === 'quest') return countQuestions(module) > 0;
    if (activeResource === 'juris') return module.juris.length > 0;
    return true;
  });
}

function syncAccess() {
  const studying = modules.some(module => module.id === current);
  let area = current === null ? 'home' : current === 'sources' ? 'sources' : current === 'ranking' ? 'ranking' : 'library';
  if (current === 'library' || studying) area = { quest: 'questions', oficiais: 'questions', lei: 'law', mapa: 'maps' }[activeResource] || 'library';
  document.querySelectorAll('.access-bar [data-area]').forEach(button => {
    const selected = button.dataset.area === area;
    button.classList.toggle('selected', selected);
    if (selected) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  document.querySelectorAll('.primary-nav').forEach(button => {
    const action = button.getAttribute('onclick');
    if (action === 'openLibrary()') button.classList.toggle('active', current === 'library' && activeResource !== 'quest');
    if (action === "openLibrary('quest')") button.classList.toggle('active', current === 'library' && activeResource === 'quest');
    if (button.classList.contains('active')) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  if (!studying) document.body.classList.remove('study-focus');
  document.getElementById('view').classList.toggle('study-view', studying);
  const focusButton = document.getElementById('focus-toggle');
  if (focusButton) {
    const focused = document.body.classList.contains('study-focus');
    focusButton.setAttribute('aria-pressed', String(focused));
    focusButton.innerHTML = `${workspaceIcon('focus')}<span>${focused ? 'Sair do foco' : 'Modo foco'}</span>`;
  }
}

function openLibrary(resource = 'resumo') {
  activeResource = resourceOptions[resource] ? resource : 'resumo';
  libraryPriority = 'all';
  current = 'library';
  closeMobileNav();
  renderNav();
  const settings = resourceOptions[activeResource];
  document.getElementById('head').textContent = `Biblioteca / ${settings.short}`;
  const available = resourceModules();
  document.getElementById('view').innerHTML = `
    <div class="library-heading"><div><span class="eyebrow">CONSTITUCIONAL + ADMINISTRATIVO · AOCP</span><h1>${settings.label}<span>.</span></h1><p>${settings.description}</p></div><span class="library-count">${available.length} assuntos disponíveis</span></div>
    <div class="resource-switcher" aria-label="Tipo de material">${Object.entries(resourceOptions).map(([key, option]) => `<button type="button" class="${key === activeResource ? 'selected' : ''}" aria-pressed="${key === activeResource}" onclick="openLibrary('${key}')">${workspaceIcon(option.icon)}${option.short}</button>`).join('')}</div>
    <section class="library-panel" aria-label="Biblioteca de assuntos">
      <div class="library-controls"><label class="library-search">${workspaceIcon('search')}<input id="library-search" type="search" placeholder="Buscar por assunto ou palavra-chave" aria-label="Buscar na biblioteca" oninput="renderLibraryResults()"/></label><div class="layout-controls" aria-label="Visualização"><button type="button" id="layout-list" onclick="setLibraryLayout('list')" aria-label="Visualização em lista" aria-pressed="${libraryLayout === 'list'}"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg></button><button type="button" id="layout-grid" onclick="setLibraryLayout('grid')" aria-label="Visualização em cartões" aria-pressed="${libraryLayout === 'grid'}"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div></div>
      <div class="priority-filters" aria-label="Filtrar por prioridade">${[['all', 'Todos'], ['MUITO ALTA', 'Muito alta'], ['ALTA', 'Alta'], ['MÉDIA', 'Média'], ['COMPLEMENTAR', 'Complementar']].map(([key, label]) => `<button type="button" data-priority="${key}" aria-pressed="${key === 'all'}" onclick="setLibraryPriority('${key}')">${label}</button>`).join('')}</div>
      <div class="library-result-heading"><span id="library-result-count" role="status" aria-live="polite"></span><span>ORDEM DE PRIORIDADE</span></div>
      <div id="library-results"></div>
    </section>
    ${activeResource === 'quest' ? `<div class="practice-prompt"><span class="practice-symbol">${icon('check')}</span><div><b>Quer sair do automático?</b><p>Abra uma questão aleatória do seu material e teste o que você lembra.</p></div><button type="button" class="cta" onclick="practiceRandom()">Questão surpresa ${icon('arrow')}</button></div>` : '<p class="library-footnote">Cada assunto reúne os materiais disponíveis. A prioridade orienta a revisão; não representa uma previsão de prova.</p>'}`;
  renderLibraryResults();
  document.getElementById('view').scrollTop = 0;
  if (window.innerWidth <= 700) window.scrollTo({ top: 0, behavior: 'instant' });
}

function setLibraryPriority(priority) {
  libraryPriority = priority;
  document.querySelectorAll('[data-priority]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.priority === priority)));
  renderLibraryResults();
}

function setLibraryLayout(layout) {
  libraryLayout = layout;
  document.getElementById('layout-list').setAttribute('aria-pressed', String(layout === 'list'));
  document.getElementById('layout-grid').setAttribute('aria-pressed', String(layout === 'grid'));
  document.getElementById('library-results').classList.toggle('card-layout', layout === 'grid');
}

function renderLibraryResults() {
  const query = normalizeSearch(document.getElementById('library-search').value);
  const available = resourceModules();
  const filtered = available.filter(module => (libraryPriority === 'all' || module.priority === libraryPriority) && normalizeSearch(`${module.title} ${module.focus}`).includes(query));
  document.getElementById('library-result-count').textContent = `${filtered.length} de ${available.length} assuntos`;
  const settings = resourceOptions[activeResource];
  document.getElementById('library-results').innerHTML = filtered.length ? filtered.map(module => {
    const questionTotal = countQuestions(module);
    const detail = activeResource === 'quest' ? `${questionTotal} ${questionTotal === 1 ? 'questão' : 'questões'} para praticar` : activeResource === 'lei' ? `${module.law_items.length} blocos de leitura` : activeResource === 'juris' ? `${module.juris.length} referências para revisar` : 'Resumo · Lei seca · Mapa mental';
    return `<button type="button" class="library-module" onclick="openResourceModule('${module.id}')"><span class="library-module-symbol">${icon(settings.icon)}</span><span class="library-module-copy"><span class="library-module-title">${esc(module.title)}</span><span class="library-module-description">${esc(module.focus)}</span><span class="library-module-meta">${detail}</span></span><span class="library-module-action">${priorityBadge(module.priority)}<span>${settings.action} ${icon('arrow')}</span></span></button>`;
  }).join('') : `<div class="library-empty">${workspaceIcon('search')}<h2>Nenhum assunto por aqui.</h2><p>Tente uma palavra diferente ou remova o filtro de prioridade.</p><button type="button" class="cta" onclick="resetLibraryFilters()">Limpar filtros</button></div>`;
  setLibraryLayout(libraryLayout);
}

function resetLibraryFilters() {
  document.getElementById('library-search').value = '';
  setLibraryPriority('all');
  document.getElementById('library-search').focus();
}

function openResourceModule(id) {
  const module = modules.find(item => item.id === id);
  const resource = activeResource === 'quest' && !module.questions.length ? 'oficiais' : activeResource;
  openModule(id, resource);
  if (window.innerWidth <= 700) window.scrollTo({ top: 0, behavior: 'instant' });
}

function practiceRandom() {
  const pool = modules.flatMap(module => [
    ...(module.questions || []).map((question, index) => ({ module, index, tab: 'quest', key: `${module.id}_${index}` })),
    ...(module.official_questions || []).map((question, index) => ({ module, index, tab: 'oficiais', key: `official_${module.id}_${index}` }))
  ]);
  if (!pool.length) return;
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  openModule(chosen.module.id, chosen.tab);
  document.getElementById(`card_${chosen.key}`).scrollIntoView({ block: 'start', behavior: 'instant' });
  announce('Uma questão do seu material está pronta para você.');
}

function readerToolbar(module) {
  const ordered = sortedModules();
  const index = ordered.findIndex(item => item.id === module.id);
  return `<div class="reader-toolbar"><button type="button" class="reader-back" onclick="openLibrary(resourceOptions[activeResource]?activeResource:'resumo')">${icon('arrow')}<span>Biblioteca</span></button><span class="reader-position">${String(index + 1).padStart(2, '0')} <span>/ ${ordered.length} assuntos</span></span><div class="reader-actions"><div class="reading-size"><button type="button" aria-label="Diminuir tamanho do texto" onclick="changeReadingSize(-1)" ${readingSize <= 14 ? 'disabled' : ''}>A−</button><button type="button" aria-label="Aumentar tamanho do texto" onclick="changeReadingSize(1)" ${readingSize >= 20 ? 'disabled' : ''}>A+</button></div><button type="button" id="focus-toggle" class="focus-toggle" aria-pressed="${document.body.classList.contains('study-focus')}" onclick="toggleStudyFocus()">${workspaceIcon('focus')}<span>Modo foco</span></button><div class="reader-navigation"><button type="button" class="icon-button previous-module" aria-label="Assunto anterior" onclick="navigateModule(-1)" ${index === 0 ? 'disabled' : ''}>${icon('arrow')}</button><button type="button" class="icon-button" aria-label="Próximo assunto" onclick="navigateModule(1)" ${index === ordered.length - 1 ? 'disabled' : ''}>${icon('arrow')}</button></div></div></div>`;
}

function navigateModule(direction) {
  const ordered = sortedModules();
  const index = ordered.findIndex(module => module.id === current);
  const next = ordered[index + direction];
  if (next) openModule(next.id, activeResource);
  if (window.innerWidth <= 700) window.scrollTo({ top: 0, behavior: 'instant' });
}

function changeReadingSize(amount) {
  readingSize = Math.max(14, Math.min(20, readingSize + amount));
  document.documentElement.style.setProperty('--reading-size', `${readingSize}px`);
  document.querySelector('[aria-label="Diminuir tamanho do texto"]').disabled = readingSize <= 14;
  document.querySelector('[aria-label="Aumentar tamanho do texto"]').disabled = readingSize >= 20;
  announce(`Tamanho de leitura: ${readingSize} pixels.`);
}

function toggleStudyFocus() {
  document.body.classList.toggle('study-focus');
  syncAccess();
  announce(document.body.classList.contains('study-focus') ? 'Modo foco ativado. A navegação está recolhida.' : 'Modo foco desativado.');
}

function announce(message) {
  const element = document.getElementById('workspace-message');
  element.textContent = message;
  element.classList.add('visible');
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => element.classList.remove('visible'), 3000);
}

function openCommand() {
  closeMobileNav();
  const dialog = document.getElementById('command-dialog');
  document.getElementById('command-input').value = '';
  renderCommand();
  if (!dialog.open) dialog.showModal();
  document.getElementById('command-input').focus();
}

function showQuestionError(key) {
  const card = document.getElementById(`card_${key}`);
  let error = card.querySelector('.question-validation');
  if (!error) {
    error = document.createElement('p');
    error.className = 'question-validation';
    error.setAttribute('role', 'alert');
    card.querySelector('.answer').before(error);
  }
  error.textContent = 'Selecione uma alternativa para conferir sua resposta.';
  card.querySelector('input').focus({ preventScroll: true });
}

function finishQuestion(card) {
  card.querySelector('.question-validation')?.remove();
  card.querySelectorAll('input,button').forEach(control => { control.disabled = true; });
  card.querySelector('button').textContent = 'Respondida';
}

function closeCommand() {
  document.getElementById('command-dialog').close();
}

function renderCommand() {
  const query = normalizeSearch(document.getElementById('command-input').value);
  const actions = [
    { id: 'home', label: 'Painel de estudos', icon: 'home', hint: 'Visão geral' },
    ...Object.entries(resourceOptions).map(([id, settings]) => ({ id, label: settings.short, icon: settings.icon, hint: 'Explorar biblioteca' })),
    { id: 'sources', label: 'Fontes oficiais', icon: 'shield', hint: 'Conferir referências' },
    { id: 'ranking', label: 'Prioridades de estudo', icon: 'chart', hint: 'Ordem sugerida' }
  ].filter(action => normalizeSearch(action.label).includes(query));
  const found = sortedModules().filter(module => normalizeSearch(`${module.title} ${module.focus}`).includes(query));
  const actionResults = actions.map(action => `<button type="button" class="command-result" onclick="commandNavigate('action','${action.id}')">${workspaceIcon(action.icon)}<span><b>${action.label}</b><small>${action.hint}</small></span>${icon('arrow')}</button>`).join('');
  const moduleResults = found.map(module => `<button type="button" class="command-result" onclick="commandNavigate('module','${module.id}')">${icon('book')}<span><b>${esc(module.title)}</b><small>Direito Constitucional · ${countQuestions(module)} questões</small></span>${icon('arrow')}</button>`).join('');
  document.getElementById('command-results').innerHTML = `${actions.length ? `<div class="command-group">ACESSO RÁPIDO</div>${actionResults}` : ''}${found.length ? `<div class="command-group">ASSUNTOS · ${found.length}</div>${moduleResults}` : ''}${!actions.length && !found.length ? '<div class="command-empty"><b>Nenhum resultado encontrado.</b><p>Tente o nome de um assunto, artigo ou recurso.</p></div>' : ''}`;
}

function commandNavigate(type, id) {
  closeCommand();
  if (type === 'module') openModule(id);
  else if (id === 'home') home();
  else if (id === 'sources') officialBank();
  else if (id === 'ranking') incidence();
  else openLibrary(id);
  document.getElementById('view').focus({ preventScroll: true });
  document.getElementById('view').scrollTop = 0;
  if (window.innerWidth <= 700) window.scrollTo({ top: 0, behavior: 'instant' });
}

document.getElementById('command-dialog').addEventListener('click', event => {
  if (event.target !== event.currentTarget) return;
  const bounds = event.currentTarget.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) closeCommand();
});

document.getElementById('command-dialog').addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    event.preventDefault();
    event.stopPropagation();
    closeCommand();
    return;
  }
  const results = [...document.querySelectorAll('.command-result')];
  const index = results.indexOf(document.activeElement);
  if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && results.length) {
    event.preventDefault();
    const next = event.key === 'ArrowDown' ? (index + 1) % results.length : (index <= 0 ? results.length : index) - 1;
    results[next].focus();
  }
  if (event.key === 'Enter' && event.target.id === 'command-input' && results.length) {
    event.preventDefault();
    results[0].click();
  }
});

document.getElementById('view').addEventListener('change', event => {
  if (event.target.matches('.q input')) event.target.closest('.q').querySelector('.question-validation')?.remove();
});

document.addEventListener('keydown', event => {
  const editable = event.target.matches('input,textarea,select,[contenteditable="true"]');
  if (((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') || (event.key === '/' && !editable)) {
    event.preventDefault();
    openCommand();
  }
  if (event.key === 'Escape' && document.body.classList.contains('study-focus') && !document.getElementById('command-dialog').open) {
    document.body.classList.remove('study-focus');
    syncAccess();
  }
});

document.querySelectorAll('[data-icon]').forEach(element => { element.innerHTML = workspaceIcon(element.dataset.icon); });
syncAccess();

</script>
