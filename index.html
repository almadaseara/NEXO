}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
aside{width:332px;background:#0f161f;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:18px 20px;font-size:21px;font-weight:900;border-bottom:1px solid var(--line)} .brand b{color:var(--green)}
.search{padding:12px} .search input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1117;color:#fff}
.nav{overflow:auto;padding:8px 10px 20px} .sec{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:14px 10px 7px;letter-spacing:.7px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd7e1;padding:10px 12px;border-radius:8px;cursor:pointer;margin:2px 0}
.nav button:hover,.nav button.active{background:var(--panel2);color:#fff} .nav button.active{box-shadow:inset 3px 0 var(--green)}
.folder-wrap{margin:4px 0 8px} .folder-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:#121c26!important;border:1px solid var(--line)!important;color:#fff!important;font-weight:800!important;padding:11px 12px!important;border-radius:9px!important;cursor:pointer}
.folder-btn .arrow{transition:.25s;color:var(--green)} .folder-wrap.open .folder-btn .arrow{transform:rotate(90deg)}
.folder-list{display:none;padding-left:10px;margin-top:4px;border-left:1px solid var(--line)} .folder-wrap.open .folder-list{display:block}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#101720}
.pills{display:flex;gap:8px;flex-wrap:wrap} .pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12px}
#view{padding:24px;overflow:auto;flex:1}
.hero{background:linear-gradient(135deg,#112132,#12231a);border:1px solid var(--line);padding:24px;border-radius:16px;margin-bottom:18px}
.hero h1{margin:8px 0 10px;font-size:27px} .muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.tabs button.sel{border-color:var(--green);color:var(--green)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.4px}
.b-green{background:#163428;color:#6ff0b2} .b-blue{background:#16314a;color:#8dccff} .b-gold{background:#3d3116;color:#ffd77c}
.summary p{line-height:1.7;margin:0 0 12px} mark{background:#f5ff5d;color:#111;padding:0 3px;border-radius:4px} u{text-underline-offset:2px}
.peg{padding:12px 14px;background:#171f29;border-left:4px solid var(--orange);border-radius:10px;margin-top:14px}
.peg ul, .summary ul, .juris ul {margin:8px 0 0 18px} li{line-height:1.5;margin:7px 0}
.law-item{padding:13px 14px;background:#111b1a;border:1px solid #153428;border-left:4px solid var(--green);border-radius:10px;margin:10px 0}
.law-item b{display:block;margin-bottom:6px}
.tag-important{display:inline-block;background:#4b171f;color:#ffb3bc;border:1px solid #7f2d39;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;margin-right:8px}
.tag-very{display:inline-block;background:#17311e;color:#83f0b8;border:1px solid #2d6d45;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;margin-right:8px}
.q{margin-bottom:14px} .opt{display:block;background:#101720;border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0;cursor:pointer}
.q button, .cta{background:#143c2a;color:#dfffee;border:1px solid #1f6542;padding:9px 14px;border-radius:8px;cursor:pointer}
.answer{display:none;margin-top:8px;padding:10px;border-radius:8px;background:#10241d;border-left:4px solid var(--green)}
.warn{padding:14px;border-radius:10px;background:#2b2412;border:1px solid #5f4c18;color:#ffdc8c}
.priority-badge{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.4px;padding:4px 8px;border-radius:999px;vertical-align:middle}
.p-muito{background:#412027;color:#ff9ca7;border:1px solid #71323d} .p-alta{background:#3d3116;color:#ffd77c;border:1px solid #6b5520} .p-media{background:#16314a;color:#8dccff;border:1px solid #24567f} .p-comp{background:#252d34;color:#b8c5d0;border:1px solid #3c4853}
.source-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.source-card a{color:#9ad8ff;text-decoration:none} .source-card a:hover{text-decoration:underline}
.mapimg{background:#fff;border-radius:16px;padding:10px;overflow:auto;border:1px solid var(--line)}
.small{font-size:12px} .footer-note{margin-top:16px;font-size:12px;color:var(--muted)}
.minddyn{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px;border-radius:14px;background:#10161e;border:1px solid var(--line);overflow:hidden}
.node{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;animation:float 3.5s ease-in-out infinite} .node:nth-child(2n){animation-delay:.5s}
.center{grid-column:2;background:#13251f;border:2px solid var(--green);box-shadow:0 0 28px #25d18a22}
@keyframes float{50%{transform:translateY(-5px)}}
@media(max-width:900px){aside{width:255px} .minddyn{grid-template-columns:1fr} .center{grid-column:auto}}
@media(max-width:650px){body{display:block;overflow:auto} aside{width:100%;height:auto;max-height:42vh} header{position:sticky;top:0;z-index:5} #view{overflow:visible}}

.juris-card{background:#111821;border:1px solid #2b3947;border-radius:13px;padding:16px;margin:12px 0}
.juris-card h4{margin:0 0 10px;color:#8dccff;font-size:16px}
.juris-card div{line-height:1.62}
.juris-card mark{background:#ffe45c;color:#101010;padding:1px 4px;border-radius:4px}
.stf-link{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:7px;background:#132b3d;border:1px solid #255578;color:#a7ddff!important;text-decoration:none!important;font-size:12px;font-weight:700}
.stf-link:hover{background:#17364d}
.juris-alert{padding:12px 14px;background:#181b27;border-left:4px solid #8d72ff;border-radius:9px;margin-bottom:12px}


.q .opt{transition:.18s ease}
.q .opt:hover{border-color:#4d6275}
.answer{line-height:1.5}

.law-details summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}

.law-details summary:hover{background:#13211d}
.law-details .law-summary-text{flex:1}

.law-details[open] .expand-hint{display:none}
.constitution-sheet{background:#f7f4ed;color:#171717;border-top:1px solid #284c3b;padding:18px}
.constitution-head{font-family:Georgia,'Times New Roman',serif;text-align:center;border-bottom:1px solid #bbb;padding-bottom:10px;margin-bottom:12px}
.constitution-head .republic{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#555}
.constitution-head .title{font-size:20px;font-weight:700;margin-top:4px}

.exam-mark{background:#fff36d;color:#111;padding:1px 3px;border-radius:3px;font-weight:700}
.exam-mark-red{background:#ffb3b8;color:#6b1018;padding:1px 3px;border-radius:3px;font-weight:800}
.exam-mark-green{background:#bdf3d0;color:#0e4a27;padding:1px 3px;border-radius:3px;font-weight:700}
.exam-legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;background:#f0ece2;border:1px solid #c9c2b4;border-radius:8px;font-family:Arial,sans-serif;font-size:12px;color:#333}
.exam-legend span{display:inline-flex;align-items:center;gap:5px}
.exam-dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.exam-dot.yellow{background:#fff36d;border:1px solid #d8c900}
.exam-dot.red{background:#ffb3b8;border:1px solid #d06a73}
.exam-dot.green{background:#bdf3d0;border:1px solid #6ac48a}

.official-banner b{color:#7af0b6}
.official-source{font-size:11px;color:#8dccff;margin:4px 0 10px}


.mobile-menu-btn{display:none;background:#15212d;border:1px solid var(--line);color:#fff;border-radius:9px;padding:8px 11px;font-size:19px;cursor:pointer}
.mobile-backdrop{display:none}

  }
  .opt input{margin-top:3px;flex:0 0 auto}

  .law-details summary{padding:12px;gap:8px;display:block}

  .constitution-sheet{padding:13px}
  .constitution-head .title{font-size:17px}
  .constitution-text{font-size:14px;line-height:1.65}

  .exam-legend{font-size:11px;padding:8px;gap:6px}

  .juris-card{padding:13px;margin:10px 0}

  .source-card{padding:12px}
  .official-banner{padding:11px}
  .official-source{overflow-wrap:anywhere}

  .minddyn{grid-template-columns:1fr;padding:12px;gap:10px}
  .node{padding:12px;animation:none}
  .center{grid-column:auto}

  img,svg,video,canvas{max-width:100%;height:auto}
  pre,code{max-width:100%;overflow-x:auto}
  a{overflow-wrap:anywhere}
}

@media(max-width:380px){

const modules = [{"id":"teoria_direitos","title":"Teoria Geral dos Direitos Fundamentais","priority":"COMPLEMENTAR","focus":"Base conceitual: dimensões, características, eficácia, aplicação imediata e tratados de direitos humanos.","summary":["Os direitos fundamentais são o <mark>núcleo axiológico da Constituição</mark>. Em provas da AOCP, a cobrança normalmente recai sobre <u>gerações/dimensões</u>, eficácia e aplicabilidade.","É indispensável diferenciar: <mark>1ª dimensão = liberdade</mark>; <mark>2ª dimensão = igualdade</mark>; <mark>3ª dimensão = fraternidade/solidariedade</mark>. A banca costuma transformar esse ponto em item direto.","Outro foco recorrente é a distinção entre <u>eficácia vertical</u> (relação Estado × indivíduo) e <u>eficácia horizontal</u> (relação entre particulares), além da regra do <mark>art. 5º, §1º</mark>, que prevê aplicação imediata das normas definidoras de direitos e garantias fundamentais."],"highlights":["Dimensão subjetiva e objetiva dos direitos fundamentais.","1ª dimensão: liberdade; 2ª: igualdade; 3ª: fraternidade/solidariedade.","Aplicação imediata das normas de direitos fundamentais.","Eficácia vertical e horizontal.","Núcleo essencial e proporcionalidade.","Tratados de direitos humanos: status supralegal ou equivalente a emenda constitucional."],"pegadinhas":["Direitos fundamentais não se esgotam no Título II; existem também direitos fundamentais fora do catálogo.","Aplicação imediata não significa eficácia absoluta em qualquer situação concreta.","Estrangeiros também podem ser titulares de direitos fundamentais."],"law_items":[["Art. 5º, §1º","As normas definidoras dos direitos e garantias fundamentais têm <mark>aplicação imediata</mark>."],["Art. 5º, §2º","Os direitos e garantias expressos na Constituição <u>não excluem</u> outros decorrentes do regime e dos princípios por ela adotados."],["Art. 5º, §3º","Tratados e convenções internacionais de direitos humanos aprovados com rito qualificado equivalem a <mark>emendas constitucionais</mark>."],["Art. 5º, §4º","O Brasil se submete à jurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão."]],"juris":[["RE 466.343 / Tema 60 + Súmula Vinculante 25 — tratados de direitos humanos","<b>Decisão/tese para prova:</b> o STF assentou que é ilícita a prisão civil do depositário infiel, qualquer que seja a modalidade de depósito. O julgamento é central para compreender que tratados de direitos humanos incorporados pelo rito ordinário ocupam posição <mark>supralegal</mark>, acima da legislação comum e abaixo da Constituição.<br><br><b>Como a banca pode cobrar:</b> tratado de direitos humanos aprovado sem o rito do art. 5º, §3º, não equivale automaticamente a emenda constitucional.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?classeProcesso=RE&incidente=2343529&numeroProcesso=466343&numeroTema=60\" target=\"_blank\">Abrir Tema 60 no STF ↗</a>"],["ADI 4.277 / ADPF 132 — igualdade, dignidade e autonomia privada","<b>Decisão para revisão:</b> o STF reconheceu às uniões entre pessoas do mesmo sexo o mesmo regime jurídico das uniões estáveis heteroafetivas, com fundamento em igualdade, dignidade, liberdade e proteção contra discriminação.<br><br><b>Ponto de prova:</b> direitos fundamentais funcionam também como vetores interpretativos de todo o ordenamento jurídico.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/peticaoinicial/verPeticaoInicial.asp?base=ADI&numProcesso=4277\" target=\"_blank\">Abrir ADI 4.277 no STF ↗</a>"]],"questions":[],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"art5_parte1","title":"Direitos e Garantias Fundamentais — Parte I (Art. 5º, I a XXXI)","priority":"MUITO ALTA","focus":"Igualdade, legalidade, liberdade, crença, intimidade, domicílio, sigilo, reunião, associação e propriedade.","summary":["O <mark>art. 5º</mark> é um dos dispositivos mais cobrados pela AOCP. O caput consagra os cinco grandes núcleos: <u>vida, liberdade, igualdade, segurança e propriedade</u>.","Na parte inicial, a banca costuma cobrar a <mark>literalidade dos incisos</mark>, sobretudo reunião, associação, domicílio, sigilo e liberdade de manifestação do pensamento.","É fundamental comparar: <u>reunião</u> (sem armas, local aberto ao público, sem autorização, com prévio aviso) e <u>associação</u> (fins lícitos, vedado caráter paramilitar, dissolução compulsória apenas por decisão judicial)."],"highlights":["Caput do art. 5º: vida, liberdade, igualdade, segurança e propriedade.","Legalidade: ninguém será obrigado a fazer ou deixar de fazer algo senão em virtude de lei.","Liberdade de manifestação do pensamento: vedado o anonimato.","Inviolabilidade do domicílio e suas exceções.","Direito de reunião: sem armas, independentemente de autorização, com prévio aviso.","Função social da propriedade."],"pegadinhas":["Reunião não depende de autorização, mas exige <mark>prévio aviso</mark> à autoridade competente.","Associações podem ter atividades suspensas por decisão judicial; a dissolução compulsória exige trânsito em julgado.","A casa é asilo inviolável, mas admite exceções constitucionais expressas."],"law_items":[["Art. 5º, caput","Todos são iguais perante a lei, garantindo-se a inviolabilidade do direito à <mark>vida</mark>, à <mark>liberdade</mark>, à <mark>igualdade</mark>, à <mark>segurança</mark> e à <mark>propriedade</mark>."],["Incisos II a X","Bloco muito cobrado: <u>legalidade</u>, vedação à tortura, manifestação do pensamento, direito de resposta, liberdade de consciência e de crença, objeção de consciência e proteção à honra e imagem."],["Incisos XI e XII","Protegem a <mark>inviolabilidade do domicílio</mark> e o <mark>sigilo das comunicações</mark>, com exceções constitucionais taxativas."],["Incisos XVI a XXI","Regime constitucional de <u>reunião</u> e <u>associação</u>, com regras próprias."],["Incisos XXII a XXXI","Direito de propriedade, função social, desapropriação, requisição administrativa, pequena propriedade rural, direitos autorais, propriedade industrial, herança e sucessão."]],"juris":[["RE 603.616 / Tema 280 — entrada em domicílio sem mandado","<b>Tese fixada pelo STF:</b> o ingresso forçado em domicílio sem mandado somente é legítimo quando existirem <mark>fundadas razões</mark>, justificadas posteriormente, que indiquem situação de flagrante delito. A ausência dessa justificativa pode gerar responsabilidade e nulidade dos atos praticados.<br><br><b>AOCP:</b> memorize a expressão <u>fundadas razões + justificativa a posteriori + flagrante</u>.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?classeProcesso=RE&incidente=3774503&numeroProcesso=603616&numeroTema=280\" target=\"_blank\">Abrir Tema 280 no STF ↗</a>"],["ADPF 130 — liberdade de imprensa e vedação à censura prévia","<b>Decisão para revisão:</b> o STF afastou a recepção da antiga Lei de Imprensa pela Constituição de 1988 e reforçou a posição preferencial da liberdade de informação jornalística, sem excluir responsabilização posterior por abusos.<br><br><b>Pegadinha:</b> liberdade de expressão não significa imunidade civil ou penal absoluta.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/peticaoInicial/verPeticaoInicial.asp?base=ADPF&numProcesso=130\" target=\"_blank\">Abrir ADPF 130 no STF ↗</a>"],["ADI 4.277 — igualdade e não discriminação","<b>Decisão para revisão:</b> o STF utilizou igualdade, dignidade da pessoa humana, intimidade e liberdade como fundamentos constitucionais para afastar tratamento discriminatório nas relações familiares entre pessoas do mesmo sexo.<br><br><b>Ponto de prova:</b> o princípio da igualdade também possui dimensão material, impedindo diferenciações arbitrárias.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/peticaoinicial/verPeticaoInicial.asp?base=ADI&numProcesso=4277\" target=\"_blank\">Abrir ADI 4.277 no STF ↗</a>"]],"questions":[{"num":"Q21","source":"AOCP - PM","topic":"Igualdade de Gênero - Art. 5º, I","text":"Homens e mulheres são iguais em direitos e obrigações, nos termos da Constituição Federal. Essa igualdade:","options":["impede qualquer distinção de prazo de licença-maternidade e paternidade.","não obsta a criação de distinções legítimas pela lei, desde que pautadas na razoabilidade e no interesse social.","proíbe a fixação de requisitos diferenciados para ingresso nas Forças Armadas.","é absoluta e cede apenas diante do interesse público da administração.","aplica-se exclusivamente aos cidadãos brasileiros natos."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 5º, I, CF."},{"num":"Q22","source":"AOCP - PC","topic":"Inviolabilidade de Domicílio - Art. 5º, XI","text":"De acordo com a jurisprudência consolidada do STF e o texto do Art. 5º, XI da CF/88, a entrada forçada em domicílio sem mandado judicial é legítima:","options":["a qualquer hora da noite, bastando mera denúncia anônima de tráfico de drogas.","durante o dia ou à noite, em caso de flagrante delito ou desastre, ou para prestar socorro.","apenas durante o dia, mediante determinação da autoridade policial do bairro.","durante a noite, mediante autorização do Ministério Público de plantão.","em qualquer situação, desde que o imóvel seja alugado por terceiro."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 5º, XI, CF."},{"num":"Q23","source":"AOCP - TJ","topic":"Direito de Resposta - Art. 5º, V","text":"É assegurado o direito de resposta, proporcional ao agravo, além da indenização por dano:","options":["apenas material e estético.","exclusivamente moral.","material, moral ou à imagem.","administrativo e funcional.","previdenciário e tributário."],"answer":"C","comment":"Fundamentação indicada no caderno: Art. 5º, V, CF."},{"num":"Q24","source":"AOCP - MPE","topic":"Liberdade de Manifestação - Art. 5º, IV","text":"É livre a manifestação do pensamento, sendo:","options":["permitido o anonimato nas redes sociais em caso de matérias jornalísticas.","vedado o anonimato em qualquer hipótese.","exigida autorização prévia da polícia para publicação de livros.","permitido o anonimato apenas para denúncia de crimes funcionais.","sujeita a censura prévia de natureza política ou ideológica."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 5º, IV, CF."}],"official_questions":[{"num":"Q01","source":"Instituto AOCP (2024) - PM-ES - Soldado","text":"O artigo 5º da Constituição Federal de 1988 consagra os direitos e deveres individuais e coletivos. No que tange ao princípio da igualdade e aos direitos fundamentais, assinale a alternativa correta:","options":["Homens e mulheres são iguais em direitos e obrigações, sem distinção de qualquer natureza, sendo admitidas diferenças salariais por motivo de sexo.","Ninguém será obrigado a fazer ou deixar de fazer algo senão em virtude de lei.","É livre a manifestação do pensamento, sendo permitido o anonimato em redes sociais.","A lei não contemplará a proteção das crenças religiosas, sendo o Estado confessional.","É inviolável a liberdade de consciência e de crença, sendo vedada a prestação de assistência religiosa em entidades civis."],"answer":"B","comment":"O princípio da legalidade está expresso no inciso II do art. 5º ('ninguém será obrigado a fazer ou deixar de fazer algo senão em virtude de lei'). O anonimato é vedado (inciso IV).","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q02","source":"Instituto AOCP (2023) - PC-GO - Escrivão de Polícia","text":"Sobre a inviolabilidade domiciliar prevista no art. 5º, XI, da Constituição Federal, assinale a alternativa correta:","options":["A casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial.","As autoridades policiais podem ingressar em qualquer domicílio a qualquer hora da noite, independentemente de autorização, se houver fundada suspeita de tráfico de drogas.","O conceito de 'casa' restringe-se exclusivamente aos imóveis residenciais urbanos fechados.","Durante a noite, a entrada em domicílio sem consentimento só é permitida mediante autorização do Ministério Público.","O consentimento do morador para ingresso domiciliar exige formalização por escrito registrada em cartório."],"answer":"A","comment":"A literalidade do art. 5º, XI da CF prevê as exceções à inviolabilidade domiciliar: consentimento, flagrante delito, desastre, prestação de socorro ou, durante o dia, por ordem judicial.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q03","source":"Instituto AOCP (2024) - Prefeitura de Vitória - Auditor","text":"No que diz respeito ao direito de propriedade e suas garantias constitucionais, assinale a afirmativa correta:","options":["A propriedade industrial adquirirá direito adquirido irrevogável que impeça a desapropriação por interesse social.","É garantido o direito de propriedade, mas este não se submete a nenhuma função social.","A pequena propriedade rural, assim definida em lei, desde que trabalhada pela família, não será objeto de penhora para pagamento de débitos decorrentes de sua atividade produtiva, conforme dispuser a lei.","A desapropriação por necessidade ou utilidade pública far-se-á mediante prévia e justa indenização em títulos da dívida pública resgatáveis em 30 anos.","Em caso de iminente perigo público, a autoridade competente poderá usar de propriedade particular, assegurada indenização ulterior, independentemente de haver dano."],"answer":"C","comment":"O art. 5º, XXVI da CF protege a pequena propriedade rural trabalhada pela família contra penhora para pagamento de débitos de sua atividade produtiva.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q04","source":"Instituto AOCP (2023) - PM-SC - Oficial","text":"A respeito das garantias processuais penais fundamentais asseguradas no art. 5º da CF/88, assinale a alternativa correta:","options":["A lei penal retroagirá para beneficiar o réu, ainda que haja sentença condenatória transitada em julgado.","Ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória.","A prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente apenas à família do preso, dispensando-se a autoridade judiciária.","Admitir-se-á ação privada nos crimes de qualquer natureza se a ação pública não for intentada no prazo legal.","A prática da tortura constitui crime inafiançável e passível de graça ou anistia."],"answer":"B","comment":"O princípio da presunção de inocência consta expressamente no art. 5º, LVII ('ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória').","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q05","source":"Instituto AOCP (2024) - PC-PA - Delegado de Polícia","text":"Sobre os direitos de reunião e associação previstos no art. 5º da Constituição Federal, assinale a alternativa incorreta:","options":["Todos podem reunir-se pacificamente, sem armas, em locais abertos ao público, independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo exigido apenas prévio aviso à autoridade competente.","A criação de associações e, na forma da lei, a de cooperativas independem de autorização, sendo vedada a interferência estatal em seu funcionamento.","As associações só poderão ser compulsoriamente dissolvidas ou ter suas atividades suspensas por decisão judicial, exigindo-se, no primeiro caso, o trânsito em julgado.","Ninguém poderá ser compelido a associar-se ou a permanecer associado.","A criação de associações de caráter paramilitar é permitida desde que registrada no Ministério da Justiça."],"answer":"E","comment":"O art. 5º, XVII da CF veda expressamente a criação de associações de caráter paramilitar ('é plena a liberdade de associação para fins lícitos, vedada a de caráter paramilitar').","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q06","source":"Instituto AOCP (2022) - DEPEN - Especialista Federal","text":"O sigilo das comunicações e da correspondência é garantia fundamental inviolável. Sobre essa matéria na Constituição Federal de 1988, assinale a alternativa correta:","options":["É inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por ordem da autoridade policial nas investigações criminais.","O sigilo das comunicações telefônicas pode ser rompido por ordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de investigação criminal ou instrução processual penal.","As conversas mantidas por aplicativos de mensagens instantâneas possuem proteção absoluta, sendo vedada a quebra de sigilo por ordem judicial em qualquer hipótese.","A fiscalização tributária pode quebrar o sigilo bancário e de dados dos contribuintes diretamente, sem necessidade de autorização judicial ou previsão legal específica.","O sigilo de dados telefônicos (como registros de chamadas e ERBs) confunde-se com a interceptação telefônica e exige prévia autorização parlamentar."],"answer":"B","comment":"O art. 5º, XII da CF estabelece a inviolabilidade das comunicações telefônicas, salvo, por ordem judicial, nas hipóteses e na forma que a lei estabelecer para investigação criminal ou instrução processual penal.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q07","source":"Instituto AOCP (2023) - SEJUC-RN - Policial Penal","text":"No que concerne aos direitos referentes à nacionalidade, honra, imagem e intimidade previstos no art. 5º da CF/88, assinale a alternativa correta:","options":["São invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas, assegurado o direito a indenização pelo dano material ou moral decorrente de sua violação.","A indenização por dano moral decorrente de violação da imagem é tarifada por lei federal.","A casa é asilo inviolável, permitindo-se a violação da intimidade domiciliar por agentes públicos em diligência fiscal noturna.","A liberdade de expressão protege publicações anônimas ofensivas à honra alheia.","O direito de resposta é incompatível com a indenização por danos morais."],"answer":"A","comment":"A literalidade do inciso X do art. 5º garante a inviolabilidade da intimidade, vida privada, honra e imagem, com direito a indenização por dano material ou moral.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q08","source":"Instituto AOCP (2024) - PMDF - Praça","text":"Acerca dos remédios constitucionais e proteções de acesso à Justiça no art. 5º, assinale a alternativa correta:","options":["A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito.","O acesso ao Poder Judiciário em matéria cível exige o prévio pagamento de taxa judiciária integral, sem ressalvas para hipossuficientes.","A lei poderá condicionar o ajuizamento de ação judicial de qualquer natureza à prévia exaustão da via administrativa.","O Tribunal do Júri tem sua organização competida a decretos autônomos do Poder Executivo.","A ação popular só pode ser proposta por partidos políticos com registro no TSE."],"answer":"A","comment":"O princípio da inafastabilidade da jurisdição está consagrado no art. 5º, XXXV ('a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito').","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q09","source":"Instituto AOCP (2023) - PC-ES - Delegado","text":"Sobre os princípios penais constitucionais contidos no art. 5º da CF/88, assinale a alternativa incorreta:","options":["Não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.","A lei penal não retroagirá, salvo para beneficiar o réu.","A pena poderá passar da pessoa do condenado em caso de crimes hediondos de repercussão nacional.","A lei considerará crimes inafiançáveis e insuscetíveis de graça ou anistia a prática da tortura, o tráfico ilícito de entorpecentes e drogas afins, o terrorismo e os definidos como crimes hediondos.","Ninguém será preso senão em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo nos casos de transgressão militar."],"answer":"C","comment":"O art. 5º, XLV da CF consagra o princípio da intranscendência da pena ('nenhuma pena passará da pessoa do condenado').","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q10","source":"Instituto AOCP (2024) - SEAP-PA - Policial Penal","text":"Em relação à extradição e aos direitos dos estrangeiros e brasileiros previstos no art. 5º da Constituição Federal, assinale a afirmativa correta:","options":["Nenhum brasileiro será extraditado, salvo o naturalizado, em caso de crime comum, praticado antes da naturalização, ou de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei.","O brasileiro nato poderá ser extraditado se adquirir voluntariamente outra nacionalidade.","Não será concedida extradição de estrangeiro por crime político ou de opinião.","Os estrangeiros residentes no país não possuem direito à segurança jurídica ou à propriedade privada.","A extradição de brasileiro naturalizado é admitida por crime político cometido após a naturalização."],"answer":"C","comment":"O art. 5º, LII estabelece expressamente que 'não será concedida extradição de estrangeiro por crime político ou de opinião'.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q11","source":"Instituto AOCP (2023) - PM-CE - Soldado","text":"Assinale a alternativa que descreve corretamente uma garantia relacionada à gratuidade de atos prevista no art. 5º da CF/88:","options":["São gratuitos para os reconhecidamente pobres, na forma da lei, o registro civil de nascimento e a certidão de óbito.","Todos os serviços cartorários e notariais são gratuitos no âmbito nacional.","O habeas corpus e o mandado de segurança exigem pagamento de custas processuais módicas.","O registro de imóveis residenciais urbanos é gratuito para qualquer cidadão.","As certidões emitidas por repartições públicas para defesa de direitos dependem de taxa de expediente."],"answer":"A","comment":"O art. 5º, LXXVI da CF garante a gratuidade do registro civil de nascimento e da certidão de óbito para os reconhecidamente pobres.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q12","source":"Instituto AOCP (2024) - PC-GO - Escrivão","text":"No que tange aos direitos e garantias fundamentais individuais, assinale a alternativa que reproduz corretamente o texto constitucional acerca da liberdade de profissão:","options":["É livre o exercício de qualquer trabalho, ofício ou profissão, atendidas as qualificações profissionais que a lei estabelecer.","O exercício de profissões intelectuais é livre, sendo vedada qualquer exigência de diploma ou conselho de classe.","Nenhuma profissão pode ser regulamentada por lei ordinária.","O Estado garantirá emprego público a todos os cidadãos capacitados.","É vedada a exigência de testes físicos para ingresso em carreiras de segurança pública."],"answer":"A","comment":"O art. 5º, XIII da CF dispõe que é livre o exercício de qualquer trabalho, ofício ou profissão, atendidas as qualificações profissionais que a lei estabelecer.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q13","source":"Instituto AOCP (2023) - Guarda Municipal de Vila Velha - ES","text":"Acerca da proteção aos direitos de propriedade intelectual e autoral no art. 5º da CF/88, assinale a alternativa correta:","options":["Aos autores pertence o direito exclusivo de utilização, publicação ou reprodução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar.","Os direitos autorais são perpétuos e intransmissíveis.","A industrialização de invenções não goza de privilégio temporário.","A proteção às marcas e nomes de empresas é vedada pela Constituição Federal.","O direito autoral extingue-se imediatamente com o falecimento do autor."],"answer":"A","comment":"O art. 5º, XXVII da CF assegura aos autores o direito exclusivo de utilização, publicação ou reprodução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q14","source":"Instituto AOCP (2022) - DEPEN - Agente Federal","text":"Sobre as garantias relativas à prisão e aos direitos do preso estabelecidas no art. 5º da Constituição Federal, assinale a alternativa incorreta:","options":["A prisão ilegal será imediatamente relaxada pela autoridade judiciária.","Ninguém será levado à prisão ou nela mantido, quando a lei admitir a liberdade provisória, com ou sem fiança.","Haverá prisão civil por dívida em caso de depositário infiel em qualquer modalidade de depósito.","O preso será informado de seus direitos, entre os quais o de permanecer calado, sendo-lhe assegurada a assistência da família e de advogado.","O preso tem direito à identificação dos responsáveis por sua prisão ou por seu interrogatório policial."],"answer":"C","comment":"Conforme entendimento pacificado do STF (Súmula Vinculante 25) e o Pacto de São José da Costa Rica, é ilícita a prisão civil do depositário infiel, restando apenas a hipótese de inadimplemento voluntário e inescusável de obrigação alimentícia.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q15","source":"Instituto AOCP (2024) - PMDF - Oficial","text":"Em relação ao direito de petição e obtenção de certidões garantidos no art. 5º da CF/88, assinale a alternativa correta:","options":["São assegurados a todos, independentemente do pagamento de taxas, o direito de petição aos Poderes Públicos em defesa de direitos ou contra ilegalidade ou abuso de poder, bem como a obtenção de certidões em repartições públicas para defesa de direitos e esclarecimento de situações de interesse pessoal.","O direito de petição depende de pagamento de emolumentos federais.","A obtenção de certidões em repartições públicas é restrita aos cidadãos nacionais natos.","O direito de petição exige a assistência obrigatória de advogado.","As repartições públicas podem recusar emissão de certidões por motivo de sigilo administrativo genérico."],"answer":"A","comment":"O art. 5º, XXXIV garante a todos o direito de petição e a obtenção de certidões independentemente do pagamento de taxas.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q16","source":"Instituto AOCP (2023) - PC-PA - Escrivão","text":"No que diz respeito à igualdade entre homens e mulheres e aos direitos fundamentais civis, assinale a afirmativa correta:","options":["Homens e mulheres são iguais em direitos e obrigações nos termos da Constituição Federal.","A lei penal pode estabelecer penas diferenciadas para o mesmo crime baseadas exclusivamente no gênero.","A mulher é isenta de cumprir obrigações cívicas em qualquer hipótese.","O homem não pode pleitear guarda compartilhada de filhos perante o Poder Judiciário.","A capacidade civil da mulher casada depende de autorização marital."],"answer":"A","comment":"O art. 5º, I consagra que 'homens e mulheres são iguais em direitos e obrigações, nos termos desta Constituição'.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q17","source":"Instituto AOCP (2024) - Pref. de Manaus - Guarda Municipal","text":"Sobre a inviolabilidade da liberdade de consciência, de crença e dos cultos religiosos, assinale a alternativa correta:","options":["É inviolável a liberdade de consciência e de crença, sendo assegurado o livre exercício dos cultos religiosos e garantida, na forma da lei, a proteção aos locais de culto e a suas liturgias.","O Brasil adota religião oficial de Estado, sendo obrigatório o ensino confessional católico nas escolas públicas.","É vedada a prestação de assistência religiosa nas entidades civis e militares de internação coletiva.","Ninguém pode ser privado de seus direitos por motivo de crença religiosa, mesmo que a invoque para eximir-se de obrigação legal a todos imposta e recusar prestação alternativa.","Os templos religiosos estão sujeitos ao pagamento de impostos municipais sobre a propriedade predial."],"answer":"A","comment":"O art. 5º, VI garante a liberdade de consciência e de crença, o livre exercício dos cultos e a proteção aos locais de culto.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q18","source":"Instituto AOCP (2023) - PM-ES - Soldado","text":"A respeito dos direitos de nacionalidade e garantias fundamentais correlatas, assinale a alternativa correta sobre o mandado de segurança e ações constitucionais:","options":["Conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, quando o responsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público.","O mandado de segurança exige o pagamento prévio de custas judiciais elevadas e caução em dinheiro.","O habeas data destina-se exclusivamente a retificar dados fiscais de empresas comerciais.","A ação popular pode ser ajuizada por qualquer estrangeiro residente no exterior.","O mandado de injunção é cabível contra qualquer lei omissa de iniciativa privada."],"answer":"A","comment":"A definição clássica do mandado de segurança consta no art. 5º, LXIX da CF.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q19","source":"Instituto AOCP (2022) - DEPEN - Especialista","text":"Dentre os incisos do art. 5º da Constituição Federal, qual deles trata especificamente da vedação de tribunais de exceção?","options":["Não haverá juízo ou tribunal de exceção.","A lei não prejudicará o direito adquirido, o ato jurídico perfeito e a coisa julgada.","Todos são iguais perante a lei, sem distinção de qualquer natureza.","Ninguém será processado nem sentença senão pela autoridade competente.","É assegurado a todos o contraditório e a ampla defesa."],"answer":"A","comment":"O art. 5º, XXXVII da CF estabelece expressamente que 'não haverá juízo ou tribunal de exceção'.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"},{"num":"Q20","source":"Instituto AOCP (2024) - PC-GO - Delegado de Polícia","text":"Sobre as garantias fundamentais do processo judicial e administrativo, assinale a alternativa correta conforme o art. 5º da Constituição Federal:","options":["A aos litigantes, em processo judicial ou administrativo, e aos acusados em geral são assegurados o contraditório e a ampla defesa, com os meios e recursos a ela inerentes.","São inadmissíveis, nos processos, as provas obtidas por meios ilícitos, sem nenhuma exceção baseada no princípio da proporcionalidade.","A lei poderá restringir a publicidade dos atos processuais em qualquer hipótese, vedada a defesa da intimidade.","O custeio da defesa técnica por defensor público é vedado aos cidadãos que possuam renda familiar superior a um salário mínimo.","A ação penal privada subsidiária da pública não possui prazo decadencial."],"answer":"A","comment":"O art. 5º, LV consagra o princípio do contraditório e da ampla defesa para os litigantes em processo judicial ou administrativo e acusados em geral.","collection":"caderno_assunto_2_direitos_fundamentais_1.pdf"}],"discipline":"Direito Constitucional"},{"id":"art5_parte2","title":"Direitos e Garantias Fundamentais — Parte II (Art. 5º, XXXII a LXXIX)","priority":"MUITO ALTA","focus":"Garantias processuais, direito penal constitucional, extradição e remédios constitucionais.","summary":["A segunda metade do art. 5º concentra temas extremamente recorrentes: <mark>acesso à justiça</mark>, júri, legalidade penal, penas, extradição e, sobretudo, os <u>remédios constitucionais</u>.","A banca gosta de cobrar o <mark>objeto de tutela</mark> de cada remédio: HC protege liberdade de locomoção; HD protege informações pessoais; MS tutela direito líquido e certo; MI combate omissão normativa; ação popular tutela interesses difusos ligados ao patrimônio e moralidade pública.","Também aparecem com frequência: juiz natural, coisa julgada, legalidade penal, individualização da pena, vedação de penas e hipóteses de extradição."],"highlights":["Direito de petição, certidões e acesso à justiça.","Direito adquirido, ato jurídico perfeito e coisa julgada.","Tribunal do júri e seus princípios.","Legalidade penal e retroatividade da lei penal benéfica.","HC, HD, MS, MI e ação popular.","Extradição: brasileiro nato x naturalizado."],"pegadinhas":["HC protege liberdade de locomoção; MS não substitui HC nem HD.","Ação popular é proposta por <mark>cidadão</mark>, e não por qualquer pessoa.","O brasileiro nato não é extraditado; o naturalizado só em hipóteses constitucionais específicas."],"law_items":[["Incisos XXXIII a XXXV","Direito à informação, direito de petição/certidão e princípio da <mark>inafastabilidade da jurisdição</mark>."],["Incisos XXXVI a XLVII","Coisa julgada, juiz natural, júri, legalidade penal, irretroatividade, racismo, tortura, hediondos, terrorismo e espécies de pena vedadas."],["Incisos XLVIII a LII","Regras sobre cumprimento da pena, respeito aos presos e extradição."],["Incisos LXVIII a LXXIII","<mark>Habeas corpus</mark>, <mark>habeas data</mark>, <mark>mandado de segurança</mark>, <mark>mandado de injunção</mark> e <mark>ação popular</mark>."],["Inciso LXXVIII","Todos têm direito à <mark>duração razoável do processo</mark> e aos meios que garantam sua celeridade."]],"juris":[["Súmula Vinculante 11 — uso de algemas","<b>Enunciado para revisão:</b> o uso de algemas é excepcional e deve estar ligado a resistência, risco de fuga ou perigo à integridade física, com justificativa da excepcionalidade. O uso indevido pode gerar responsabilização e nulidade.<br><br><b>AOCP:</b> atenção a <mark>excepcionalidade + fundamentação</mark>.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1220\" target=\"_blank\">Abrir SV 11 no STF ↗</a>"],["Súmula Vinculante 14 — acesso do defensor à investigação","<b>Enunciado para revisão:</b> o defensor tem direito de acessar os elementos de prova <mark>já documentados</mark> em procedimento investigatório e relacionados ao exercício da defesa.<br><br><b>Pegadinha:</b> o acesso não significa conhecimento antecipado de diligências em andamento ainda não documentadas.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/constituicao-supremo/artigo.asp?abrirArtigo=133&abrirBase=CF\" target=\"_blank\">Abrir referência oficial da SV 14 ↗</a>"],["Súmula Vinculante 25 — depositário infiel","<b>Enunciado para revisão:</b> é ilícita a prisão civil de depositário infiel, independentemente da modalidade do depósito.<br><br><b>Relação com a prova:</b> conecta o art. 5º, LXVII, à força supralegal da Convenção Americana sobre Direitos Humanos.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1268\" target=\"_blank\">Abrir SV 25 no STF ↗</a>"],["Súmula Vinculante 5 — defesa técnica em PAD","<b>Enunciado para revisão:</b> a ausência de advogado em processo administrativo disciplinar, por si só, não viola a Constituição quando forem efetivamente assegurados contraditório e ampla defesa.<br><br><b>Pegadinha:</b> contraditório e ampla defesa continuam obrigatórios; o que não é obrigatória em todo PAD é a defesa técnica por advogado.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1199\" target=\"_blank\">Abrir SV 5 no STF ↗</a>"]],"questions":[{"num":"Q41","source":"AOCP - PC","topic":"Tribunal do Júri - Art. 5º, XXXVIII","text":"A Constituição reconhece a instituição do júri. Não constitui princípio expresso do Tribunal do Júri:","options":["a plenitude de defesa.","o sigilo das votações.","a soberania dos veredictos.","a competência para o julgamento dos crimes culposos contra o patrimônio público.","a competência para o julgamento dos crimes dolosos contra a vida."],"answer":"D","comment":"Fundamentação indicada no caderno: Art. 5º, XXXVIII, CF."},{"num":"Q42","source":"AOCP - Agente Penitenciário","topic":"Crimes Inafiançáveis - Art. 5º, XLII/XLIII","text":"A prática do racismo e a ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado Democrático constituem crimes:","options":["afiançáveis e prescritíveis.","inafiançáveis e imprescritíveis.","suscetíveis de graça ou anistia.","prescritíveis em 5 anos.","sujeitos apenas a penas restritivas de direitos."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 5º, XLII/XLIV, CF."},{"num":"Q43","source":"AOCP - DPE","topic":"Remédios Constitucionais - Habeas Corpus","text":"Conceder-se-á Habeas Corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder. O habeas corpus:","options":["exige a assinatura expressa de advogado constituído.","é ação gratuita e não exige representação por advogado.","é passível de cobrança de custas processuais mínimas.","aplica-se para anular punição disciplinar militar estritamente de mérito.","pode ser impetrado apenas por pessoas jurídicas brasileiras."],"answer":"B","comment":"Fundamentação indicada no caderno: Art. 5º, LXVIII, CF."},{"num":"Q3","source":"Instituto AOCP (2025) - MPE-RS - Analista do MP","topic":"Remédios Constitucionais","text":"Em relação aos direitos e garantias fundamentais expressamente previstos na Constituição Federal de 1988, assinale a alternativa correta.","options":["A prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente ao Ministério Público e à autoridade policial.","Ninguém será levado à prisão ou nela mantido quando a lei admitir a liberdade provisória, desde que sem fiança.","Haverá prisão civil por dívida do responsável pelo inadimplemento involuntário e escusável de obrigação alimentícia.","O mandado de segurança coletivo pode ser impetrado por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados.","Conceder-se-á mandado de segurança sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais."],"answer":"D","comment":"Gabarito indicado no caderno: D. A alternativa reproduz o art. 5º, LXX, b, da CF. A alternativa E descreve o mandado de injunção.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"},{"num":"Q4","source":"Instituto AOCP (2024) - PMDF - Oficial / Praça","topic":"Direitos Individuais e Coletivos","text":"A norma constitucional que estabelece que \"A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito\" (art. 5º, XXXV) consagra expressamente o princípio do(a)","options":["contraditório e da ampla defesa.","inafastabilidade da jurisdição (ou acesso à justiça).","juiz natural e imparcialidade.","motivação das decisões judiciais.","devido processo legal substancial."],"answer":"B","comment":"Gabarito indicado no caderno: B. O art. 5º, XXXV consagra a inafastabilidade da tutela jurisdicional.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[{"num":"Q01","source":"INSTITUTO AOCP / Polícia Civil / 2023","text":"De acordo com o artigo 5º da Constituição Federal de 1988, todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade. Nesse contexto, assinale a alternativa correta acerca dos direitos e garantias fundamentais.","options":["É livre a expressão da atividade intelectual, artística, científica e de comunicação, sujeita a censura prévia de natureza política.","O civilmente identificado não poderá ser submetido a identificação criminal, salvo nas hipóteses expressamente previstas em lei.","A casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, exceto a qualquer hora do dia ou da noite em caso de flagrante delito.","É plena a liberdade de associação para fins lícitos, inclusive a de caráter paramilitar.","Ninguém será preso senão em flagrante delito ou por ordem escrita e fundamentada de autoridade policial competente."],"answer":"C","comment":"Conforme o art. 5º, XI, a casa é asilo inviolável, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q02","source":"INSTITUTO AOCP / TRF 2ª Região / 2024","text":"Referente aos direitos e garantias fundamentais, assinale a alternativa correta nos termos da Constituição da República Federativa do Brasil e do entendimento consolidado do Supremo Tribunal Federal (STF).","options":["É constitucional o condicionamento da desfiliação de associado à quitação de débito referente a benefício obtido.","O exercício do direito de reunião pacífica depende de prévia autorização da autoridade competente.","A lei não poderá estabelecer restrições à publicidade de atos, mesmo quando a defesa da intimidade o exigir.","A criação de associações e, na forma da lei, a de cooperativas independentes independem de autorização, sendo vedada a interferência estatal em seu funcionamento.","As normas definidoras de direitos fundamentais possuem sempre eficácia limitada e dependem de regulamentação total."],"answer":"D","comment":"Art. 5º, XVIII, CF/88: a criação de associações e, na forma da lei, a de cooperativas independem de autorização, sendo vedada a interferência estatal em seu funcionamento.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q03","source":"INSTITUTO AOCP / MPE-RS / 2025","text":"Em relação aos direitos e garantias fundamentais expressamente previstos na Constituição Federal de 1988, assinale a alternativa correta.","options":["A prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente ao juiz competente e à família do preso ou à pessoa por ele indicada.","Ninguém será levado à prisão ou nela mantido quando a lei admitir a liberdade provisória, sem fiança.","Haverá prisão civil por dívida do depositário infiel em qualquer hipótese admitida pelo direito civil ordinário.","O mandado de segurança coletivo pode ser impetrado por associação legalmente constituída há pelo menos dois anos.","Conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício de direitos constitucionais."],"answer":"E","comment":"Art. 5º, LXXI: conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q04","source":"INSTITUTO AOCP / PM-DF / 2023","text":"No que diz respeito aos direitos e deveres individuais e coletivos previstos na Constituição Federal, assinale a assertiva correta.","options":["A lei penal não retroagirá, salvo para beneficiar o réu, exceto nos crimes hediondos.","A prática de racismo constitui crime inafiançável e imprescritível, sujeito à pena de reclusão.","A lei punirá qualquer discriminação atentatória dos direitos e liberdades fundamentais, sendo admitida fiança em crimes de intolerância.","Constitui crime inafiançável e insuscetível de graça ou anistia a ação de grupos armados, civis ou militares, contra a ordem constitucional.","Não há previsão constitucional de extradição de brasileiros natos sob nenhuma hipótese."],"answer":"B","comment":"Art. 5º, XLII: a prática do racismo constitui crime inafiançável e imprescritível, sujeito à pena de reclusão, nos termos da lei.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q05","source":"INSTITUTO AOCP / PC-ES / 2019","text":"Segundo a Constituição Federal de 1988, analise os direitos fundamentais e assinale a alternativa que apresenta uma assertiva correta acerca das garantias constitucionais.","options":["O habeas corpus será concedido sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder.","O mandado de segurança coletivo protege direito líquido e certo, amparado por habeas data, quando o responsável for autoridade pública.","A ação popular é gratuita, salvo comprovada má-fé, e pode ser proposta por qualquer estrangeiro residente.","É assegurado o direito de resposta, proporcional ao agravo, além da indenização por dano material, moral ou à imagem, sendo vedado o sigilo da fonte.","A soberania popular manifestar-se-á apenas pelo sufrágio universal e pelo voto direto e secreto."],"answer":"A","comment":"Conforme o art. 5º, LXVIII, o habeas corpus é o remédio constitucional adequado para proteger a liberdade de locomoção contra ilegalidade ou abuso de poder.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q06","source":"INSTITUTO AOCP / Perito Criminal / 2021","text":"Acerca dos direitos de nacionalidade e dos direitos fundamentais previstos na CF/88, assinale a opção correta.","options":["Os brasileiros natos não podem perder a nacionalidade brasileira em hipótese alguma.","Aos estrangeiros residentes no País aplicam-se apenas os direitos políticos ativos.","A lei não poderá excluir da apreciação do Poder Judiciário lesão ou ameaça a direito.","A casa é asilo inviolável, permitindo-se o ingresso forçado a qualquer hora da noite por determinação de autoridade policial.","São gratuitas as ações de habeas corpus e habeas data, bem como os atos necessários ao exercício da cidadania, sem ressalvas."],"answer":"C","comment":"Princípio da inafastabilidade da jurisdição (art. 5º, XXXV): a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q07","source":"INSTITUTO AOCP / TJ-AM / 2023","text":"No que se refere aos direitos e garantias fundamentais da Constituição Federal de 1988, analise as afirmativas e assinale a correta.","options":["É garantido o direito de propriedade, mas a propriedade não atenderá a sua função social.","A pequena propriedade rural, assim definida em lei, desde que trabalhada pela família, será objeto de penhora para pagamento de débitos fiscais.","A sucessão de bens de estrangeiros situados no País será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros.","O Estado garantirá a gratuidade dos emolumentos para os reconhecidamente ricos, na forma da lei.","Todos podem reunir-se pacificamente, com armas, em locais abertos ao público."],"answer":"C","comment":"Art. 5º, XXXI: a sucessão de bens de estrangeiros situados no País será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, sempre que não lhes seja mais favorável a lei pessoal do de cujus.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q08","source":"INSTITUTO AOCP / PC-GO / 2022","text":"Assinale a alternativa que descreve corretamente uma garantia fundamental disposta no artigo 5º da Constituição da República.","options":["A prática de tortura é passível de fiança, desde que autorizada por juiz competente em casos de extrema gravidade investigativa.","A lei estabelecerá o júri, com a organização que lhe der a lei, assegurando a plenitude de defesa e o sigilo das votações.","Nenhum brasileiro será extraditado, exceto o naturalizado, em caso de crime comum, praticado antes da naturalização.","A extradição de estrangeiro não será concedida por crime político ou de opinião, conforme tratado internacional.","São assegurados, mediante pagamento de taxa, a obtenção de certidões em repartições públicas para defesa de direitos."],"answer":"B","comment":"Art. 5º, XXXVIII: é reconhecida a instituição do júri, com a organização que lhe der a lei, assegurando a plenitude de defesa, o sigilo das votações, a soberania dos veredictos e a competência para os crimes dolosos contra a vida.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q09","source":"INSTITUTO AOCP / Pref. de Curitiba / 2023","text":"Acerca dos direitos e deveres individuais e coletivos previstos na Constituição Federal, assinale a alternativa incorreta (falsa).","options":["É assegurado a todos o acesso à informação e esguardado o sigilo da fonte, quando necessário ao exercício profissional.","A criação de associações de caráter paramilitar é plenamente permitida se houver autorização prévia do Ministério da Justiça.","A lei civil poderá exigir autorização prévia para a fundação de associações civis sem fins lucrativos. (Incorreta - veda-se interferência estatal).","Ninguém será obrigado a fazer ou deixar de fazer algo senão em virtude de lei.","É livre o exercício de qualquer trabalho, profissão ou ofício, atendidas as qualificações profissionais que a lei estabelecer."],"answer":"C","comment":"Conforme o art. 5º, inciso XVII, é plena a liberdade de associação para fins lícitos, vedada a de caráter paramilitar. A exigência de autorização prévia é inconstitucional.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q10","source":"INSTITUTO AOCP / IBGE / 2021","text":"O mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional, organização sindical ou associação legalmente constituída. Sobre este remédio constitucional, assinale a alternativa correta.","options":["Exige-se o prazo mínimo de funcionamento de dois anos para a associação impetrar o mandado de segurança coletivo.","A associação impetrante precisa de autorização especial e nominal de cada associado para propor o writ.","O partido político necessita de representação no Congresso Nacional para impetrá-lo em defesa de seus interesses.","O mandado de segurança coletivo substitui integralmente a Ação Popular em qualquer hipótese de lesão ambiental.","Não há previsão de mandado de segurança coletivo no ordenamento jurídico brasileiro."],"answer":"C","comment":"Art. 5º, LXX, \"a\": o mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q11","source":"INSTITUTO AOCP / PC-PA / 2020","text":"A respeito dos direitos fundamentais na ordem constitucional brasileira, assinale a assertiva correta.","options":["A lei penal não retroagirá, salvo para beneficiar o réu, desde que já transitada em julgado a sentença condenatória.","A prática de terrorismo e os crimes hediondos são insuscetíveis de graça, anistia ou anistia política.","A exigência de identificação criminal para o civilmente identificado restringe-se aos casos legais, sendo permitida em qualquer hipótese de abordagem policial.","A casa é asilo inviolável, permitindo-se o ingresso por ordem policial escrita sem consentimento a qualquer momento do dia ou da noite.","É livre a locomoção no território nacional em tempo de paz, podendo qualquer pessoa nele entrar, permanecer ou dele sair, nos termos da lei."],"answer":"E","comment":"Art. 5º, XV: é livre a locomoção no território nacional em tempo de paz, podendo qualquer pessoa, nos termos da lei, nele entrar, permanecer ou dele sair.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q12","source":"INSTITUTO AOCP / SEAP-MG / 2021","text":"No que tange às garantias constitucionais do processo e aos direitos individuais, assinale a opção correta.","options":["Aos litigantes, em processo judicial ou administrativo, e aos acusados em geral são assegurados o contraditório e a ampla defesa, com os meios e recursos a ela inerentes.","São inadmissíveis, em qualquer processo, as provas obtidas por meios lícitos, se houver consentimento expresso da autoridade.","A lei não poderá estabelecer a obrigatoriedade de assistência jurídica integral e gratuita para todos os cidadãos.","O preso será informado de seus direitos, entre os quais o de permanecer em silêncio, sendo-lhe assegurada a assistência da família e de advogado, vedada a comunicação externa.","Não há restrições constitucionais à publicidade de atos processuais."],"answer":"A","comment":"Literalidade do art. 5º, LV da Constituição Federal de 1988. Questão 13 a 20 (Bloco Consolidado de Fixação - Instituto AOCP) 13. O habeas data visa a assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público. (Gabarito: CERTO) 14. Conforme a jurisprudência da AOCP, a propriedade rural produtiva pode ser desapropriada para fins de reforma agrária. (Gabarito: ERRADO - A produtiva é insuscetível de desapropriação para fins de reforma agrária). 15. A lei civil fixará os critérios de proteção à criação de obras industriais e à propriedade das marcas, tendo em vista o interesse social e o desenvolvimento tecnológico e econômico do País. (Gabarito: CERTO - Art. 5º, XXIX). 16. É livre a manifestação do pensamento, sendo vedado o anonimato em qualquer circunstância. (Gabarito: CERTO - Art. 5º, IV). 17. O direito de herança é garantido constitucionalmente como cláusula pétrea nas sucessões internacionais e nacionais. (Gabarito: CERTO - Art. 5º, XXX). 18. As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata, conforme o parágrafo 1º do art. 5º da CF/88. (Gabarito: CERTO). 19. Nenhum brasileiro naturalizado poderá ser extraditado em caso de crime comum praticado após a naturalização. (Gabarito: CERTO). 20. Aos autores pertence o direito exclusivo de utilização, publicação ou tradução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar. (Gabarito: CERTO - Art. 5º, XXVII).","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q13","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O habeas data visa a assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q14","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Conforme a jurisprudência da AOCP, a propriedade rural produtiva pode ser desapropriada para fins de reforma agrária.","options":["CERTO","ERRADO"],"answer":"B","comment":"Gabarito do caderno: ERRADO. A produtiva é insuscetível de desapropriação para fins de reforma agrária","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q15","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"A lei civil fixará os critérios de proteção à criação de obras industriais e à propriedade das marcas, tendo em vista o interesse social e o desenvolvimento tecnológico e econômico do País.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 5º, XXIX","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q16","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"É livre a manifestação do pensamento, sendo vedado o anonimato em qualquer circunstância.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 5º, IV","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q17","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"O direito de herança é garantido constitucionalmente como cláusula pétrea nas sucessões internacionais e nacionais.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 5º, XXX","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q18","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata, conforme o parágrafo 1º do art. 5º da CF/88.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q19","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Nenhum brasileiro naturalizado poderá ser extraditado em caso de crime comum praticado após a naturalização.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO.","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"},{"num":"Q20","source":"Instituto AOCP - Bloco Consolidado de Fixação","text":"Aos autores pertence o direito exclusivo de utilização, publicação ou tradução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar.","options":["CERTO","ERRADO"],"answer":"A","comment":"Gabarito do caderno: CERTO. Art. 5º, XXVII","collection":"Caderno Oficial AOCP - Direitos e Garantias Fundamentais (20 Questões).pdf"}],"discipline":"Direito Constitucional"},{"id":"direitos_sociais","title":"Direitos Sociais","priority":"MÉDIA","focus":"Arts. 6º a 11: direitos sociais, art. 7º, liberdade sindical, greve e representação.","summary":["Direitos sociais são direitos fundamentais ligados à <mark>igualdade material</mark> e normalmente exigem atuação positiva do Estado.","A AOCP costuma cobrar, com frequência, a <u>literalidade do art. 6º</u> e do <u>art. 7º</u>, especialmente para diferenciar direitos dos trabalhadores urbanos/rurais e a situação dos trabalhadores domésticos.","Também merecem destaque a <mark>liberdade sindical</mark>, o <mark>direito de greve</mark> e a representação dos trabalhadores."],"highlights":["Art. 6º: rol de direitos sociais.","Art. 7º: direitos dos trabalhadores urbanos e rurais.","Art. 8º: liberdade sindical.","Art. 9º: direito de greve.","Arts. 10 e 11: participação e representação dos trabalhadores."],"pegadinhas":["Nem todos os direitos do art. 7º alcançam o trabalhador doméstico de forma idêntica.","Liberdade sindical não elimina a unicidade sindical prevista na Constituição.","Direito de greve não é absoluto."],"law_items":[["Art. 6º","Elenca os <mark>direitos sociais</mark>, como educação, saúde, trabalho, moradia, transporte, lazer, segurança, previdência, proteção à maternidade e assistência aos desamparados."],["Art. 7º","Reúne os direitos dos trabalhadores urbanos e rurais. É um dos dispositivos mais explorados em cobrança literal."],["Art. 8º","Disciplina a <mark>liberdade sindical</mark> e suas limitações constitucionais."],["Art. 9º","Assegura o <mark>direito de greve</mark>, competindo aos trabalhadores decidir sobre a oportunidade de exercê-lo."],["Arts. 10 e 11","Tratam da participação dos trabalhadores e da representação na empresa."]],"juris":[["RE 693.456 / Tema 531 — greve de servidor público","<b>Tese fixada:</b> a Administração deve, em regra, descontar os dias parados em greve de servidores públicos, admitida compensação por acordo. O desconto não é cabível quando a paralisação decorre de conduta ilícita do próprio Poder Público.<br><br><b>AOCP:</b> a greve suspende o vínculo funcional quanto à prestação do serviço nos dias parados.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudenciarepercussao/verandamentoprocesso.asp?classeprocesso=re&incidente=4255687&numeroprocesso=693456&numerotema=531\" target=\"_blank\">Abrir Tema 531 no STF ↗</a>"],["Súmula Vinculante 40 — contribuição confederativa","<b>Enunciado para revisão:</b> a contribuição confederativa prevista no art. 8º, IV, da Constituição somente pode ser exigida dos filiados ao sindicato respectivo.<br><br><b>Pegadinha:</b> não confundir contribuição confederativa com outras espécies de custeio sindical submetidas a regimes jurídicos próprios.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1184\" target=\"_blank\">Abrir conjunto de SVs no STF ↗</a>"]],"questions":[],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"nacionalidade","title":"Nacionalidade","priority":"MÉDIA","focus":"Arts. 12 e 13: brasileiros natos e naturalizados, cargos privativos e perda da nacionalidade.","summary":["Nacionalidade é o <mark>vínculo jurídico-político</mark> entre a pessoa e o Estado. A AOCP costuma cobrar o tema de maneira objetiva e literal.","Os pontos mais importantes são as hipóteses de <u>brasileiro nato</u>, de <u>brasileiro naturalizado</u> e os <mark>cargos privativos de brasileiro nato</mark>.","Também é muito importante não confundir nacionalidade com <u>cidadania</u>, nem com os conceitos de povo e população."],"highlights":["Hipóteses de brasileiro nato.","Hipóteses de naturalização.","Cargos privativos de brasileiro nato.","Perda da nacionalidade.","Idioma oficial e símbolos nacionais."],"pegadinhas":["Cidadania não se confunde com nacionalidade.","O rol de cargos privativos de brasileiro nato é taxativo para prova objetiva.","Perda da nacionalidade exige leitura atualizada do texto constitucional."],"law_items":[["Art. 12, I","Define quem são os <mark>brasileiros natos</mark>."],["Art. 12, II","Define quem são os <mark>brasileiros naturalizados</mark>."],["Art. 12, §3º","Lista os <u>cargos privativos de brasileiro nato</u>."],["Art. 12, §4º","Trata da <mark>perda da nacionalidade</mark>."],["Art. 13","Estabelece o idioma oficial e os símbolos da República."]],"juris":[["RE 1.163.774 / Tema 1.253 — nacionalidade originária por adoção no exterior (2026)","<b>Tese fixada em 2026:</b> o STF reconheceu nacionalidade brasileira originária à pessoa nascida no exterior, adotada por brasileiro e registrada em repartição consular competente, conjugando o art. 12, I, c, com a igualdade entre filhos prevista no art. 227, §6º.<br><br><b>Ponto atual:</b> este é precedente recente e de alta utilidade para atualização do tema nacionalidade.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?classeProcesso=RE&incidente=5553510&numeroProcesso=1163774&numeroTema=1253\" target=\"_blank\">Abrir Tema 1.253 no STF ↗</a>"],["Atenção à atualização constitucional sobre perda da nacionalidade","<b>Para prova:</b> decisões antigas sobre perda de nacionalidade devem ser lidas com cautela, porque o texto constitucional sofreu alteração posterior. No NEXO, a literalidade atual do art. 12 deve prevalecer na revisão objetiva.<br><br><b>Regra de segurança:</b> quando houver conflito entre precedente antigo e redação constitucional superveniente, estude primeiro o texto vigente e depois a jurisprudência compatível com ele."]],"questions":[{"num":"Q6","source":"Instituto AOCP (2024) - MPE-RS - Serviços Técnicos","topic":"Nacionalidade","text":"Nos termos do art. 12 da Constituição Federal, assinale a alternativa que apresenta um cargo privativo de brasileiro nato:","options":["Senador da República.","Governador de Estado e do Distrito Federal.","Ministro do Superior Tribunal de Justiça (STJ).","Presidente da Câmara dos Deputados.","Prefeito de Município com mais de 500 mil habitantes."],"answer":"D","comment":"Gabarito indicado no caderno: D. O art. 12, §3º inclui o Presidente da Câmara dos Deputados entre os cargos privativos de brasileiro nato.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"direitos_politicos","title":"Cidadania e Direitos Políticos","priority":"MÉDIA","focus":"Arts. 14 a 16: soberania popular, voto, elegibilidade, inelegibilidades e anterioridade eleitoral.","summary":["O eixo do tema é a <mark>soberania popular</mark>, exercida pelo sufrágio universal, voto direto e secreto e pelos mecanismos de participação direta.","A AOCP normalmente cobra: <u>voto obrigatório x facultativo</u>, <u>condições de elegibilidade</u>, <u>inelegibilidades</u> e a regra da <mark>anterioridade eleitoral</mark>.","Também é frequente a cobrança da situação constitucional dos militares e da distinção entre perda e suspensão de direitos políticos."],"highlights":["Plebiscito, referendo e iniciativa popular.","Voto obrigatório e facultativo.","Condições de elegibilidade.","Inelegibilidades.","Art. 16: anterioridade eleitoral."],"pegadinhas":["Perda e suspensão dos direitos políticos não são sinônimos.","Militar alistável tem tratamento constitucional específico quanto à elegibilidade.","Iniciativa popular não se confunde com plebiscito nem com referendo."],"law_items":[["Art. 14, caput","A soberania popular será exercida pelo <mark>sufrágio universal</mark> e pelo voto direto e secreto, com valor igual para todos."],["Art. 14, §§ 1º a 4º","Dispõem sobre alistamento, voto, elegibilidade e inelegibilidades."],["Art. 15","Veda a cassação de direitos políticos e prevê hipóteses de <mark>perda e suspensão</mark>."],["Art. 16","Consagra a <mark>anterioridade eleitoral</mark>."]],"juris":[["Súmula Vinculante 18 — inelegibilidade reflexa","<b>Enunciado para revisão:</b> a dissolução do casamento ou união durante o mandato não afasta, por si só, a inelegibilidade reflexa do art. 14, §7º.<br><br><b>Pegadinha:</b> o STF distingue a dissolução voluntária da extinção do vínculo por morte.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudencia/sumariosumulas.asp?base=26&sumula=1245\" target=\"_blank\">Abrir SV 18 no STF ↗</a>"],["RE 758.461 / Tema 678 — morte do cônjuge e SV 18","<b>Tese fixada:</b> a Súmula Vinculante 18 não se aplica quando o vínculo conjugal termina pela morte de um dos cônjuges, pois nessa hipótese não existe a mesma presunção de fraude ou simulação destinada a contornar a inelegibilidade.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?classeProcesso=RE&incidente=4428673&numeroProcesso=758461&numeroTema=678\" target=\"_blank\">Abrir Tema 678 no STF ↗</a>"],["ADPF 1.089 — interpretação restritiva da inelegibilidade","<b>Decisão de 2024:</b> o STF destacou que a inelegibilidade é restrição a direito fundamental político e, por isso, deve ser interpretada restritivamente dentro das hipóteses constitucionais.<br><br><b>AOCP:</b> cuidado com alternativas que ampliem inelegibilidades sem base constitucional ou legal específica.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/constituicao-supremo/artigo.asp?abrirArtigo=14&abrirBase=CF\" target=\"_blank\">Abrir art. 14 na Constituição e o Supremo ↗</a>"]],"questions":[{"num":"Q5","source":"Instituto AOCP (2024) - PC-PA - Escrivão / Investigador","topic":"Direitos Políticos e Inelegibilidade","text":"São inalistáveis e inelegíveis, nos termos expressos do Artigo 14 da Constituição Federal de 1988:","options":["os analfabetos e os maiores de setenta anos.","os estrangeiros e, durante o período do serviço militar obrigatório, os conscritos.","os menores de dezoito anos e os maiores de sessenta e cinco anos.","os analfabetos e os estrangeiros residentes no país há menos de cinco anos.","os conscritos e os analfabetos de forma absoluta."],"answer":"B","comment":"Gabarito indicado no caderno: B. Art. 14, §2º: estrangeiros e conscritos, durante o serviço militar obrigatório, não podem alistar-se como eleitores.","collection":"Caderno Oficial de Questões - Banca Instituto AOCP (2024-2026).pdf"}],"official_questions":[],"discipline":"Direito Constitucional"},{"id":"partidos","title":"Partidos Políticos","priority":"COMPLEMENTAR","focus":"Art. 17: criação, autonomia, caráter nacional e limites constitucionais dos partidos.","summary":["Os partidos políticos integram o núcleo do <mark>pluralismo político</mark> e são essenciais à democracia representativa.","A prova normalmente exige a <u>literalidade do art. 17</u>, sobretudo quanto à liberdade de criação, fusão, incorporação e extinção, autonomia partidária e caráter nacional.","Embora apareça menos no recorte policial, é tema constitucional relevante e passível de cobrança isolada."],"highlights":["Livre criação, fusão, incorporação e extinção.","Caráter nacional.","Autonomia partidária.","Vedação de subordinação a entidade ou governo estrangeiro."],"pegadinhas":["Partidos são pessoas jurídicas de direito privado.","Autonomia partidária não significa liberdade sem limites constitucionais.","É vedada vinculação a governo estrangeiro."],"law_items":[["Art. 17, caput","É livre a criação, fusão, incorporação e extinção de partidos políticos, resguardados soberania nacional, regime democrático, pluripartidarismo e direitos fundamentais."],["Art. 17, §1º","Assegura autonomia para definir estrutura interna, organização e funcionamento."],["Art. 17, §§ seguintes","Trazem disciplina sobre acesso a recursos e funcionamento partidário."]],"juris":[["ADI 4.650 — financiamento eleitoral por pessoas jurídicas","<b>Decisão:</b> o STF declarou inconstitucionais os dispositivos legais que permitiam doações de pessoas jurídicas a campanhas eleitorais e partidos políticos.<br><br><b>Ponto de prova:</b> a decisão relaciona democracia, legitimidade do processo eleitoral e prevenção de abuso do poder econômico.<br><br><a class=\"stf-link\" href=\"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=300015\" target=\"_blank\
